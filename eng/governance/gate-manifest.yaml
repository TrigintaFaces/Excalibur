# Gate Membership Manifest
#
# WHY THIS FILE EXISTS
#   Gate membership was not data anywhere. It was a property you reconstructed by parsing two
#   dispatchers, and every reconstruction was instrument-dependent: two people measuring the
#   same overlap got 2% and 8.5%, and neither was wrong. Four separate findings were each
#   stuck on the same missing fact -- which gates run where. This turns that parsing problem
#   into a lookup.
#
# WHAT IS MEASURED HERE, AND WHAT IS DELIBERATELY NOT
#   MEASURED   path, whether the file exists, whether a DISPATCHER INVOKES it, whether it has
#              a paired .test.sh / .harness-lock.sh, and whether it sits on the published
#              (mirrored) tree or the unpublished one.
#   NOT ASSERTED  `kind`. Gate-versus-reporter is NOT mechanically derivable: a refusal exit
#              and a finding exit share the non-zero space, and which is which lives in the
#              script header prose. Three successive exit-code proxies gave three different
#              answers and the best of them still misread a reporter whose `exit 3` means
#              "tracker unreadable" as a failure. So `kind` ships UNREVIEWED with the proxy
#              and its evidence beside it, to be replaced by a human verdict one entry at a
#              time. A manifest that asserted an inferred kind would encode the very counting
#              error it exists to resolve.
#
# HOW MEMBERSHIP WAS MEASURED, and the trap that governs it
#   Dispatcher COMMENT LINES ARE STRIPPED before matching. A dispatcher's own prose names the
#   gates it deliberately EXCLUDES -- the CI aggregator carries a block listing six locks it
#   does not run and explaining why -- so a raw substring match counts that explanation as a
#   caller and inverts the answer. Measured: four scripts flipped from "CI-referenced" to
#   "referenced nowhere" once comments were removed, and one gate reported as reachable is
#   named only inside a comment. A census that counts mentions is biased toward reporting an
#   unwired gate as wired -- it errs in the direction that HIDES the defect.
#
# runs_in VALUES
#   pre-commit      dispatched by the git pre-commit hook
#   ci              dispatched by a workflow or by the CI gate aggregator
#   pre-commit+ci   both
#   nowhere         invoked by no dispatcher. For a GATE this is an unenforced check. For a
#                   REPORTER it means unused, which is a different and much smaller problem.
#   local-only      DECLARED as deliberately local: its subject lives on the unpublished tree,
#                   so CI cannot see it by design. This value must be authored, never inferred
#                   from absence -- without it, mesh tooling reads as permanently unwired and
#                   inflates the very gate count that is under question.
#
# ENTRIES ARE KEYED BY PATH, never by basename: two scripts in this repo share a stem.
#
