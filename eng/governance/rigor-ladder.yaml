# rigor-ladder.yaml — which class of guarantee each declared seam owes.
#
# Gate: eng/ci/rigor-ladder-gate.sh
#
# THE COVERAGE ORACLE IS BIDIRECTIONAL, and that is what makes this non-vacuous:
#   * every src/**/ARCHITECTURE.md must have an entry here  (declaring a guarantee obliges a rung)
#   * every entry here must name a real ARCHITECTURE.md     (an entry cannot outlive its seam)
# A new guarantee-critical package therefore cannot be added without landing in this file, and the
# gate FAILS rather than silently covering less than it did yesterday.
#
# RUNGS ARE CUMULATIVE. A catastrophic seam owes R1, R2, R3 and R4.
#
# THERE IS NO `floor:` FIELD, DELIBERATELY. It was one, and it was a defect: the gate derives the
# floor from blast_radius through a total, deterministic map, so a written floor carried ZERO
# independent information -- whoever typed it was transcribing, not deciding. A cross-check between
# a value and a deterministic function of that value is a checksum on a transcription, and it stays
# one however many people sign it. Deleting the field makes the inconsistency INEXPRESSIBLE rather
# than detected, which is the stronger form (see enforce-invariants-structurally). What is left is
# the one field that holds a judgement -- blast_radius -- sitting alone where the architect must
# look at it.
#
# blast_radius -> floor:  catastrophic=R4  high=R3  moderate=R2  low=R1
#   catastrophic := a defect silently loses, duplicates or cross-tenant-leaks consumer data AND the
#                   consumer cannot detect it from outside. The discriminator is SILENCE, not severity.

version: "1.0"
declared_at: "2026-09-20"

conventions:
  r2_artifact: "the seam's ARCHITECTURE.md — guarantee in falsifiable terms + the RED-detecting arm"
  r3_artifact: "tests/property/**/*Properties.cs — generated inputs, shrunk counterexample"
  r4_artifact: "spec/tla/<seam>.tla (temporal/distributed) or spec/alloy/<seam>.als (relational)"

# THE `unmet:` LIST IS THE DEBT. There is no separate baseline file -- there was one, and it held
# exactly these rows and nothing else, so the only thing it could catch was a transcription error
# between two files we write ourselves. Deleted.
#
# Each unmet rung is a claim that the seam is UNVERIFIED at that rung. It is NEVER a claim that the
# seam is fine. Nothing mechanical establishes that this list only shrinks -- that is a DIFF property
# and it cannot be known from inside one commit, so the gate does not pretend to. `git diff` on this
# file is the signed, reviewable act. A reviewer asking "is this seam new, or is someone admitting
# debt on an old one?" answers it in one command:
#
#     git log --diff-filter=A -- <the seam's architecture_md>
#
seams:
  - name: outbox
    architecture_md: src/Excalibur/Excalibur.Outbox/ARCHITECTURE.md
    blast_radius: catastrophic
    why: "An atomic claim that is inert publishes one message twice, or marks sent a message never sent. Silent at the consumer."
    met: [R1, R2]
    unmet: [R3, R4]

  - name: elasticsearch-projection-errors
    architecture_md: src/Excalibur/Excalibur.Data.ElasticSearch/ARCHITECTURE.md
    blast_radius: catastrophic
    why: "A dropped projection-error record is the only durable evidence that a projection failed, so its loss is silent: nothing downstream ever learns the projection broke."
    met: [R1, R2]
    unmet: [R3, R4]

  # NEW SEAM, not a reclassification. The second guarantee in the same package's
  # ARCHITECTURE.md, declared because the entry above describes dropped error records and
  # says nothing about where a projection writes. Adding it RAISES the enumerated debt by
  # two rungs, which is the honest direction: the guarantee existed undeclared before.
  - name: elasticsearch-projection-index-identity
    architecture_md: src/Excalibur/Excalibur.Data.ElasticSearch/ARCHITECTURE.md
    blast_radius: catastrophic
    why: "Two read models resolving to one index on one cluster overwrite each other wherever their document ids coincide. No error is raised, nothing is logged, and nothing downstream ever learns the read model is wrong."
    met: [R1, R2]
    unmet: [R3, R4]

  - name: outbox-redis
    architecture_md: src/Excalibur/Excalibur.Outbox.Redis/ARCHITECTURE.md
    blast_radius: catastrophic
    why: "A superseded tenure can mark a message sent: the scope fence and the per-row token are separate round trips."
    met: [R1, R2]
    unmet: [R3, R4]

  - name: inbox
    architecture_md: src/Excalibur/Excalibur.Inbox/ARCHITECTURE.md
    blast_radius: catastrophic
    why: "Dedup that does not hold turns exactly-once into at-least-once with no signal to the handler."
    met: [R1, R2]
    unmet: [R3, R4]

  - name: leader-election
    architecture_md: src/Excalibur/Excalibur.LeaderElection/ARCHITECTURE.md
    blast_radius: catastrophic
    why: "Split brain. Two holders each believe they are sole leader; fencing tokens are the only thing between that and double-processing."
    met: [R1, R2]
    unmet: [R3, R4]

  - name: event-sourcing
    architecture_md: src/Excalibur/Excalibur.EventSourcing/ARCHITECTURE.md
    blast_radius: catastrophic
    why: "A lost or misordered append is unrecoverable: the stream IS the record, there is no second copy to reconcile against."
    # SCOPE WARNING -- this ONE row covers SEVEN guarantees, because the manifest's unit is the FILE and
    # this ARCHITECTURE.md declares seven: tenant isolation, atomic append, append reporting, stored
    # message identity, global stream ordering, and position-conditional projection writes. The `why`
    # above describes only the append. `met: [R1, R2]` is therefore a single verdict over all seven, and
    # a vacuous R2 arm on any one of them still reads as met here.
    #
    # It also makes the artifact-exists-is-not-rung-discharged trap STRUCTURAL rather than hypothetical:
    # tests/property/Excalibur.EventSourcing.Properties/PositionedProjectionProperties.cs matches the
    # r3_artifact glob but covers the positioned-fold guarantee, not every guarantee in this file.
    # Its generator now emits existing unnumbered rows and deletion schedules. The named never-fold
    # arm requires terminal refusal with unchanged row/position for the unnumbered precondition and
    # requires that this precondition was sampled. Adoption and absent-precondition generator mutants
    # must redden that named arm (piema6); a passing file-pattern check alone proves none of this.
    #
    # Splitting this into one row per guarantee is the right shape and is NOT done here: the coverage
    # oracle is bidirectional on architecture_md paths, so seven rows would need seven files or a gate
    # change. Tracked; the rung assignment is the architect's.
    #
    # R3 ALSO EXISTS FOR THE ROSTER, AND THE ROW VERDICT DELIBERATELY DOES NOT MOVE.
    # tests/property/Excalibur.EventSourcing.Properties/SubscriptionRosterProperties.cs discharges R3 for
    # the SUBSCRIPTION ROSTER / attestation guarantee only: 4 generated arms over 400 cases each, binding
    # AsyncProjectionProcessingHost.UnattestableMembers directly, and non-vacuous in BOTH directions --
    # a production mutation returning an empty set reddens it, AND a generator mutation that makes the
    # divergence unreachable reddens its own non-vacuity guard rather than passing silently.
    #
    # The roster suite says nothing about the other guarantees on this file: tenant isolation, atomic append,
    # append reporting, stored message identity, global stream ordering, or position-conditional
    # projection writes. Promoting this row to met: [R1, R2, R3] would assert R3 over all seven on the
    # strength of these partial suites, which is exactly what the warning above forbids. The row stays
    # honest and the detail lives here until the row is split.
    #
    # R4 is likewise UNVERIFIED, and a reader should not infer otherwise from the existence of
    # spec/tla/cooperative-projection/. That model carries a CORRESPONDENCE WITHDRAWN block for its
    # manifest binder: it models a single scalar bound first-writer-wins, where a host with a different
    # workset is REFUSED, and production now admits such a host and refuses only its attestation. Its
    # other arms (page gate, row CAS, prefix, checkpoint coverage, visibility) are unaffected. It is also
    # not invoked by spec/tla/check-models.sh, so nothing reddens if it regresses.
    # SubscriptionRoster.tla preserves the no-witness counterexamples, including the stale-roster
    # window and the independent local-quantifier defect. Keep the expected failures so rejected
    # designs cannot silently turn green.
    #
    # READ THIS BEFORE CALLING THOSE COUNTEREXAMPLES "HISTORICAL". An earlier revision of this
    # comment said they "are not the current shipped protocol", which invites a reader to conclude
    # the bad state is unreachable. It is not. Verified against the shipped C# 2026-10-29:
    # AsyncProjectionProcessingHost.cs:258 reads the roster ONCE and attests from that same snapshot
    # at :270-274, with no third read and none possible. A member bound after that read is therefore
    # not covered, and the save still reports success. What changed is the CLAIM, not the state
    # space: the strong invariant InvNoFalseFresh was RESTATED, not discharged.
    #
    # The restatement is now honest in the code as well as the prose: the save-time receipt is a
    # distinct value (ProjectionFreshness.Attested) from the read-time verdict (Fresh), which is
    # issued only after IProjectionSessionReader re-validates roster identity, binding, position and
    # destination around the data read. Before that split one value stood for both strengths, so no
    # assertion could tell a receipt from a verdict.
    #
    # The earlier window -- a bind between the roster read and the fold -- IS genuinely closed, by
    # the progress-independent identity fingerprint at SubscriptionRoster.cs:68-80 compared at
    # AsyncProjectionProcessingHost.cs:259. Do not read the correction above as withdrawing that.
    # BindingLifetime.tla models the current bounded lifetime/read protocol: unique epochs,
    # nullable/zero checkpoints, captured advance/release, producer observation receipts, and
    # consumer-owned witness -> data -> validation. Check-BindingLifetime.ps1 retains hashes,
    # exact commands, TLC logs/state counts, mutation counterexamples and reachability probes.
    # Its explicit scope does NOT prove SQL atomicity/isolation, physical projection folding,
    # crash durability, hash collision resistance, tenant routing or generation-pointer cutover.
    # Those premises have separate real-engine/runtime evidence. The complete architecture row
    # still covers multiple guarantees and is NOT promoted to R4 from one bounded roster model.
    # Run both the historical harness and current lifetime checker before citing their results.
    met: [R1, R2]
    unmet: [R3, R4]

  - name: saga
    architecture_md: src/Excalibur/Excalibur.Saga/ARCHITECTURE.md
    blast_radius: catastrophic
    why: "Tenant isolation and event dedup. A dedup key colliding on simple type name silently discards distinct events."
    met: [R1, R2]
    unmet: [R3, R4]

  - name: cdc-postgres
    architecture_md: src/Excalibur/Excalibur.Cdc.Postgres/ARCHITECTURE.md
    blast_radius: catastrophic
    why: "A checkpoint advancing past undelivered changes loses them permanently, and the position looks healthy afterwards."
    met: [R1, R2]
    unmet: [R3, R4]

  - name: cdc-sqlserver
    architecture_md: src/Excalibur/Excalibur.Cdc.SqlServer/ARCHITECTURE.md
    blast_radius: catastrophic
    why: "A per-table checkpoint that advances past a change the handler never completed drops it silently, and a demoted leader's write would do the same."
    met: [R1, R2]
    unmet: [R3, R4]

  - name: compliance-erasure
    architecture_md: src/Excalibur/Excalibur.Compliance/ARCHITECTURE.md
    blast_radius: catastrophic
    # SUPERSEDED 2026-10-01, and the old wording is quoted because it is instructive rather than
    # merely wrong. It read: "A Completed erasure certificate that a region failover undoes is a
    # false compliance statement held by a regulated consumer." An adversarial review could not
    # CONSTRUCT that execution against the shipped code and said so: MultiRegionKeyProvider
    # .DeleteKeyAsync destroys in both regions and throws rather than returning a state, its
    # destruction-status answer requires every region to agree, and SyncKeysToRegionAsync copies no
    # key material at all -- so a failover cannot resurrect a destroyed key. The failover fault is
    # real and runs the OTHER WAY: it loses the record, it does not falsify it. Modelling the old
    # sentence would have produced a correct proof about a trajectory this system does not fly.
    why: "Erasure must preserve the request's exact tenant owner, destroy only that owner's key handles,
      and bind destruction evidence to both handle and generation. Irreversible provider effects and
      durable receipts must remain consistent across retries and failover: neither a missing key nor a
      scheduled deletion alone proves completed destruction. The owner and recovery models cover
      bounded safety and recovery obligations, assuming truthful provider confirmation; they do not
      establish cloud-provider refinement or every concurrent remint and cross-request execution.
      R3 and R4 remain unmet until those remaining obligations have evidence. Previous-alpha data
      migration is outside the supported greenfield transition."
    met: [R1, R2]
    unmet: [R3, R4]

  - name: dispatch-pipeline
    architecture_md: src/Dispatch/Excalibur.Dispatch/ARCHITECTURE.md
    blast_radius: catastrophic
    why: "A middleware silently skipped or reordered produces no error. An authorization middleware that did not run looks exactly like one that ran and permitted. This row also covers scheduled-occurrence execution, whose failures are silent in the same way: an occurrence admitted by two hosts runs twice with nothing downstream learning, and one admitted by none is simply never dispatched."
    met: [R1, R2]
    unmet: [R3, R4]

  - name: transport-settlement
    architecture_md: src/Dispatch/Excalibur.Dispatch.Transport.Abstractions/ARCHITECTURE.md
    blast_radius: catastrophic
    why: "Settling twice has two contradictory answers across transports; a reject(requeue) reported successful that did not redeliver loses the message."
    met: [R1, R2]
    unmet: [R3, R4]

  - name: audit-logging
    architecture_md: src/Excalibur/Excalibur.AuditLogging/ARCHITECTURE.md
    blast_radius: high
    why: "A broken hash chain is detectable by the consumer on verification, but only after the fact."
    met: [R1, R2]
    unmet: [R3]
