\* The SHIPPED configuration: the allocation is serialised to commit and the increment is inside the
\* appending transaction. check-models.sh does NOT read this file -- it copies the module and generates a
\* config per arm so it can vary both constants -- so this exists for running TLC BY HAND against the
\* shipped design, which is a thing a reader should be able to do.
\*
\* It previously could not be run at all. It assigned TransactionalAllocation, which the module does not
\* declare (TLC refuses to start on an unknown constant), and it OMITTED both constants the module does
\* declare. Nothing caught it: the runner generates its own configs, and the rigor-ladder gate resolves R4
\* by the .tla file existing, so a broken config beside a working model is invisible to both.
\* RUN IT WITH -deadlock, which DISABLES TLC's deadlock check:
\*
\*   java -cp tla2tools.jar tlc2.TLC -deadlock -config EventStoreGlobalPosition.cfg EventStoreGlobalPosition.tla
\*
\* Without that flag TLC reports "Error: Deadlock reached" and a reader concludes the model is broken. It
\* is not: MaxAppends bounds the run, so the state after the last append has no enabled action, and a
\* terminal state is what TLC calls a deadlock when no termination property is declared. No invariant is
\* violated there. check-models.sh passes -deadlock for this reason (its TLC wrapper at :39).
\* Verified with the flag: "Model checking completed. No error has been found." -- 17 distinct states,
\* complete-graph depth 9, which is the same depth the runner's adequacy probe reports.
SPECIFICATION Spec
CONSTANTS
    Writers = {w1, w2, w3}
    MaxAppends = 4
    SerialisedToCommit = TRUE
    CounterRollsBack = TRUE
INVARIANT TypeOK
INVARIANT InvariantJ
INVARIANT InvUnique
INVARIANT InvA
