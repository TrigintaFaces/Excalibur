version: 2

updates:
  # NuGet package updates
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    groups:
      # Group Microsoft packages
      microsoft-packages:
        patterns:
          - "Microsoft.*"
          - "System.*"
      # Group Azure SDK packages
      azure-packages:
        patterns:
          - "Azure.*"
      # Group AWS SDK packages
      aws-packages:
        patterns:
          - "AWSSDK.*"
      # Group Google Cloud packages
      google-packages:
        patterns:
          - "Google.*"
      # Group test frameworks
      test-packages:
        patterns:
          - "xunit*"
          - "Shouldly"
          - "FakeItEasy"
          - "TestContainers*"

  # npm updates. Every open Dependabot alert on this repo is npm, across these three lockfiles;
  # without an entry here the alerts are raised but no update PR is ever opened for them.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/docs-site"
      - "/src/Excalibur/Excalibur.Operations.Dashboard.Spa/ClientApp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    ignore:
      # TypeScript MAJORS only. A grouped dev-dependency bump proposed typescript 7, which cannot
      # resolve here for two independent reasons: svelte-check peers on `^5.0.0 || ^6.0.0`, so
      # `npm ci` fails outright with ERESOLVE, and TypeScript 7 removed `baseUrl`, which the
      # docs-site tsconfig sets (TS5102). Both are upstream facts, not something this repository can
      # fix, so the proposal can only ever fail CI and be reopened next week.
      #
      # Scoped to major deliberately: minor and patch TypeScript updates still flow. Remove this
      # entry once svelte-check accepts TypeScript 7 and the tsconfig drops baseUrl -- it is a
      # statement about a current incompatibility, not a policy about TypeScript.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Dev-only toolchain (build, test, lint) moves together; these are the majority of npm churn
      # and none of it ships to a consumer.
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
