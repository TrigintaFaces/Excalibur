version: 2

updates:
  # NuGet package updates
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    groups:
      # Group Microsoft packages
      microsoft-packages:
        patterns:
          - "Microsoft.*"
          - "System.*"
      # Group Azure SDK packages
      azure-packages:
        patterns:
          - "Azure.*"
      # Group AWS SDK packages
      aws-packages:
        patterns:
          - "AWSSDK.*"
      # Group Google Cloud packages
      google-packages:
        patterns:
          - "Google.*"
      # Group test frameworks
      test-packages:
        patterns:
          - "xunit*"
          - "Shouldly"
          - "FakeItEasy"
          - "TestContainers*"

  # npm updates. Every open Dependabot alert on this repo is npm, across these three lockfiles;
  # without an entry here the alerts are raised but no update PR is ever opened for them.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/docs-site"
      - "/src/Excalibur/Excalibur.Operations.Dashboard.Spa/ClientApp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    ignore:
      # TypeScript MAJORS only. A grouped dev-dependency bump proposed typescript 7, which cannot
      # resolve here for two independent reasons: svelte-check peers on `^5.0.0 || ^6.0.0`, so
      # `npm ci` fails outright with ERESOLVE, and TypeScript 7 removed `baseUrl`, which the
      # docs-site tsconfig sets (TS5102). Both are upstream facts, not something this repository can
      # fix, so the proposal can only ever fail CI and be reopened next week.
      #
      # Scoped to major deliberately: minor and patch TypeScript updates still flow. Remove this
      # entry once svelte-check accepts TypeScript 7 and the tsconfig drops baseUrl -- it is a
      # statement about a current incompatibility, not a policy about TypeScript.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Dev-only toolchain (build, test, lint) moves together; these are the majority of npm churn
      # and none of it ships to a consumer.
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]

  # Container images in Dockerfiles and compose files. There was no docker ecosystem here at all, so
  # nothing has ever proposed an update to a base or service image -- while actions and NuGet were
  # both maintained. Measured across the tracked Dockerfiles and compose files: two images ride a
  # mutable `latest` tag, RabbitMQ appears at three different versions (one of them a floating
  # major), and Elasticsearch and Kibana are each pinned at two different versions in different
  # samples while the test fixtures use a third.
  #
  # This matters more than usual because most of these files are under samples/ and templates/, which
  # SHIP. A consumer following a sample runs the image it names, so a stale or floating image there is
  # a consumer-facing defect rather than an internal inconvenience -- and it is the one class of
  # staleness we cannot fix for them after the fact.
  #
  # Grouped deliberately: ungrouped this would open a pull request per image per directory across ~20
  # directories, and a review queue nobody can keep up with is how dependency updates start getting
  # rubber-stamped.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/samples/**"
      - "/templates/**"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    groups:
      container-images:
        patterns: ["*"]

  # GitHub Actions updates
  #
  # ⚠ A ROOT ENTRY SCANS .github/workflows AND NOTHING ELSE. Composite actions under
  # .github/actions/** are a separate scan target and need an entry naming each directory, or they
  # are silently left behind: the workflow files move to the new pin, the composite actions they CALL
  # stay on the old one, and the repository ends up running two versions of the same action with no
  # error anywhere. Measured 2026-10-26 on the public mirror: a Dependabot bump of
  # actions/upload-artifact touched 17 workflow files and zero of the 5 call sites inside
  # .github/actions, so merging it would have been a partial upgrade that looked complete.
  #
  # Each composite action directory listed below must exist. When one is added or renamed, add or
  # rename its entry here too -- there is no glob, and a missing entry fails silent rather than loud.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "github-actions"
    directory: "/.github/actions/build-and-test"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "github-actions"
    directory: "/.github/actions/setup-dotnet-build"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # .NET SDK updates (global.json). Dependabot's dotnet-sdk ecosystem, not a scheduled workflow:
  # Actions are deliberately off in this repository as a cost decision, and this adds no runs to that
  # budget. SDK patches land on patch Tuesday, so weekly is ample.
  #
  # ⚠ A PR FROM THIS WILL BE RED, BY CONSTRUCTION, AND THAT IS THE SIGNAL — NOT A BUG TO SILENCE.
  # Dependabot edits global.json and nothing else. Because global.json pins rollForward "disable" and
  # this repository restores with lock files, bumping the SDK alone leaves the committed dependency
  # graph behind and the locked-mode restore in official-build.yml fails with NU1004 (measured
  # 2026-10-08: 10.0.400 -> 10.0.401 moved Microsoft.NET.ILLink.Tasks and failed on 192 projects).
  #
  # Things that must land WITH the version bump, and none of them is automatable here. Corrected
  # 2026-10-26 while performing the 10.0.402 -> 10.0.403 bump: item 1 below was already stale and a
  # gate input was missing, so this list is what was actually required, measured.
  #   1. every packages.lock.json, regenerated under the NEW SDK: `dotnet restore Excalibur.sln
  #      -p:BuildExamplesAndTests=true --force-evaluate`. Measured on 10.0.403: 193 files, 3 lines
  #      each, all of it Microsoft.NET.ILLink.Tasks 10.0.13 -> 10.0.14. Verify with the same restore
  #      under --locked-mode, which is what CI runs.
  #   2. eng/ci/inline-native-aot-known-diagnostics.json -> properties.NETCoreSdkVersion. THIS IS A
  #      GATE INPUT, not provenance: eng/ci/inline-native-aot-verdict.py compares the evaluated
  #      properties against this baseline and RAISES on any difference, so a bump that misses it
  #      fails the native-AOT verdict with a message about properties rather than about the SDK.
  #   3. eng/ci/aot-warning-baseline.json — ILLink rides the SDK unpinned, so a bump moves the
  #      trimmer; this is the one step that can surface real findings rather than mechanical churn.
  #      Re-measuring it needs a Native AOT publish, so it does not fall out of a normal build. The
  #      SDK version also appears in two justification strings in that file: those are a historical
  #      record of an observation and are NOT updated by a later bump.
  #
  # NOT on this list, though it used to be: .github/workflows/official-build.yml. It reads
  # `global-json-file: global.json` and names no version, so nothing there needs editing. Re-check
  # before trusting that, but do not go hunting for a pin that is no longer there.
  #
  # Do NOT resolve the red by loosening rollForward. See the comment on
  # RestorePackagesWithLockFile in Directory.Build.props for why "disable" is correct here.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "dotnet-sdk"
