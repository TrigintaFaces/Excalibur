name: 'Build and Test'
description: 'Composite action: SDK install, NuGet cache, restore, build, and test a solution filter. Requires actions/checkout BEFORE this action.'

inputs:
  solution-filter:
    description: 'Solution filter path (.slnf) to restore, build, and test'
    required: true
  test-filter:
    description: 'dotnet test --filter value (empty to run all tests in the slnf)'
    required: false
    default: ''
  collect-coverage:
    description: 'Collect XPlat Code Coverage (true/false)'
    required: false
    default: 'false'
  blame-timeout:
    description: 'Timeout for blame hang detection'
    required: false
    default: '5m'
  results-prefix:
    description: 'Prefix for TRX log file names (LogFilePrefix)'
    required: true
  test-session-timeout:
    description: 'Test session timeout in milliseconds'
    required: false
    default: '900000'
  max-cpu-count:
    description: 'Maximum parallel test processes (-m:N). Empty for default parallelism.'
    required: false
    default: ''
  free-disk-space:
    description: 'Free disk space on Ubuntu before build'
    required: false
    default: 'false'
  quarantine-mode:
    description: 'Quarantine filter mode: Exclude (default), Include, or None'
    required: false
    default: 'Exclude'
  base-test-filter:
    description: 'Base test filter before quarantine processing'
    required: false
    default: '(Category=Unit|Category=DependencyInjection)&Category!=Performance'
  extra-run-settings:
    description: 'Extra RunSettings/xUnit args appended after the RunSettings separator (e.g. "xUnit.MaxParallelThreads=1 xUnit.ParallelizeTestCollections=false"). Requires collect-coverage or a session timeout so a "--" separator precedes them.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Free disk space (Ubuntu)
      if: inputs.free-disk-space == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo rm -rf /usr/local/lib/android &            # ~12GB
        sudo rm -rf /opt/hostedtoolcache/CodeQL &       # ~6GB
        sudo rm -rf /usr/share/swift &                  # ~1.5GB
        sudo rm -rf /opt/ghc &
        sudo rm -rf /home/linuxbrew &
        sudo rm -rf /usr/local/.ghcup &
        sudo rm -rf /usr/local/share/boost &
        sudo rm -rf /usr/local/share/powershell &
        wait
        sudo apt-get clean || true
        docker system prune -af 2>/dev/null || true

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: .nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      shell: bash
      run: dotnet restore ${{ inputs.solution-filter }} --verbosity quiet

    - name: Build
      shell: bash
      # -p:BuildExamplesAndTests=true is REQUIRED, and its absence is silent.
      #
      # Directory.Build.targets sets SkipProjectBuild on any project whose path contains \tests\,
      # \examples\ or \benchmarks\ unless this property is true, and then does
      # <Compile Remove="**\*.cs" />. The project does not fail and does not warn: it removes its own
      # source and succeeds. Measured on Windows, both arms, one variable:
      #
      #   without the property : "Skipping compile for Excalibur.Data.Tests
      #                           (examples/tests/benchmarks disabled)"   ->  Build succeeded.
      #   with the property    : (compiles)                               ->  Build succeeded.
      #
      # Identical exit code, identical summary. The ONLY distinguishing evidence is a High-importance
      # log line that --verbosity quiet discards -- so the console output of a build that compiled
      # nothing is indistinguishable from one that compiled everything. `dotnet test --no-build` then
      # runs whatever assembly is present, which on a clean runner is an assembly with no tests in it.
      #
      # The path condition uses BACKSLASHES, so it matches on Windows runners and not on Linux or
      # macOS. That is why this could be wrong for a long time while most of the matrix stayed green.
      #
      # The sibling setup-dotnet-build action already did all of this. This one did none of it.
      run: |
        dotnet build ${{ inputs.solution-filter }} --configuration Release --no-restore --verbosity quiet -p:BuildExamplesAndTests=true \
          -fileLoggerParameters:Verbosity=normal\;LogFile=build-verbosity-normal.log

    - name: Assert the build actually compiled the test projects
      shell: bash
      # The console cannot answer this, so the assertion reads the normal-verbosity file log. Without
      # it the property above could be dropped again and nothing would go red.
      run: bash eng/ci/assert-compiled-not-skipped.sh build-verbosity-normal.log

    - name: Compose test filter
      if: inputs.quarantine-mode != 'None'
      id: filter
      shell: pwsh
      run: |
        $filterInfo = ./eng/ci/get-test-filter.ps1 -BaseFilter '${{ inputs.base-test-filter }}' -Mode ${{ inputs.quarantine-mode }} -AsJson | ConvertFrom-Json
        "TEST_FILTER=$($filterInfo.filter)" >> $env:GITHUB_ENV
        Write-Host "Using test filter with $($filterInfo.count) quarantine adjustments."

    - name: Set default test filter
      if: inputs.quarantine-mode == 'None'
      shell: bash
      run: echo "TEST_FILTER=${{ inputs.test-filter }}" >> $GITHUB_ENV

    - name: Run tests
      shell: bash
      run: |
        # `dotnet test` accepts exactly ONE RunSettings separator, so every setting must be
        # collected here and emitted after a single "--" at the end. A branch that emits its own
        # separator silently swallows the settings every later branch would have added, and the
        # loss is invisible: the run still starts, still passes, and simply ignores the setting.
        ARGS=(
          "dotnet" "test" "${{ inputs.solution-filter }}"
          "--configuration" "Release"
          "--no-build"
          "--blame-hang-timeout" "${{ inputs.blame-timeout }}"
          "--logger" "trx;LogFilePrefix=${{ inputs.results-prefix }}"
          "--logger" "console;verbosity=minimal"
          "--results-directory" "./TestResults"
        )
        RUNSETTINGS=()

        if [ -n "$TEST_FILTER" ]; then
          ARGS+=("--filter" "$TEST_FILTER")
        fi

        if [ "${{ inputs.collect-coverage }}" = "true" ]; then
          ARGS+=("--collect:XPlat Code Coverage")
          RUNSETTINGS+=("DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura")
        fi

        # -m:N is a dotnet-test argument, NOT a RunSetting: it must precede the separator or it
        # is parsed as a setting name and silently does nothing.
        if [ -n "${{ inputs.max-cpu-count }}" ]; then
          ARGS+=("-m:${{ inputs.max-cpu-count }}")
        fi

        # Applies on every run, with or without coverage. The session timeout is what ends a
        # wedged run itself, emitting a TRX that names how far it got; without it the job is
        # killed by the workflow-level wall and reports nothing at all.
        if [ -n "${{ inputs.test-session-timeout }}" ]; then
          RUNSETTINGS+=("RunConfiguration.TestSessionTimeout=${{ inputs.test-session-timeout }}")
        fi

        # Extra RunSettings/xUnit args (e.g. serial execution for the transport shard, which
        # avoids a concurrency-dependent native-thread leak that roots the host). Word-split
        # intentionally.
        if [ -n "${{ inputs.extra-run-settings }}" ]; then
          RUNSETTINGS+=(${{ inputs.extra-run-settings }})
        fi

        if [ ${#RUNSETTINGS[@]} -gt 0 ]; then
          ARGS+=("--" "${RUNSETTINGS[@]}")
        fi

        # Echo the composed command: a dropped or misplaced argument is otherwise invisible in
        # the log, which is what let the session timeout stay inert across every coverage run.
        printf '[build-and-test] %s\n' "${ARGS[*]}"
        "${ARGS[@]}"
