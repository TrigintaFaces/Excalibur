name: 'Setup .NET Build Environment'
description: 'Composite action for shared .NET build setup: checkout, SDK install, NuGet cache, and optional restore/build.'

inputs:
  telemetry-matrix:
    description: 'Optional caller matrix context as JSON; absent context remains unknown'
    required: false
    default: ''
  checkout-ref:
    description: >-
      Git ref to checkout. Empty (the default) means the ref that triggered the
      workflow, which is what every caller in this repository wants. This was
      declared required:true while all six call sites omitted it -- the contract
      said one thing and every caller did another. It is optional because the
      empty default is correct, not merely tolerated.
    required: false
    default: ''
  checkout-token:
    description: 'Token for checkout (defaults to github.token)'
    required: false
    default: ''
  fetch-depth:
    description: 'Number of commits to fetch (0 for full history)'
    required: false
    default: '1'
  solution-filter:
    description: 'Solution filter path for restore/build (empty to skip restore/build)'
    required: false
    default: ''
  restore-only:
    description: 'If true, only restore without building'
    required: false
    default: 'false'
  free-disk-space:
    description: 'Free disk space on Ubuntu before build (useful for SAST/heavy jobs)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.checkout-ref }}
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Free disk space (Ubuntu)
      if: inputs.free-disk-space == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/swift || true
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true
        sudo rm -rf /home/linuxbrew || true
        sudo rm -rf /usr/local/.ghcup || true
        sudo rm -rf /usr/local/share/boost || true
        sudo apt-get clean || true
        docker system prune -af || true

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json
    # A hosted runner can present an EMPTY user-level NuGet.Config. When it does, every dotnet
    # command in the job dies with "NuGet.Config is not valid XML ... Root element is missing", and
    # the failure names a file nobody in this repository wrote. Measured on this runner image twice:
    # it killed the nightly composition battery's self-test, and after that was fixed in nightly.yml
    # it killed the SAME battery again in governance.yml, because the first fix was applied to one
    # caller instead of to the setup every caller shares. This is that sweep.
    #
    # Idempotent by construction: it rewrites only when the file is absent, empty, or unparseable, so
    # a runner image that ships a valid config (with credentials or extra sources) is left alone. The
    # parse assertion afterwards means a silent failure to repair cannot pass for a repair.
    - name: Ensure a valid user-level NuGet config
      shell: bash
      run: |
        set -euo pipefail
        cfg="$HOME/.nuget/NuGet/NuGet.Config"
        mkdir -p "$(dirname "$cfg")"
        if [ ! -s "$cfg" ] || ! python3 -c "import sys,xml.etree.ElementTree as ET; ET.parse(sys.argv[1])" "$cfg" 2>/dev/null; then
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<configuration>'
            echo '  <packageSources>'
            echo '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />'
            echo '  </packageSources>'
            echo '</configuration>'
          } > "$cfg"
          echo "wrote a valid user-level NuGet config at $cfg"
        else
          echo "existing user-level NuGet config parses as XML; left untouched"
        fi
        python3 -c "import sys,xml.etree.ElementTree as ET; ET.parse(sys.argv[1]); print('verified parseable')" "$cfg"

    - name: Capture NuGet cache request
      id: cache-request
      shell: bash
      env:
        PRIMARY_KEY: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        RESTORE_KEY: ${{ runner.os }}-nuget-
      run: |
        printf 'primary-key=%s\nrestore-key=%s\n' "$PRIMARY_KEY" "$RESTORE_KEY" >> "$GITHUB_OUTPUT"

    - name: Cache NuGet packages
      id: nuget-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .nuget/packages
        key: ${{ steps.cache-request.outputs.primary-key }}
        restore-keys: |
          ${{ steps.cache-request.outputs.restore-key }}

    - name: Restore dependencies
      if: inputs.solution-filter != ''
      shell: bash
      env:
        SOLUTION_FILTER: ${{ inputs.solution-filter }}
      run: dotnet restore "$SOLUTION_FILTER" --verbosity quiet

    - name: Build
      if: inputs.solution-filter != '' && inputs.restore-only != 'true'
      shell: bash
      env:
        SOLUTION_FILTER: ${{ inputs.solution-filter }}
      # The file logger is what makes the next step possible. A project can be skipped -- its source
      # removed -- and still exit 0 printing "0 Error(s)", so the ONLY thing distinguishing a skipped
      # project from a compiled one is a High-importance log line that `--verbosity quiet` discards.
      # Console stays quiet; the file log is written at normal verbosity so the assertion below has
      # something to read.
      run: |
        # BuildExamplesAndTests is REQUIRED. Directory.Build.targets skips compiling any project whose
        # path Contains('\tests\') unless it is set -- a BACKSLASH, so it matches on Windows and never
        # on Linux. Without it the identical command builds different things per platform: on Linux
        # test projects compile; on Windows they are silently skipped into EMPTY assemblies, the test
        # step finds no tests, and xUnit v3 dies parsing "No test matches the given testcase filter"
        # as a catastrophic error naming neither the skip nor the platform.
        # -bl emits an MSBuild BINARY log alongside the text one. The text log is what the assertion
        # below grades; the binlog is what a human needs when the assertion PASSES and the build was
        # still wrong. It records every target, property and skip decision, which a Verbosity=normal
        # text log does not, and it is the standard diagnostic in .NET repositories for this reason.
        dotnet build "$SOLUTION_FILTER" --configuration Release --no-restore --verbosity quiet -p:BuildExamplesAndTests=true \
          -fileLoggerParameters:Verbosity=normal\;LogFile=build-verbosity-normal.log \
          -bl:build.binlog

    - name: Assert the build compiled what it claims
      if: inputs.solution-filter != '' && inputs.restore-only != 'true'
      shell: bash
      # Three states, and REFUSE is not a pass: 0 everything compiled, 1 a project was silently
      # skipped, 2 the log could not be graded. Without this, "the solution builds clean" is a claim
      # whose evidence looks identical whether it held or not.
      run: bash eng/ci/assert-compiled-not-skipped.sh build-verbosity-normal.log

    # The evidence must outlive the runner. These logs were written, graded, and then discarded --
    # so when a Windows job reported "No test matches the given testcase filter" for an assembly
    # holding 845 tests, and the skip assertion above had PASSED, the one artifact that could
    # distinguish a hole in that assertion from an entirely different cause no longer existed. The
    # failure was diagnosable only while it was happening, which is not when anyone is looking.
    #
    # always() is load-bearing: uploading diagnostics only when the build succeeded is the exact
    # inversion of what they are for.
    - name: Upload build logs (a failure is diagnosed AFTER it happens)
      if: always() && inputs.solution-filter != '' && inputs.restore-only != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: build-logs-${{ github.job }}-${{ strategy.job-index || '0' }}
        path: |
          build-verbosity-normal.log
          build.binlog
        if-no-files-found: warn
        retention-days: 14

    # Record after required work so diagnostic failure cannot prevent these build/test steps.
    # This observes restore only; actions/cache saves in a later post-job step.
    - name: Record NuGet cache restore observation
      id: cache-observation
      if: always()
      shell: bash
      env:
        CI_CACHE_ACTION: setup-dotnet-build
        CI_CACHE_FILTER: ${{ inputs.solution-filter }}
        CI_CACHE_MATRIX: ${{ inputs.telemetry-matrix }}
        CI_CACHE_KEY: ${{ steps.cache-request.outputs.primary-key }}
        CI_CACHE_RESTORE_KEYS: ${{ steps.cache-request.outputs.restore-key }}
        CI_CACHE_OUTCOME: ${{ steps.nuget-cache.outcome }}
        CI_CACHE_CONCLUSION: ${{ steps.nuget-cache.conclusion }}
        CI_CACHE_HIT: ${{ steps.nuget-cache.outputs.cache-hit }}
      run: python3 eng/ci/record-cache-observation.py

    - name: Preserve NuGet cache restore observation
      if: always() && steps.cache-observation.outputs.id != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ci-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.cache-observation.outputs.id }}
        path: ${{ steps.cache-observation.outputs.path }}
        if-no-files-found: error
        retention-days: 14
