name: 'Setup .NET Build Environment'
description: 'Composite action for shared .NET build setup: checkout, SDK install, NuGet cache, and optional restore/build.'

inputs:
  checkout-ref:
    description: >-
      Git ref to checkout. Empty (the default) means the ref that triggered the
      workflow, which is what every caller in this repository wants. This was
      declared required:true while all six call sites omitted it -- the contract
      said one thing and every caller did another. It is optional because the
      empty default is correct, not merely tolerated.
    required: false
    default: ''
  checkout-token:
    description: 'Token for checkout (defaults to github.token)'
    required: false
    default: ''
  fetch-depth:
    description: 'Number of commits to fetch (0 for full history)'
    required: false
    default: '1'
  solution-filter:
    description: 'Solution filter path for restore/build (empty to skip restore/build)'
    required: false
    default: ''
  restore-only:
    description: 'If true, only restore without building'
    required: false
    default: 'false'
  free-disk-space:
    description: 'Free disk space on Ubuntu before build (useful for SAST/heavy jobs)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ inputs.checkout-ref }}
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Free disk space (Ubuntu)
      if: inputs.free-disk-space == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/swift || true
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true
        sudo rm -rf /home/linuxbrew || true
        sudo rm -rf /usr/local/.ghcup || true
        sudo rm -rf /usr/local/share/boost || true
        sudo apt-get clean || true
        docker system prune -af || true

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      if: inputs.solution-filter != ''
      shell: bash
      run: dotnet restore ${{ inputs.solution-filter }} --verbosity quiet

    - name: Build
      if: inputs.solution-filter != '' && inputs.restore-only != 'true'
      shell: bash
      # The file logger is what makes the next step possible. A project can be skipped -- its source
      # removed -- and still exit 0 printing "0 Error(s)", so the ONLY thing distinguishing a skipped
      # project from a compiled one is a High-importance log line that `--verbosity quiet` discards.
      # Console stays quiet; the file log is written at normal verbosity so the assertion below has
      # something to read.
      run: |
        # BuildExamplesAndTests is REQUIRED. Directory.Build.targets skips compiling any project whose
        # path Contains('\tests\') unless it is set -- a BACKSLASH, so it matches on Windows and never
        # on Linux. Without it the identical command builds different things per platform: on Linux
        # test projects compile; on Windows they are silently skipped into EMPTY assemblies, the test
        # step finds no tests, and xUnit v3 dies parsing "No test matches the given testcase filter"
        # as a catastrophic error naming neither the skip nor the platform.
        dotnet build ${{ inputs.solution-filter }} --configuration Release --no-restore --verbosity quiet -p:BuildExamplesAndTests=true \
          -fileLoggerParameters:Verbosity=normal\;LogFile=build-verbosity-normal.log

    - name: Assert the build compiled what it claims
      if: inputs.solution-filter != '' && inputs.restore-only != 'true'
      shell: bash
      # Three states, and REFUSE is not a pass: 0 everything compiled, 1 a project was silently
      # skipped, 2 the log could not be graded. Without this, "the solution builds clean" is a claim
      # whose evidence looks identical whether it held or not.
      run: bash eng/ci/assert-compiled-not-skipped.sh build-verbosity-normal.log
