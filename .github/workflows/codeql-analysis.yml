name: "CodeQL Security Analysis"

on:
  push:
    branches: [ main, develop ]
    # NO paths filter, deliberately. This workflow's job is a REQUIRED status check on main, and a
    # required check that never runs is not skipped -- it is reported as "Expected - waiting for
    # status to be reported", forever. GitHub documents no way for a path-filtered workflow to
    # satisfy a required context; the only sanctioned alternatives are a second workflow that
    # reports the same name unconditionally, which manufactures a green for work that never happened,
    # or simply running it. We run it.
    #
    # Measured, on the first documentation-only pull request: this filter excluded a docs change, the
    # workflow never started, and the pull request was blocked with nothing running and nothing to
    # re-run. The button was greyed out on a check that could not arrive.
    #
    # The cost is CodeQL minutes on changes that touch no code. That is the correct trade for a
    # security gate: dotnet/efcore's build workflow, whose checks gate its merges, likewise declares
    # no paths filter at all and runs on every pull request.
  pull_request:
    branches: [ main, develop ]
    # NO paths filter, deliberately. This workflow's job is a REQUIRED status check on main, and a
    # required check that never runs is not skipped -- it is reported as "Expected - waiting for
    # status to be reported", forever. GitHub documents no way for a path-filtered workflow to
    # satisfy a required context; the only sanctioned alternatives are a second workflow that
    # reports the same name unconditionally, which manufactures a green for work that never happened,
    # or simply running it. We run it.
    #
    # Measured, on the first documentation-only pull request: this filter excluded a docs change, the
    # workflow never started, and the pull request was blocked with nothing running and nothing to
    # re-run. The button was greyed out on a check that could not arrive.
    #
    # The cost is CodeQL minutes on changes that touch no code. That is the correct trade for a
    # security gate: dotnet/efcore's build workflow, whose checks gate its merges, likewise declares
    # no paths filter at all and runs on every pull request.
  schedule:
    # Run weekly on Mondays at 02:00 UTC
    - cron: '0 2 * * 1'
  # A required context must be produceable on EVERY event that gates a merge, and the queue is one of
  # them. Without this trigger the workflow simply never starts for a queued change, and a required
  # check that never runs is not skipped -- it reports "Expected - waiting for status to be reported",
  # forever, exactly as the push/pull_request notes above describe. The queue would hang on a check
  # that cannot arrive, with nothing to re-run.
  #
  # Inert until the queue is enabled on the repository, which is a setting rather than content.
  merge_group:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  # Event-aware: a PUSH keys the group by run id, so it shares a group with nothing and cannot be
  # superseded -- neither while running nor while queued. Every commit on a protected branch must
  # reach a verdict, and a ref-keyed group with an unconditional cancel silently denied that to
  # any commit followed quickly by another. Superseding a stale PULL REQUEST run is still wanted,
  # so PRs group by number and keep cancel-in-progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze C# Code
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          # Query suites: security-extended provides comprehensive security coverage
          queries: security-extended
          config: |
            paths-ignore:
              - 'archive/**'
              - 'management/**'
              - 'tools/**'
              - '**/obj/**'
              - '**/bin/**'

      - name: Restore shipping projects
        run: bash ./build.sh --restore --project eng/ci/shards/ShippingOnly.slnf

      - name: Build shipping projects
        run: bash ./build.sh --build --no-restore --project eng/ci/shards/ShippingOnly.slnf

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: "/language:${{matrix.language}}"

      - name: Upload CodeQL results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codeql-results
          path: ${{ github.workspace }}/.codeql
          retention-days: 30

      - name: Check for critical findings
        if: always()
        run: |
          # Fail build if critical or high severity findings are detected
          # This script would parse SARIF output from CodeQL
          echo "Checking for critical/high severity findings..."
          # Add SARIF parsing logic here if needed
      # See secret-scan.yml: this is one of four required contexts and wrote no summary, so a failure
      # blocked the merge while explaining nothing. always() -- the failing case is the one that needs it.
      - name: Report result
        if: always()
        run: |
          bash eng/ci/job-summary.sh             --title "CodeQL Security Analysis (C#)"             --verdict "${{ job.status == 'success' && 'pass' || 'fail' }}"             --detail "CodeQL analysed the C# sources for security findings"             --next "Open the Security tab's code-scanning alerts for this run. A finding is triaged, not dismissed: fix it, or record why it is not exploitable here."
