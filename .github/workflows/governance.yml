name: Governance Validation

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: 'Git ref to checkout'
        required: true
        type: string
      checkout-token:
        description: 'Token for checkout (defaults to github.token)'
        required: false
        type: string
        default: ''
      event-name:
        description: 'The triggering event name (push, pull_request, etc.)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  solution-governance:
    name: Solution Governance Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code (needed to resolve local composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Setup .NET build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          checkout-ref: ${{ inputs.checkout-ref }}
          checkout-token: ${{ inputs.checkout-token }}
          solution-filter: ''

      - name: Validate consolidated governance stack
        shell: pwsh
        run: |
          ./eng/ci/validate-governance-stack.ps1 -Enforce:$true

      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solution-governance-report
          path: |
            artifacts/reports/SolutionGovernanceReport
            artifacts/reports/FrameworkGovernanceReport
          retention-days: 14

  package-dependency-graph:
    name: Package Dependency Graph Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code (needed to resolve local composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Setup .NET build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          checkout-ref: ${{ inputs.checkout-ref }}
          checkout-token: ${{ inputs.checkout-token }}
          solution-filter: 'eng/ci/shards/ShippingOnly.slnf'

      - name: Validate nuspec dependency graph (blocking)
        shell: pwsh
        run: |
          ./eng/ci/validate-nuspec-dependencies.ps1 -SolutionFilter eng/ci/shards/ShippingOnly.slnf -OutDir artifacts/reports/PackageDependencyReport -Version "0.0.0-ci-${{ github.run_number }}" -Enforce:$true

      - name: Upload dependency graph report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-dependency-report
          path: artifacts/reports/PackageDependencyReport
          retention-days: 14

  package-composition:
    name: Package Composition Validation (T2.4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code (needed to resolve local composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Setup .NET build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          checkout-ref: ${{ inputs.checkout-ref }}
          checkout-token: ${{ inputs.checkout-token }}
          solution-filter: 'eng/ci/shards/ShippingOnly.slnf'

      - name: Pack Dispatch to local feed
        shell: pwsh
        run: |
          Write-Host "Packing Dispatch projects to local feed..."
          ./eng/pack-local.ps1 -Version "0.0.0-ci-${{ github.run_number }}" -NoBuild
          Write-Host "Packages created in artifacts/_packages/"

      - name: Clear NuGet cache (avoid stale packages)
        run: |
          dotnet nuget locals http-cache --clear
          dotnet nuget locals temp --clear

      - name: Restore Excalibur with PackageReference mode
        run: |
          echo "Restoring Excalibur with PackageReference mode..."
          find src/Excalibur -name '*.csproj' -print0 | while IFS= read -r -d '' proj; do
            dotnet restore "$proj" \
              -p:UsePackageReferences=true \
              -p:DispatchPackageVersion=0.0.0-ci-${{ github.run_number }} \
              -p:ExcaliburPackageVersion=0.0.0-ci-${{ github.run_number }}
          done

      - name: Build Excalibur with PackageReference mode
        run: |
          echo "Building Excalibur with PackageReference mode..."
          find src/Excalibur -name '*.csproj' -print0 | while IFS= read -r -d '' proj; do
            dotnet build "$proj" \
              --configuration Release \
              --no-restore \
              -p:UsePackageReferences=true \
              -p:DispatchPackageVersion=0.0.0-ci-${{ github.run_number }} \
              -p:ExcaliburPackageVersion=0.0.0-ci-${{ github.run_number }}
          done

      - name: Validate sample builds against packages
        run: |
          echo "Validating sample compilation..."
          dotnet build samples/01-getting-started/DispatchMinimal/Excalibur.DispatchMinimal.csproj \
            --configuration Release \
            --no-restore \
            -p:UsePackageReferences=true \
            -p:DispatchPackageVersion=0.0.0-ci-${{ github.run_number }} \
            -p:ExcaliburPackageVersion=0.0.0-ci-${{ github.run_number }} || true

      - name: Package composition summary
        if: always()
        run: |
          echo "## Package Composition Validation (T2.4)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package Version:** 0.0.0-ci-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Packed Dispatch projects to local feed" >> $GITHUB_STEP_SUMMARY
          echo "2. Built Excalibur with PackageReference mode" >> $GITHUB_STEP_SUMMARY
          echo "3. Validated sample compilation" >> $GITHUB_STEP_SUMMARY

  public-api-baselines:
    name: Public API Baseline Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Run PublicAPI baseline audit
        shell: pwsh
        run: |
          ./eng/ci/public-api-baseline-audit.ps1 -OutDir artifacts/reports/PublicApiBaselineReport -Enforce $true

      - name: Upload PublicAPI baseline report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-api-baseline-report
          path: artifacts/reports/PublicApiBaselineReport
          retention-days: 14

  transitive-bloat:
    name: Transitive Bloat Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code (needed to resolve local composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Setup .NET build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          checkout-ref: ${{ inputs.checkout-ref }}
          checkout-token: ${{ inputs.checkout-token }}
          solution-filter: ''

      - name: Restore dependencies
        run: bash ./build.sh --restore
      - name: Generate transitive bloat report (blocking)
        shell: pwsh
        env:
          PACK_ENFORCE: 'true'
        run: |
          ./eng/ci/transitive-bloat-report.ps1 -OutputDir artifacts/reports/TransitiveBloatReport

      - name: Upload transitive bloat report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: transitive-bloat-report
          path: artifacts/reports/TransitiveBloatReport
          retention-days: 14

  repo-inventory:
    name: Repo Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code (needed to resolve local composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Setup .NET build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          checkout-ref: ${{ inputs.checkout-ref }}
          checkout-token: ${{ inputs.checkout-token }}
          solution-filter: ''

      - name: Generate repository inventory
        shell: pwsh
        run: |
          # NON-BLOCKING by design: -FailOnGuardrailBreach is deliberately absent.
          #
          # This step produces a dependency inventory REPORT. Nothing consumes it to make a decision,
          # and its only failure mode was a stopwatch: it shells out to `dotnet list package
          # --include-transitive` once per project, 180 times, and used to fail the build when any
          # single call ran long. It did exactly that after completing all 180 snapshots successfully.
          #
          # A failure there says nothing about the code under test -- only that enumeration was slow on
          # a cold NuGet cache. A reporting tool that red-lights a build on its own latency produces
          # failures with no diagnostic content, which is how a gate stops being read. The report is
          # still generated and still uploaded; a guardrail breach now surfaces as a warning naming the
          # projects involved.
          #
          # PerProjectTimeoutSeconds is no longer passed here so the script's own default applies.
          # Pinning it at 45 in this file overrode the default and made correcting the default inert --
          # the same trap that hid the performance gate's stale row count.
          ./eng/ci/repo-inventory.ps1 `
            -Output "artifacts/reports/dependency-inventory.md" `
            -ProjectRoot "src" `
            -TotalBudgetMinutes 12 `
            -MaxDependencyProjects 180

      - name: Upload inventory report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-inventory
          path: artifacts/reports/dependency-inventory.md

  specs-location-lint:
    name: Specs Location Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Verify specs live under management/specs/**
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p artifacts/reports
          report="artifacts/reports/specs-location-violations-${GITHUB_RUN_ID}.md"
          echo "# Specs Location Violations" > "$report"
          echo "Run: ${GITHUB_RUN_ID}" >> "$report"
          echo "" >> "$report"
          violations=$(git ls-files | grep -Ei '/Specs/' | grep -vi '^management/specs/') || true
          if [ -n "$violations" ]; then
            echo "Found specs outside management/specs:" >> "$report"
            echo "$violations" | sed 's/^/- /' >> "$report"
            echo "::error::Specs must be under management/specs (the repository requires all specs to live under management/specs)"
            exit 1
          else
            echo "No violations detected." >> "$report"
          fi

      - name: Upload specs guard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: specs-location-violations
          path: artifacts/reports/specs-location-violations-${{ github.run_id }}.md
