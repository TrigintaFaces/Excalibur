name: Nightly CI Build

on:
  schedule:
    # Run at 04:00 UTC daily
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      skip_integration_tests:
        description: 'Skip integration tests (Docker-dependent)'
        required: false
        default: false
        type: boolean

# No cancel-in-progress -- nightly builds should always complete
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # Deterministic unit test shards (self-contained, no artifact sharing)
  deterministic-unit-tests:
    name: Deterministic Unit Tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: core, filter: "eng/ci/shards/UnitTests-Core.slnf" }
          - { name: transport, filter: "eng/ci/shards/UnitTests-Transport.slnf" }
          - { name: middleware, filter: "eng/ci/shards/UnitTests-Middleware.slnf" }
          # Split three ways -- see the note in quality-gates.yml.
          - { name: excalibur-data, filter: "eng/ci/shards/UnitTests-Excalibur-Data.slnf" }
          - { name: excalibur-platform, filter: "eng/ci/shards/UnitTests-Excalibur-Platform.slnf" }
          - { name: excalibur-messaging, filter: "eng/ci/shards/UnitTests-Excalibur-Messaging.slnf" }
          - { name: observability, filter: "eng/ci/shards/UnitTests-Observability.slnf" }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # The repository entry point, not an inlined sequence. The same command a contributor runs.
      - name: Restore and build
        run: bash ./build.sh --build --project ${{ matrix.shard.filter }} --verbosity quiet

      - name: Run Unit Tests
        run: |
          bash eng/ci/run-filtered-tests.sh \
            --filter "(Category=Unit|Category=DependencyInjection)&Category!=Performance" -- \
            ${{ matrix.shard.filter }} \
            --configuration Release \
            --no-build \
            --blame-hang-timeout 5m \
            --logger "trx;LogFilePrefix=nightly-unit-${{ matrix.shard.name }}" \
            --logger "console;verbosity=minimal" \
            --results-directory ./TestResults \
            -- RunConfiguration.TestSessionTimeout=600000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-unit-${{ matrix.shard.name }}
          path: TestResults/*.trx
          retention-days: 14

  # Integration tests (self-contained, single-threaded for Docker stability)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: deterministic-unit-tests
    if: ${{ !inputs.skip_integration_tests }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore and build
        run: bash ./build.sh --build --project eng/ci/shards/IntegrationTests.slnf --verbosity quiet

      # This job is the ONLY place the Cosmos provider is exercised — ci.yml excludes it from the PR
      # path, so a Cosmos regression is caught here or nowhere. The gate moved here with the tests.
      #
      # REFUSE, never skip: if the runner cannot host the emulator, this job must terminate with a
      # status distinct from both pass and ordinary test failure. A silently-skipped emulator yields a
      # green that means nothing, which is the defect this gate exists to prevent.
      #
      # SCOPE: this proves the RUNNER can host the emulator. It does NOT prove the fixtures can reach
      # it — they go through Testcontainers CosmosDbBuilder + CosmosClient and this step does not. Do
      # not cite a green here as evidence the Cosmos tests can run.
      - name: Cosmos emulator infrastructure pre-check
        shell: bash
        run: |
          set -uo pipefail
          bash eng/ci/cosmos-readiness-gate.sh
          GATE_EXIT=$?
          if [ "$GATE_EXIT" -ne 0 ]; then
            echo "::error::REFUSE — the runner could not host the Cosmos emulator (exit $GATE_EXIT). No Cosmos test was skipped and no pass is reported; the required infrastructure is missing."
            exit "$GATE_EXIT"
          fi

      - name: Run Integration Tests (-m:1)
        id: integration-tests
        continue-on-error: true
        run: |
          bash eng/ci/run-filtered-tests.sh \
            --filter "Category=Integration|Category=EndToEnd" -- \
            eng/ci/shards/IntegrationTests.slnf \
            --configuration Release \
            --no-build \
            -m:1 \
            --blame-hang-timeout 10m \
            --logger "trx;LogFilePrefix=nightly-integration" \
            --logger "console;verbosity=minimal" \
            --results-directory ./TestResults \
            -- RunConfiguration.TestSessionTimeout=1800000

      - name: Verify integration test results
        if: always()
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Path ./TestResults -Filter "*.trx" -Recurse

          # REFUSE on nothing-measured. With no TRX the loop below never executes, $totalFailed stays 0,
          # and the old code reported "All integration tests passed" — a green earned by measuring
          # nothing. That matters more here than anywhere: this job is the only one that runs the Cosmos
          # provider, so a refusing emulator produces zero results and would otherwise report success for
          # the exact suite it failed to run.
          if ($trxFiles.Count -eq 0) {
            Write-Error "REFUSE: no TRX results found. Nothing was measured, so nothing passed."
            exit 1
          }

          $totalFailed = 0
          $totalExecuted = 0
          $totalTests = 0
          foreach ($trx in $trxFiles) {
            [xml]$xml = Get-Content $trx.FullName
            $counters = $xml.TestRun.ResultSummary.Counters
            $failed = [int]$counters.failed
            $passed = [int]$counters.passed
            $total = [int]$counters.total
            $executed = [int]$counters.executed
            Write-Host "$($trx.Name): passed=$passed failed=$failed executed=$executed total=$total"
            $totalFailed += $failed
            $totalExecuted += $executed
            $totalTests += $total
          }

          # A TRX that exists but executed nothing is the same false green one layer in.
          if ($totalExecuted -eq 0) {
            Write-Error "REFUSE: $($trxFiles.Count) TRX file(s) present but 0 tests executed."
            exit 1
          }

          if ($totalFailed -gt 0) {
            Write-Error "Integration tests had $totalFailed failure(s)"
            exit 1
          }
          Write-Host "All $totalExecuted executed integration tests passed (of $totalTests total; test host may have crashed during cleanup -- this is non-fatal)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-integration
          path: TestResults/*.trx
          retention-days: 14

  # Package composition validation (self-contained)
  package-composition:
    name: Package Composition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Validate package composition
        shell: pwsh
        run: ./eng/validate-package-composition.ps1

  # Dependency vulnerability audit. Produces the per-project SARIF the compliance control-evidence
  # map cites; NuGetAudit in Directory.Build.props is what actually gates a build.
  # -MaxProjects is a runaway guard and must stay ABOVE the project population (198 in src/ today).
  # It was 180: breached on every run since the 181st project, failing the job nightly on a
  # configuration fault while reporting no vulnerabilities.
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x

      - name: Run dependency audit
        shell: pwsh
        run: |
          ./eng/ci/dependency-audit.ps1 `
            -OutDir management/reports/DependencyAuditReport `
            -ProjectRoot src `
            -PerProjectTimeoutSeconds 120 `
            -TotalBudgetMinutes 15 `
            -MaxProjects 400 `
            -FailOnGuardrailBreach

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-dependency-audit
          path: management/reports/DependencyAuditReport
          retention-days: 14

  # npm audit. Deliberately nightly and not on the PR path, matching NuGetAudit's disposition in
  # Directory.Build.props: an advisory published overnight against an untouched package must not break
  # unrelated work. Dependency Review (security.yml, PR-only) is what stops new vulnerable deps
  # entering; this catches advisories raised against dependencies already here.
  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      # The gate is only evidence if it can fail. Drives the shipped threshold and parsing functions
      # with canned audit documents -- no network, no install.
      - name: Prove the gate is non-vacuous
        run: bash eng/ci/npm-audit.sh --self-test

      - name: Audit every lockfile
        run: bash eng/ci/npm-audit.sh

  # Nightly summary + failure notification
  # "Flake rate and top offenders are visible weekly." Nightly rather than weekly, because the input
  # is retained test results and reading them more often costs nothing.
  #
  # It does NOT retry anything. A retry in the test path is one edit away from turning red green:
  # once a rerun's success becomes the job's result, a flaky test is indistinguishable from a healthy
  # one and the signal is destroyed at the moment it is produced. Tests run once, that result stands,
  # and flakiness is read from history instead -- a test that both passed and failed across the
  # window is flaky by observation.
  #
  # Advisory by construction: this job reports and never gates. A flake report that can fail the
  # build becomes a thing people route around, and then it stops being read at all.
  flake-report:
    name: Flake Report (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read   # to list recent runs and download their retained test results
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Gather test results from recent CI runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flake-input
          # Successful runs only would hide every flake, since a flake most often shows up in a run
          # that failed. Take recent COMPLETED runs regardless of conclusion.
          runs="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow=ci.yml --status completed \
                    --limit 12 --json databaseId --jq '.[].databaseId')"
          n=0
          for r in $runs; do
            if gh run download "$r" --repo "${GITHUB_REPOSITORY}" --pattern 'test-results-*' \
                 --dir "flake-input/run-$r" >/dev/null 2>&1; then
              n=$((n + 1))
            fi
          done
          echo "gathered results from ${n} run(s)"
          echo "trx files: $(find flake-input -name '*.trx' | wc -l)"

      # Its own arms first: a report nobody can see fail is not evidence.
      - name: flake-report self-test (non-vacuity)
        run: python3 eng/ci/flake-report.py --self-test

      - name: Report
        shell: bash
        run: |
          set -euo pipefail
          # REFUSE (exit 2) means nothing was measured, which is NOT the same as no flakes. Surface
          # it as a warning rather than silence -- but do not fail, because this job is advisory.
          rc=0
          python3 eng/ci/flake-report.py --glob 'flake-input/**/*.trx' > flake-report.md || rc=$?
          cat flake-report.md >> "$GITHUB_STEP_SUMMARY" || true
          cat flake-report.md
          if [ "$rc" -eq 2 ]; then
            echo "::warning::Flake report could not be produced: no parseable test results in the window. This is 'no data', not 'no flakes'."
          fi

      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flake-report
          path: flake-report.md
          if-no-files-found: warn
          retention-days: 30

  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: [deterministic-unit-tests, integration-tests, package-composition, dependency-audit, npm-audit]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute nightly results
        id: results
        shell: bash
        run: |
          # Check job outcomes from needs context
          unit="${{ needs.deterministic-unit-tests.result }}"
          integration="${{ needs.integration-tests.result }}"
          packages="${{ needs.package-composition.result }}"
          audit="${{ needs.dependency-audit.result }}"
          npmaudit="${{ needs.npm-audit.result }}"

          failures=""
          if [ "$unit" != "success" ]; then failures="${failures}deterministic-unit-tests ($unit), "; fi
          if [ "$integration" != "success" ] && [ "$integration" != "skipped" ]; then failures="${failures}integration-tests ($integration), "; fi
          if [ "$packages" != "success" ]; then failures="${failures}package-composition ($packages), "; fi
          if [ "$audit" != "success" ]; then failures="${failures}dependency-audit ($audit), "; fi
          if [ "$npmaudit" != "success" ]; then failures="${failures}npm-audit ($npmaudit), "; fi

          if [ -z "$failures" ]; then
            echo "status=passed" >> "$GITHUB_OUTPUT"
            echo "failures=" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "failures=${failures%, }" >> "$GITHUB_OUTPUT"
          fi

      - name: Post nightly summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Nightly CI Build Summary"
            echo ""
            echo "- **Status:** ${{ steps.results.outputs.status == 'passed' && 'PASSED' || 'FAILED' }}"
            echo "- **Date:** $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            echo "- **Ref:** ${{ github.sha }}"
            echo ""
            echo "## Job Results"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Deterministic Unit Tests | ${{ needs.deterministic-unit-tests.result }} |"
            echo "| Integration Tests | ${{ needs.integration-tests.result }} |"
            echo "| Package Composition | ${{ needs.package-composition.result }} |"
            echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |"
            echo "| npm Dependency Audit | ${{ needs.npm-audit.result }} |"
            if [ -n "${{ steps.results.outputs.failures }}" ]; then
              echo ""
              echo "## Failures"
              echo ""
              echo "${{ steps.results.outputs.failures }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub issue on failure
        if: steps.results.outputs.status == 'failed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // ONE issue per persistent failure, not one per night. This previously created
            // 'Nightly CI failure: <date>' unconditionally, so a defect lasting a fortnight produced
            // fourteen issues -- and a backlog nobody triages is indistinguishable from no reporting.
            // The failing job names are the fingerprint: the same set failing again is the same
            // incident; a different set is a new one.
            const failures = '${{ steps.results.outputs.failures }}';
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const today = new Date().toISOString().split('T')[0];

            const fingerprint = failures.split(String.fromCharCode(10)).map(l => l.trim()).filter(Boolean).sort().join('|').slice(0, 120) || 'unclassified';
            const marker = '<!-- nightly-fingerprint: ' + fingerprint + ' -->';

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-nightly', per_page: 100,
            });
            const match = existing.find(i => (i.body || '').includes(marker));

            if (match) {
              // Comment rather than duplicate, so occurrence count and first-seen date stay on one
              // thread and the issue's age reflects how long this has actually been broken.
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number,
                body: ['Recurred on **' + today + '** - [run ' + context.runId + '](' + runUrl + '), commit ' + context.sha + '.', '', 'Still failing:', '', failures].join(String.fromCharCode(10)),
              });
              core.notice('Nightly failure recurred; commented on #' + match.number + ' rather than opening a duplicate.');
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Nightly CI failure: ' + fingerprint.split('|')[0].slice(0, 60),
                body: [
                  '## Nightly CI Build Failed', '',
                  '**First seen:** ' + today,
                  '**Run:** [' + context.runId + '](' + runUrl + ')',
                  '**Commit:** ' + context.sha, '',
                  '### Failed Jobs', '', failures, '',
                  '### Action Required', '',
                  'Investigate and fix the failing jobs before the next nightly run. Recurrences are added',
                  'as comments on this issue rather than as new issues, so the age of this thread is how',
                  'long the defect has been live.', '',
                  marker,
                ].join(String.fromCharCode(10)),
                labels: ['ci-nightly', 'bug'],
              });
              core.notice('Opened #' + created.data.number + ' for a nightly failure not seen before.');
            }
