name: Nightly CI Build

on:
  schedule:
    # Run at 04:00 UTC daily
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      skip_integration_tests:
        description: 'Skip integration tests (Docker-dependent)'
        required: false
        default: false
        type: boolean

# No cancel-in-progress -- nightly builds should always complete
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # Deterministic unit test shards (self-contained, no artifact sharing)
  deterministic-unit-tests:
    name: Deterministic Unit Tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: core, filter: "eng/ci/shards/UnitTests-Core.slnf" }
          - { name: transport, filter: "eng/ci/shards/UnitTests-Transport.slnf" }
          - { name: middleware, filter: "eng/ci/shards/UnitTests-Middleware.slnf" }
          # Split three ways -- see the note in quality-gates.yml.
          - { name: excalibur-data, filter: "eng/ci/shards/UnitTests-Excalibur-Data.slnf" }
          - { name: excalibur-platform, filter: "eng/ci/shards/UnitTests-Excalibur-Platform.slnf" }
          - { name: excalibur-messaging, filter: "eng/ci/shards/UnitTests-Excalibur-Messaging.slnf" }
          - { name: observability, filter: "eng/ci/shards/UnitTests-Observability.slnf" }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # The repository entry point, not an inlined sequence. The same command a contributor runs.
      - name: Restore and build
        run: bash ./build.sh --build --project ${{ matrix.shard.filter }} --verbosity quiet

      - name: Run Unit Tests
        run: |
          bash eng/ci/run-filtered-tests.sh \
            --filter "(Category=Unit|Category=DependencyInjection)&Category!=Performance" -- \
            ${{ matrix.shard.filter }} \
            --configuration Release \
            --no-build \
            --blame-hang-timeout 5m \
            --logger "trx;LogFilePrefix=nightly-unit-${{ matrix.shard.name }}" \
            --logger "console;verbosity=minimal" \
            --results-directory ./TestResults \
            -- RunConfiguration.TestSessionTimeout=600000

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-unit-${{ matrix.shard.name }}
          path: TestResults/*.trx
          retention-days: 14

  # Integration tests (self-contained, single-threaded for Docker stability)
  integration-tests:
    name: Integration Tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    needs: deterministic-unit-tests
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_integration_tests) }}
    strategy:
      fail-fast: false
      matrix:
        # SPLIT, because the union does not fit one budget and never will again. These two shards are
        # exactly the projects the old catch-all carried, so coverage is unchanged -- what changes is
        # that each leg gets its own clock. Measured on this runner: the union needed ~54 minutes of
        # tests against a 60-minute job, and the suite it must carry next is nearly twice the size.
        #
        # Both legs genuinely start a Cosmos emulator (34 emulator-starting classes in the Excalibur
        # project, 3 in the Dispatch one), so BOTH declare emulator-scope 'in' and both must produce
        # execution evidence. That is why this split could not land until the Excalibur fixtures began
        # emitting it -- with one evidence writer in the tree, an 'in' leg without it REFUSES.
        shard:
          - name: dispatch
            filter: eng/ci/shards/IntegrationTests-Dispatch.slnf
          - name: excalibur
            filter: eng/ci/shards/IntegrationTests-Excalibur.slnf
    # 120, not 60, and the 60 is why this job failed eight nights running. Measured on the mirror
    # 2026-09-28: every step passed -- the Cosmos pre-check, the run, the emulator-reached gate, the
    # results check -- with 3,913 tests across four assemblies and ZERO failures, and the job was then
    # killed by "exceeded the maximum execution time of 1h0m0s" while saving the NuGet cache. About 54
    # minutes of tests plus build and setup does not fit in 60.
    #
    # This job runs the CATCH-ALL shard serially, where ci.yml splits the same work across seven
    # parallel legs (eng/ci/integration-excalibur-legs.txt). Matching that split here is the better
    # fix and is tracked; raising the cap is the one that can be made safely without a trial run,
    # since a timeout is a ceiling rather than an allocation and standard runners are free on a
    # public repository.
    #
    # Per LEG now, not for the union. Projected from this runner's own measured rates against the
    # suite about to arrive: dispatch ~24 minutes of tests, excalibur ~56, plus ~5 minutes of setup
    # and build each.
    #
    # The WALL must stay strictly above the session cap below (75m), or the runner kills the job
    # before the cap can fire and the cap enforces nothing -- which is what the workflow-hygiene gate
    # caught when I first set both to 90. The gap is what buys a NAMED timeout error instead of an
    # anonymous cancellation, and the ~15 minutes of it is also the cache-save window that killed the
    # unsplit job.
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore and build
        run: bash ./build.sh --build --project ${{ matrix.shard.filter }} --verbosity quiet

      # REFUSE, never skip: if the runner cannot host the emulator, this job must terminate with a
      # status distinct from both pass and ordinary test failure. A silently-skipped emulator yields a
      # green that means nothing, which is the defect this gate exists to prevent.
      #
      # SCOPE: this proves the RUNNER can host the emulator. It does NOT prove the fixtures can reach
      # it — they go through Testcontainers CosmosDbBuilder + CosmosClient and this step does not. Do
      # not cite a green here as evidence the Cosmos tests can run.
      - name: Verify nightly integration failure controls
        if: matrix.shard.name == 'dispatch'
        shell: pwsh
        run: |
          $hostPath = (Get-Command dotnet -CommandType Application | Select-Object -First 1).Source
          $resolvedHost = [IO.File]::ResolveLinkTarget($hostPath, $true)
          if ($null -ne $resolvedHost) { $hostPath = $resolvedHost.FullName }
          ./eng/ci/nightly-integration-evidence.test.ps1 -DotnetPath $hostPath

      - name: Preserve nightly failure-control evidence
        if: always() && matrix.shard.name == 'dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-integration-failure-controls
          path: |
            artifacts/tools/nightly-evidence-control-*/**/*.log
            artifacts/tools/nightly-evidence-control-*/**/*.json
            artifacts/tools/nightly-evidence-control-*/**/*.trx
          if-no-files-found: error
          retention-days: 14

      - name: Cosmos emulator infrastructure pre-check
        shell: bash
        run: |
          set -uo pipefail
          bash eng/ci/cosmos-readiness-gate.sh
          GATE_EXIT=$?
          if [ "$GATE_EXIT" -ne 0 ]; then
            echo "::error::REFUSE — the runner could not host the Cosmos emulator (exit $GATE_EXIT). No Cosmos test was skipped and no pass is reported; the required infrastructure is missing."
            exit "$GATE_EXIT"
          fi

      - name: Run Integration Tests (-m:1)
        id: integration-tests
        shell: pwsh
        env:
          # Emulator-backed suites append one record here per test that genuinely reached the emulator.
          # A skipped test writes nothing, which is the entire point: this is the one signal a skip
          # cannot produce, and the liveness gate below reads it.
          COSMOS_EVIDENCE_FILE: ${{ github.workspace }}/TestResults/nightly-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard.name }}/cosmos-execution-evidence.tsv
        run: |
          ./eng/ci/nightly-integration-evidence.ps1 -Mode Run `
            -Source '${{ matrix.shard.filter }}' -Shard '${{ matrix.shard.name }}' `
            -ResultsDirectory './TestResults/nightly-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard.name }}'

      # Exact test identities and successful outcomes cannot distinguish an availability guard's
      # early return from a real assertion. Require positive emulator reachability separately.
      # This proves some reachability in this run, not per-test provider coverage.
      - name: Verify the emulator was actually reached
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          bash eng/ci/cosmos-liveness-gate.sh \
            "${{ github.workspace }}/TestResults/nightly-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard.name }}/cosmos-execution-evidence.tsv" \
            in
          GATE_EXIT=$?
          if [ "$GATE_EXIT" -ne 0 ]; then
            echo "::error::The integration run produced no evidence of reaching the Cosmos emulator (exit $GATE_EXIT). A suite that guards its tests with an early return reports them as executed and passed, so the counters cannot show this. Treat any green from this job as unearned until this passes."
            exit "$GATE_EXIT"
          fi

      - name: Verify integration test results
        if: always()
        shell: pwsh
        env:
          INTEGRATION_RUN_OUTCOME: ${{ steps.integration-tests.outcome }}
        run: |
          ./eng/ci/nightly-integration-evidence.ps1 -Mode Verify `
            -Source '${{ matrix.shard.filter }}' -Shard '${{ matrix.shard.name }}' `
            -ResultsDirectory './TestResults/nightly-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard.name }}' `
            -RunnerOutcome $env:INTEGRATION_RUN_OUTCOME

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-integration-${{ matrix.shard.name }}
          path: TestResults/nightly-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard.name }}/**
          if-no-files-found: error
          retention-days: 14

  # Package composition validation (self-contained)
  package-composition:
    name: Package Composition
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      # A fresh runner has no user-level NuGet.Config; the first dotnet command creates it. The
      # composition battery below launches many dotnet restores, so two of them can race to create
      # that file and a loser observes it zero-length -- which NuGet reports as
      # "NuGet.Config is not valid XML / Root element is missing" and which fails EVERY project,
      # because the config chain is loaded before anything else. Writing a valid one up front
      # removes the race rather than detecting it.
      #
      # Pinning the config per-restore does NOT substitute for this. Measured: an empty user-level
      # config fails a restore identically with and without -p:RestoreConfigFile, because NuGet
      # still loads the hierarchy; only a valid file at this path avoids it.
      - name: Ensure a valid user-level NuGet config
        shell: bash
        run: |
          set -euo pipefail
          cfg="$HOME/.nuget/NuGet/NuGet.Config"
          mkdir -p "$(dirname "$cfg")"
          if [ ! -s "$cfg" ] || ! python3 -c "import sys,xml.etree.ElementTree as ET; ET.parse(sys.argv[1])" "$cfg" 2>/dev/null; then
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<configuration>' '  <packageSources>' '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />' '  </packageSources>' '</configuration>' > "$cfg"
            echo "wrote a valid user-level NuGet config at $cfg"
          else
            echo "existing user-level NuGet config parses as XML; left untouched"
          fi
          python3 -c "import sys,xml.etree.ElementTree as ET; ET.parse(sys.argv[1]); print('verified parseable')" "$cfg"

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify package composition controls
        shell: pwsh
        run: ./eng/validate-package-composition.test.ps1

      - name: Validate package composition
        shell: pwsh
        run: ./eng/validate-package-composition.ps1

      - name: Preserve package composition evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-composition-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/package-composition/**/*.json
            artifacts/package-composition/**/*.log
            artifacts/package-composition-controls/**/*.json
            artifacts/package-composition-controls/**/*.log
          if-no-files-found: error
          retention-days: 14

  # Dependency vulnerability audit. Produces the per-project SARIF the compliance control-evidence
  # map cites; NuGetAudit in Directory.Build.props is what actually gates a build.
  # -MaxProjects is a runaway guard and must stay ABOVE the project population (198 in src/ today).
  # It was 180: breached on every run since the 181st project, failing the job nightly on a
  # configuration fault while reporting no vulnerabilities.
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Run dependency audit
        shell: pwsh
        run: |
          ./eng/ci/dependency-audit.ps1 `
            -OutDir artifacts/reports/DependencyAuditReport `
            -ProjectRoot src `
            -PerProjectTimeoutSeconds 120 `
            -TotalBudgetMinutes 15 `
            -MaxProjects 400 `
            -FailOnGuardrailBreach

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-dependency-audit
          path: artifacts/reports/DependencyAuditReport
          retention-days: 14

  # npm audit. Deliberately nightly and not on the PR path, matching NuGetAudit's disposition in
  # Directory.Build.props: an advisory published overnight against an untouched package must not break
  # unrelated work. Dependency Review (security.yml, PR-only) is what stops new vulnerable deps
  # entering; this catches advisories raised against dependencies already here.
  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      # The gate is only evidence if it can fail. Drives the shipped threshold and parsing functions
      # with canned audit documents -- no network, no install.
      - name: Prove the gate is non-vacuous
        run: bash eng/ci/npm-audit.sh --self-test

      - name: Audit every lockfile
        run: bash eng/ci/npm-audit.sh

  # Nightly summary + failure notification
  # "Flake rate and top offenders are visible weekly." Nightly rather than weekly, because the input
  # is retained test results and reading them more often costs nothing.
  #
  # It does NOT retry anything. A retry in the test path is one edit away from turning red green:
  # once a rerun's success becomes the job's result, a flaky test is indistinguishable from a healthy
  # one and the signal is destroyed at the moment it is produced. Tests run once, that result stands,
  # and flakiness is read from history instead -- a test that both passed and failed across the
  # window is flaky by observation.
  #
  # Advisory by construction: this job reports and never gates. A flake report that can fail the
  # build becomes a thing people route around, and then it stops being read at all.
  flake-report:
    name: Flake Report (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read   # to list recent runs and download their retained test results
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Gather test results from recent CI runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p flake-input
          # Successful runs only would hide every flake, since a flake most often shows up in a run
          # that failed. Take recent COMPLETED runs regardless of conclusion.
          runs="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow=ci.yml --status completed \
                    --limit 12 --json databaseId --jq '.[].databaseId')"
          n=0
          for r in $runs; do
            if gh run download "$r" --repo "${GITHUB_REPOSITORY}" --pattern 'test-results-*' \
                 --dir "flake-input/run-$r" >/dev/null 2>&1; then
              n=$((n + 1))
            fi
          done
          echo "gathered results from ${n} run(s)"
          echo "trx files: $(find flake-input -name '*.trx' | wc -l)"

      # Its own arms first: a report nobody can see fail is not evidence.
      - name: flake-report self-test (non-vacuity)
        run: python3 eng/ci/flake-report.py --self-test

      - name: Report
        shell: bash
        run: |
          set -euo pipefail
          # REFUSE (exit 2) means nothing was measured, which is NOT the same as no flakes. Surface
          # it as a warning rather than silence -- but do not fail, because this job is advisory.
          rc=0
          # The budgets make the report capable of a verdict; the `|| rc=$?` below keeps the JOB
          # advisory. Exit 1 (over budget) is surfaced as a warning rather than failing the build,
          # deliberately: a flake report that can go red becomes a thing people route around, and
          # then it stops being read at all. Making it blocking is a policy decision, not this
          # step's to take.
          #
          # These are BUDGETS, not a ratchet: they say what is tolerable, not what was measured, so
          # they can be breached on the first real window. When that happens the fix is to repair or
          # quarantine the named tests. Raising the numbers to match the observation would turn the
          # only defensible line into a description of the status quo.
          python3 eng/ci/flake-report.py --glob 'flake-input/**/*.trx' \
            --max-flaky-count 5 \
            --max-flaky-rate 0.10 \
            > flake-report.md || rc=$?
          cat flake-report.md >> "$GITHUB_STEP_SUMMARY" || true
          cat flake-report.md
          if [ "$rc" -eq 1 ]; then
            echo "::warning::Flake budget exceeded. Advisory for now: this job reports and does not gate."
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::warning::Flake report could not be produced: no parseable test results in the window. This is 'no data', not 'no flakes'."
          fi

      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flake-report
          path: flake-report.md
          if-no-files-found: warn
          retention-days: 30

  # Service-level indicators. Every question this answers has been answered by hand at least once in
  # this repository, and got a wrong answer at least once -- is the queue draining, how long does a
  # run take, how often does main go red. Hand-measuring a moving system produces a snapshot reported
  # as a state.
  #
  # Advisory, like the flake report: an indicator that can fail a build stops being an indicator and
  # becomes a gate people route around.
  ci-sli-report:
    name: CI Service-Level Indicators (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: ci-sli-report self-test (non-vacuity)
        run: python3 eng/ci/ci-sli-report.py --self-test

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          # --history-file appends one dated row per objective to a small committed series, so the
          # trend is readable from one file instead of by downloading and diffing thirty nightly
          # artifacts. --fail-on-missed is deliberately NOT passed: this job reports.
          # 1800s. The budget has to let a COMPLETE collection finish or it reports a measurement
          # failure as a measurement, which is the same defect as a job cap too tight for a healthy
          # run. Measured from this job's own evidence artifact: at 480s it collected 2 of 6
          # populations - 60 runs in roughly 180s of collection - before stopping, and the four it
          # had not reached include two more ci.yml scopes, the most job-heavy workflow, so the
          # remainder costs more per run rather than less. The job cap is 120 minutes, so 1800s is
          # a quarter of the headroom available and several times the extrapolated need.
          #
          # Lowering --limit instead would be the wrong trade: p95 needs at least 20 completed runs
          # and the report already marks the estimate when it has fewer.
          python3 eng/ci/ci-sli-report.py --repo "${GITHUB_REPOSITORY}" --limit 30 \
            --history-file eng/ci/ci-sli-history.jsonl \
            --job-details --evidence-file ci-sli-evidence.json --collection-timeout-seconds 1800 \
            --rerun-classifications eng/ci/rerun-classifications.json \
            > ci-sli.md || rc=$?
          cat ci-sli.md >> "$GITHUB_STEP_SUMMARY" || true
          cat ci-sli.md
          if [ "$rc" -eq 2 ]; then
            echo "::warning::SLI measurement refused incomplete or inconsistent evidence; inspect the report and evidence artifact."
          fi
          exit "$rc"

      - name: Upload SLI measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-sli-evidence
          path: ci-sli-evidence.json
          if-no-files-found: warn
          retention-days: 90

      # The appended row is uploaded rather than committed: this job holds contents:read, and
      # widening it to push to the default branch is a permissions decision, not a reporting one.
      - name: Upload SLI history series
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-sli-history
          path: eng/ci/ci-sli-history.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: Upload SLI report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-sli-report
          path: ci-sli.md
          if-no-files-found: warn
          retention-days: 90

  nightly-summary:
    name: Nightly Summary
    runs-on: ubuntu-latest
    needs: [deterministic-unit-tests, integration-tests, package-composition, dependency-audit, npm-audit]
    if: always()
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute nightly results
        id: results
        shell: bash
        env:
          INTEGRATION_OPT_OUT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_integration_tests }}
        run: |
          # Check job outcomes from needs context
          unit="${{ needs.deterministic-unit-tests.result }}"
          integration="${{ needs.integration-tests.result }}"
          packages="${{ needs.package-composition.result }}"
          audit="${{ needs.dependency-audit.result }}"
          npmaudit="${{ needs.npm-audit.result }}"
          integration_opt_out="$INTEGRATION_OPT_OUT"

          failures=""
          if [ "$unit" != "success" ]; then failures="${failures}deterministic-unit-tests ($unit), "; fi
          if [ "$integration" != "success" ]; then
            if [ "$integration" != "skipped" ] || [ "$integration_opt_out" != "true" ]; then
              failures="${failures}integration-tests ($integration), "
            fi
          fi
          if [ "$packages" != "success" ]; then failures="${failures}package-composition ($packages), "; fi
          if [ "$audit" != "success" ]; then failures="${failures}dependency-audit ($audit), "; fi
          if [ "$npmaudit" != "success" ]; then failures="${failures}npm-audit ($npmaudit), "; fi

          if [ -z "$failures" ]; then
            if [ "$integration" = "skipped" ]; then
              echo "status=incomplete" >> "$GITHUB_OUTPUT"
            else
              echo "status=passed" >> "$GITHUB_OUTPUT"
            fi
            echo "failures=" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "failures=${failures%, }" >> "$GITHUB_OUTPUT"
          fi

      - name: Post nightly summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Nightly CI Build Summary"
            echo ""
            echo "- **Status:** ${{ steps.results.outputs.status == 'passed' && 'PASSED' || steps.results.outputs.status == 'incomplete' && 'INCOMPLETE (integration explicitly skipped)' || 'FAILED' }}"
            echo "- **Date:** $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            echo "- **Ref:** ${{ github.sha }}"
            echo ""
            echo "## Job Results"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| Deterministic Unit Tests | ${{ needs.deterministic-unit-tests.result }} |"
            echo "| Integration Tests | ${{ needs.integration-tests.result }} |"
            echo "| Package Composition | ${{ needs.package-composition.result }} |"
            echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |"
            echo "| npm Dependency Audit | ${{ needs.npm-audit.result }} |"
            if [ -n "${{ steps.results.outputs.failures }}" ]; then
              echo ""
              echo "## Failures"
              echo ""
              echo "${{ steps.results.outputs.failures }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub issue on failure
        if: steps.results.outputs.status == 'failed'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // ONE issue per persistent failure, not one per night. This previously created
            // 'Nightly CI failure: <date>' unconditionally, so a defect lasting a fortnight produced
            // fourteen issues -- and a backlog nobody triages is indistinguishable from no reporting.
            // The failing job names are the fingerprint: the same set failing again is the same
            // incident; a different set is a new one.
            const failures = '${{ steps.results.outputs.failures }}';
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            const today = new Date().toISOString().split('T')[0];

            const fingerprint = failures.split(String.fromCharCode(10)).map(l => l.trim()).filter(Boolean).sort().join('|').slice(0, 120) || 'unclassified';
            const marker = '<!-- nightly-fingerprint: ' + fingerprint + ' -->';

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-nightly', per_page: 100,
            });
            const match = existing.find(i => (i.body || '').includes(marker));

            if (match) {
              // Comment rather than duplicate, so occurrence count and first-seen date stay on one
              // thread and the issue's age reflects how long this has actually been broken.
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: match.number,
                body: ['Recurred on **' + today + '** - [run ' + context.runId + '](' + runUrl + '), commit ' + context.sha + '.', '', 'Still failing:', '', failures].join(String.fromCharCode(10)),
              });
              core.notice('Nightly failure recurred; commented on #' + match.number + ' rather than opening a duplicate.');
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Nightly CI failure: ' + fingerprint.split('|')[0].slice(0, 60),
                body: [
                  '## Nightly CI Build Failed', '',
                  '**First seen:** ' + today,
                  '**Run:** [' + context.runId + '](' + runUrl + ')',
                  '**Commit:** ' + context.sha, '',
                  '### Failed Jobs', '', failures, '',
                  '### Action Required', '',
                  'Investigate and fix the failing jobs before the next nightly run. Recurrences are added',
                  'as comments on this issue rather than as new issues, so the age of this thread is how',
                  'long the defect has been live.', '',
                  marker,
                ].join(String.fromCharCode(10)),
                labels: ['ci-nightly', 'bug'],
              });
              core.notice('Opened #' + created.data.number + ' for a nightly failure not seen before.');
            }

      - name: Enforce nightly verdict
        if: always()
        shell: bash
        env:
          NIGHTLY_STATUS: ${{ steps.results.outputs.status }}
          INTEGRATION_OPT_OUT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_integration_tests }}
        run: |
          case "$NIGHTLY_STATUS" in
            passed) exit 0 ;;
            incomplete)
              if [ "$INTEGRATION_OPT_OUT" = "true" ]; then
                echo "Nightly diagnostic run is incomplete: integration was explicitly omitted."
                exit 0
              fi
              ;;
          esac
          echo "::error::Nightly acceptance failed or its verdict is unavailable."
          exit 1
