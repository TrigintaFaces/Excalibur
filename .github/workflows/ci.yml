          path: TestResults/*.trx
          retention-days: 30

  # ── Cross-platform: macOS async-risk (sequenced after deterministic to limit 10x billing) ──
  unit-tests-macos-async-risk:
    name: Unit Tests (macOS - Async Risk)
    runs-on: macos-latest
    needs: unit-tests-macos
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          solution-filter: eng/ci/shards/UnitTests-AsyncRisk.slnf
          collect-coverage: 'false'
          results-prefix: unit-tests-macos-async-risk
          max-cpu-count: '1'
