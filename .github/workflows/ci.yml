      - name: Upload trim/AOT audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aot-build-analysis
          path: management/reports/AotBuildAnalysis

  # ── Coverage analysis (reusable workflow) ──
  call-coverage:
    needs:
      - unit-tests
      - integration-tests
      - functional-tests
      - contract-tests
      - architecture-tests
    if: always()
    uses: ./.github/workflows/coverage.yml
    with:
      checkout-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      checkout-token: ${{ github.token }}
      event-name: ${{ github.event_name }}
      coverage-threshold: '44'
      pr-base-sha: ${{ github.event.pull_request.base.sha || '' }}
      pr-number: ${{ github.event.pull_request.number || '' }}
    secrets: inherit

  # ── Performance gates (reusable workflow) ──
  call-performance:
    needs: package
    uses: ./.github/workflows/performance.yml
    with:
      checkout-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      checkout-token: ${{ github.token }}
      # Quoted into a string deliberately: performance.yml types this input as `string`, and a bare
      # comparison yields a bool. The receiving side compares it against 'true', so a bool would have
      # to survive an implicit conversion to match.
      run-performance-tests: ${{ (github.event.inputs.run_performance_tests == 'true' || github.event_name == 'push') && 'true' || 'false' }}
    secrets: inherit

  # ── Quality analysis -- self-contained build ──
  quality:
    name: Quality Analysis
    runs-on: ubuntu-latest
    # Was 15. The job was killed at 15m17s having spent 11 minutes inside its FIRST real step, so five
    # of its seven steps have never executed in CI at all and there is no measurement for them. 30 is
    # therefore a bound with headroom, not a fitted number -- the honest cap until a run gets far
    # enough to measure the rest. The step that overran no longer exists: its 389 per-project
    # `dotnet list` invocations (of which ~192 could not have succeeded) are now NuGetAudit inside
    # restore, configured in Directory.Build.props.
    #
    # NOTE FOR TRIAGE: a timed-out job reports conclusion "cancelled", identical to a concurrency
    # cancellation. If this job reads "cancelled", check its duration against this cap BEFORE
    # attributing it to concurrency policy -- that defect is fixed, and this one wore its clothes.
    timeout-minutes: 30
    needs: package
    # security-events: write was held here for a SARIF upload that no longer exists. A permission
    # outliving the step that needed it is exactly what least-privilege is meant to prevent, and it
    # is the kind of grant nobody removes because nobody notices it. Read-only now.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Setup build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          solution-filter: eng/ci/shards/ShippingOnly.slnf

      # NuGetAudit runs inside restore and checks direct + transitive packages against the GitHub
      # Advisory Database. AuditPipeline=true promotes NU1901-1904 to errors for this run only;
      # Directory.Solution.targets asserts every project was actually audited.
      - name: Audit packages for known vulnerabilities (R20.10)
        run: bash ./build.sh --restore --project eng/ci/shards/ShippingOnly.slnf --properties AuditPipeline=true

      - name: Validate serialization policy (R0.14, R20.24-26)
        run: |
          echo "Validating serialization policy..."
          pwsh -File eng/validate-serializer-policy.ps1

      - name: Validate architecture boundaries (R1.9, R17.8)
        run: |
          echo "Validating architecture boundaries..."
          pwsh -File eng/validate-architecture-boundaries.ps1

      # A failed install used to be swallowed by `|| true`, so `security-scan` was simply absent on the
      # next step -- which ALSO ended in `|| true`. The result was a green "Run security analysis" step
      # that had run no analysis at all. A tool that cannot be installed is a REFUSE (nothing was
      # checked), never a PASS; it must not be discoverable only by noticing a missing artifact.
      # SAST is CodeQL, not a third-party scanner. The steps that stood here installed
      # security-scan 5.6.7 and dotnet-sonarscanner 6.2.0 and ran the former over the repo.
      #
      # security-scan cannot run: 5.6.7 is its latest release and it targets .NET 6, which reached
      # end of life in November 2024 and is not installed on the runner. It exited 150 -- the host's
      # framework-not-found code -- and wrote no SARIF, which the gate correctly classified as REFUSE
      # rather than a pass. It had never actually executed in any observed run: the step ahead of it
      # died first and skipped it, so the failure was invisible rather than absent.
      #
      # codeql-analysis.yml already runs the security-extended suite over C# and reports real
      # findings, so removing this loses no coverage. dotnet-sonarscanner went with it: it was
      # installed on every run and referenced nowhere else in the repository.


  # ── Transport conformance -- self-contained build ──
  transport-conformance:
    name: Transport Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: package
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Setup build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          solution-filter: eng/ci/shards/TestsOnly.slnf

      - name: Run conformance tests
        run: |
          dotnet test tests/conformance/Excalibur.Dispatch.Tests.Conformance/Excalibur.Dispatch.Tests.Conformance.csproj \
            --configuration Release \
            --no-build \
            --blame-hang-timeout 5m \
            --logger "trx;LogFileName=transport-conformance.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./TestResults \
            -- RunConfiguration.TestSessionTimeout=900000

      - name: Generate transport parity dashboard
        shell: pwsh
        run: |
          ./eng/ci/validate-framework-governance.ps1 -Mode TransportParity -MatrixPath management/governance/framework-governance.json -OutDir management/reports/TransportParityReport -Enforce:$true

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: transport-conformance-results
          path: |
            TestResults/*.trx
            management/reports/TransportParityReport

  # ── Release-blocking test governance ──
  release-blocking-tests:
    name: Release-Blocking Test Governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-shard-coverage, unit-tests, unit-tests-windows, unit-tests-macos]
    if: always()
    steps:
      - name: Validate release-blocking test matrix
        shell: bash
        run: |
          set -euo pipefail
          require_success() {
            local suite="$1"
            local status="$2"
            if [[ "$status" != "success" ]]; then
              failures+=("${suite}=${status}")
            fi
          }
          failures=()

          shard="${{ needs.unit-shard-coverage.result }}"
          unit="${{ needs.unit-tests.result }}"
          unit_win="${{ needs.unit-tests-windows.result }}"
          unit_mac="${{ needs.unit-tests-macos.result }}"

          echo "## Release-Blocking Test Governance" >> "$GITHUB_STEP_SUMMARY"
          echo "Deterministic blocking tier: core/transport/middleware/excalibur on all platforms. Async-risk (messaging/observability) is advisory." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Suite | Status | Tier |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| unit-shard-coverage | $shard | blocking |" >> "$GITHUB_STEP_SUMMARY"
          echo "| unit-tests-linux (deterministic) | $unit | blocking |" >> "$GITHUB_STEP_SUMMARY"
          echo "| unit-tests-windows (deterministic) | $unit_win | blocking |" >> "$GITHUB_STEP_SUMMARY"
          echo "| unit-tests-macos (deterministic) | $unit_mac | blocking |" >> "$GITHUB_STEP_SUMMARY"

          require_success "unit-shard-coverage" "$shard"
          require_success "unit-tests" "$unit"
          require_success "unit-tests-windows" "$unit_win"
          require_success "unit-tests-macos" "$unit_mac"

          if [ ${#failures[@]} -gt 0 ]; then
            printf '  %s\n' "One or more release-blocking test suites failed: ${failures[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more release-blocking test suites failed." >> "$GITHUB_STEP_SUMMARY"
            # ALSO to the log -- see the sibling aggregator below for why. A gate whose verdict
            # exists only in the step summary reads, from the log, as an unexplained exit 1.
            echo "::error::Release-blocking test suites not success: ${failures[*]}"
            for f in "${failures[@]}"; do echo "  not success: $f" >&2; done
            exit 1
          fi
          echo "All release-blocking test suites passed." >> "$GITHUB_STEP_SUMMARY"
          echo "All release-blocking test suites passed: 4 required suites reported success."

  # ── Release-blocking CI governance ──
  release-blocking-ci:
    name: Release-Blocking CI Governance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [package, release-blocking-tests, quality, flaky-quarantine-governance, serialization-policy, call-security, call-governance]
    if: always()
    steps:
      - name: Validate release-blocking CI policy
        shell: bash
        run: |
          set -euo pipefail
          require_success() {
            local gate="$1"
            local status="$2"
            if [[ "$status" != "success" ]]; then
              failures+=("${gate}=${status}")
            fi
          }

          failures=()
          pkg="${{ needs.package.result }}"
          test_gate="${{ needs.release-blocking-tests.result }}"
          quality="${{ needs.quality.result }}"
          flaky_quarantine="${{ needs.flaky-quarantine-governance.result }}"
          serialization="${{ needs.serialization-policy.result }}"
          security="${{ needs.call-security.result }}"
          governance="${{ needs.call-governance.result }}"

          echo "## Release-Blocking CI Governance" >> "$GITHUB_STEP_SUMMARY"
          echo "Required tier: deterministic unit tests + static analysis + package integrity + flaky quarantine governance." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| package | $pkg |" >> "$GITHUB_STEP_SUMMARY"
          echo "| release-blocking-tests | $test_gate |" >> "$GITHUB_STEP_SUMMARY"
          echo "| quality | $quality |" >> "$GITHUB_STEP_SUMMARY"
          echo "| flaky-quarantine-governance | $flaky_quarantine |" >> "$GITHUB_STEP_SUMMARY"
          echo "| serialization-policy | $serialization |" >> "$GITHUB_STEP_SUMMARY"
          echo "| call-security | $security |" >> "$GITHUB_STEP_SUMMARY"
          echo "| call-governance | $governance |" >> "$GITHUB_STEP_SUMMARY"

          require_success "package" "$pkg"
          require_success "release-blocking-tests" "$test_gate"
          require_success "quality" "$quality"
          require_success "flaky-quarantine-governance" "$flaky_quarantine"
          require_success "serialization-policy" "$serialization"
          require_success "call-security" "$security"
          require_success "call-governance" "$governance"

          if [ ${#failures[@]} -gt 0 ]; then
            printf '  %s\n' "Release-blocking CI policy failed: ${failures[*]}" >> "$GITHUB_STEP_SUMMARY"
            # ALSO to the log, not only to the step summary. This job runs in ~2 seconds and its
            # entire output was 'exit 1': the gate knew which inputs were not success and told
            # nobody who was reading the log. Anyone diagnosing from the log alone -- which is what
            # gets pasted, quoted and searched -- saw a failure with no subject. Every other gate in
            # this file already annotates with ::error::; these aggregators were the exception.
            #
            # The distinction between statuses is load-bearing and must survive into the message: a
            # 'cancelled' input means a newer run superseded this one and nothing was proven, which
            # is a different situation from 'failure' and calls for a different response.
            echo "::error::Release-blocking CI policy failed: ${failures[*]}"
            for f in "${failures[@]}"; do echo "  not success: $f" >&2; done
            exit 1
          fi

          echo "Release-blocking CI policy passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Release-blocking CI policy passed: all 7 required gates reported success."

  # ── Pack quality gate (report) ──
  pack-quality:
