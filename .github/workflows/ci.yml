      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-unit-macos-async-risk
          path: TestResults/*.trx
          retention-days: 30

  # ── Integration tests -- self-contained build, Docker pre-flight, -m:1 ──
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Setup build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          solution-filter: eng/ci/shards/IntegrationTests.slnf

      - name: Integration preflight diagnostics
        shell: pwsh
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "DOTNET_ROOT: $env:DOTNET_ROOT"
          Write-Host "GITHUB_ACTIONS: $env:GITHUB_ACTIONS"
          Write-Host "Docker command available: $([bool](Get-Command docker -ErrorAction SilentlyContinue))"
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            docker --version
          }
          # These are DIAGNOSTIC PRINTS, not probes. They report whether a variable is set; they do not
          # test reachability and they cannot fail. Do not cite this step as a readiness check — the
          # Cosmos readiness gate below is the step that can REFUSE.
          foreach ($name in @('AZURE_KEYVAULT_URI', 'COSMOS_EMULATOR_ENDPOINT')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Host ("{0}: not set" -f $name)
            }
            else {
              Write-Host ("{0}: set" -f $name)
            }
          }

      # The Cosmos emulator readiness gate lived here. It moved to nightly.yml's integration-tests job,
      # together with the Cosmos tests themselves — a shard that provisions an emulator none of its tests
      # use spends ~10 minutes proving something it will not consume. Restore both together or neither.

      - name: Verify XPlat coverage collector package
        shell: bash
        run: |
          set -euo pipefail
          dotnet list tests/integration/Excalibur.Dispatch.Integration.Tests/Excalibur.Dispatch.Integration.Tests.csproj package --include-transitive | tee integration-packages.log
          if ! grep -qi "coverlet\\.collector" integration-packages.log; then
            echo "::error::coverlet.collector package is unavailable for integration tests (XPlat Code Coverage collector)."
            exit 1
          fi

      - name: Compose integration test filter
        shell: pwsh
        run: |
          # COSMOS RUNS NIGHTLY, NOT PER-PR. Read this before restoring it here.
          #
          # This is NOT the exclusion that was removed from this file. That one filtered the Cosmos tests
          # out of the only job that ran them, so they executed NOWHERE while this shard reported green —
          # a check that passed by not measuring. This one moves them to a job that DOES run them: the
          # nightly workflow's integration-tests job, which carries the same Category filter without this
          # exclusion and now carries the emulator readiness gate as well.
          #
          # The difference is where the verdict lives, not whether there is one. Tenant isolation,
          # cross-tenant dedup, optimistic concurrency, event-store conformance and change-feed durability
          # are shipped guarantees; they are still verified, nightly, and a failure there is a real red.
          #
          # WHAT THIS COSTS, stated plainly: a Cosmos regression is caught within a day rather than on the
          # PR that introduces it. That is a deliberate trade for a PR path that no longer depends on a
          # ~10-minute emulator startup on a 2-core runner. It is not a claim that Cosmos is covered here.
          #
          # If you restore Cosmos to this shard, move the readiness gate back with it — the gate belongs
          # wherever the tests are, and a shard that provisions an emulator it never uses is waste.
          #
          # The filter keys on Infrastructure, NOT on Database. `Database=CosmosDb` says what a test is
          # ABOUT; `Infrastructure=CosmosEmulator` says what it NEEDS. Twenty-two classes carry the
          # Database trait and only nine start a container, so excluding by topic would have dropped
          # thirteen tests that need no emulator and could have kept running here for free. The
          # Infrastructure trait set is verified identical to the census's behaviour set — the classes
          # that actually construct a Cosmos fixture.
          $baseFilter = '(Category=Integration|Category=EndToEnd)&Infrastructure!=CosmosEmulator'
          $filterInfo = ./eng/ci/get-test-filter.ps1 -BaseFilter $baseFilter -Mode Exclude -AsJson | ConvertFrom-Json
          "INTEGRATION_TEST_FILTER=$($filterInfo.filter)" >> $env:GITHUB_ENV
          Write-Host "Using integration filter with $($filterInfo.count) quarantined exclusions."

      - name: Establish EXPECTED test population
        shell: bash
        run: |
          set -uo pipefail
          # EXPECTED is DERIVED here, never hard-coded. A frozen number is a constant that stops tracking
          # the thing it claims to measure the moment a test is added, and it certifies the population it
          # was written for rather than the one that exists.
          # emulator-scope=out: this shard is declared emulator-free, so the census asserts the INVERSE
          # — that no emulator-starting class is admitted here. It is not disabled; it now guards the
          # failure that matters on this path, which is a Cosmos class drifting back onto the PR shard
          # and quietly costing every run ten minutes of container startup.
          bash eng/ci/cosmos-census.sh \
            eng/ci/shards/IntegrationTests.slnf \
            "${{ env.INTEGRATION_TEST_FILTER }}" \
            "$GITHUB_ENV" \
            out
          CENSUS_EXIT=$?
          if [ "$CENSUS_EXIT" -ne 0 ]; then exit "$CENSUS_EXIT"; fi

      - name: Run Integration Tests
        id: run-integration
        # No step-level continue-on-error. The JOB already declares
        #   continue-on-error: ${{ github.event_name == 'pull_request' }}
        # which is the intended contract: advisory on a PR, blocking on push.
        # An unconditional `continue-on-error: true` here meant this step could
        # never fail, so the job could never fail, so that job-level guard was
        # unreachable — a correct control nullified by a nested one eleven lines
        # below it. Failures now propagate to the job, which decides by event.
        run: |
          bash eng/ci/run-filtered-tests.sh \
            --filter "${{ env.INTEGRATION_TEST_FILTER }}" -- \
            eng/ci/shards/IntegrationTests.slnf \
            -m:1 \
            --configuration Release \
            --no-build \
            --blame-hang-timeout 10m \
            --logger "trx;LogFilePrefix=integration-tests" \
            --logger "console;verbosity=minimal" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- RunConfiguration.TestSessionTimeout=1800000 DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Cleanup orphaned Docker containers
        if: always()
        run: |
          # Kill any TestContainers that survived a test host crash.
          #
          # The previous two filters matched NONE of this shard's fixture container names, so the cleanup
          # was a no-op for every emulator the shard actually starts. Names are assigned by the fixtures as
          # `<service>-test-<guid>` (cosmosdb-eventstore-test-*, cosmosdb-saga-test-*, cosmosdb-snapshotstore
          # -test-*, cosmosdb-telemetry-test-*, cosmosdb-txinbox-test-*, es-*, azurite-*, firestore-cdc-
          # state-test-*), none of which contain the literal "testcontainers".
          #
          # A leaked emulator is not merely wasted memory: containers that are not reaped between test
          # collections accumulate across the suite and can exhaust the runner even when peak concurrency
          # is one or two. This runs `if: always()` precisely so a crashed host does not leave them behind.
          for pattern in \
            vault-compliance-test \
            testcontainers \
            cosmosdb- \
            firestore-cdc-state-test \
            azurite- \
            es-
          do
            docker ps -aq --filter "name=${pattern}" | xargs -r docker rm -f 2>/dev/null || true
          done
          echo "Containers still running after cleanup:"
          docker ps --format '{{.Names}}' || true

      - name: Verify integration test results
        if: always()
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Path ./TestResults -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue
          if ($trxFiles.Count -eq 0) {
            Write-Error "No TRX result files found -- test run may have failed to start"
            exit 1
          }
          # `failed = 0` alone is satisfied by a run that executed almost nothing. A run that dies partway
          # reports a positive count and a clean failure total -- measured: an aborted run printed
          # "Failed: 0, Passed: 5, Total: 5" having executed 5 of 16 arms. So the expected set is the only
          # anchor that catches a partial run, and both halves must hold in the SAME run.
          #
          # Compare `executed`, never `total`. `total` includes tests that were never run, so a comparison
          # against it is satisfied by the exact aborted run this gate exists to catch.
          #
          # Do NOT read the `notExecuted` counter: it was measured reading 0 while 4 tests were NotExecuted
          # in the same file. Skips are DETECTED as (total - executed), which is derived from the two
          # counters measured trustworthy, and NAMED from the per-test rows -- a subtraction yields a count,
          # and a count is not a claim anyone can check.
          $totalFailed = 0; $totalExecuted = 0; $totalTests = 0
          $skippedNames = New-Object System.Collections.Generic.List[string]
          # Structurally-inapplicable skips: reported in full, never silent, but not allowlist-bearing.
          $capabilitySkips = New-Object System.Collections.Generic.List[string]
          foreach ($trx in $trxFiles) {
            [xml]$xml = Get-Content $trx.FullName
            $counters = $xml.TestRun.ResultSummary.Counters
            $failed = [int]$counters.failed
            $executed = [int]$counters.executed
            $total = [int]$counters.total
            Write-Host "$($trx.Name): executed=$executed failed=$failed total=$total"
            $totalFailed += $failed; $totalExecuted += $executed; $totalTests += $total
            foreach ($r in $xml.TestRun.Results.UnitTestResult) {
              if ($r.outcome -ne 'Passed' -and $r.outcome -ne 'Failed') {
                # The TRX carries the skip REASON, and this used to discard it. Two unrelated things
                # produce a skip and they need opposite treatment:
                #
                #   SUPPRESSION  the test SHOULD run and does not. Needs a named owner, evidence and an
                #                expiry, because the cause is fixable. -> allowlist.
                #   CAPABILITY   the test CANNOT apply: the provider does not implement the interface
                #                under test. A fact about the type system, not a renewable decision.
                #
                # Filing the second in an expiring allowlist forces a permanent fact to be re-approved
                # on a schedule with no new measurement to record -- the "a fresh date is not a
                # renewal" failure that allowlist exists to prevent -- and buries the few real
                # suppressions among dozens nobody can act on.
                #
                # The category is declared AT THE SKIP SITE via CapabilityNotApplicable() in the
                # conformance base, which emits this marker. It is matched literally, never inferred
                # from prose: a gate guessing intent from a message silently reclassifies a
                # suppression the day someone rewords it.
                $reason = "$($r.Output.ErrorInfo.Message)"
                if ($reason -like '*[[]capability-not-applicable[]]*') {
                  $capabilitySkips.Add("$($r.testName)  --  $reason")
                } else {
                  $skippedNames.Add($r.testName)
                }
              }
            }
          }

          $expected = [int]$env:COSMOS_EXPECTED
          if ($expected -le 0) {
            Write-Error "REFUSE -- EXPECTED was never established. A gate with no expected set cannot distinguish a complete run from an aborted one."
            exit 3
          }

          # The allowlist validates its own contents, and a lapsed entry breaks the build rather than
          # quietly continuing to suppress. Printed in full so the suppressions are seen at the one moment
          # someone is reading this output.
          $allow = Get-Content eng/ci/cosmos-skip-allowlist.json -Raw | ConvertFrom-Json
          $today = (Get-Date).Date
          $allowedClasses = @()
          Write-Host "`n--- approved skip allowlist ---"
          foreach ($e in $allow.entries) {
            # 'issue' is deliberately NOT required here. This file is mirrored and world-visible, so it
            # carries no internal tracker id: the tracking issue names the entry by its 'id', never the
            # reverse. Internal artifacts may point at public ones; a public file citing an internal work
            # item leaks it and is meaningless to the consumer who reads it.
            foreach ($f in @('test','id','reason','evidence','owner','expires')) {
              if ([string]::IsNullOrWhiteSpace($e.$f)) {
                Write-Error "REFUSE -- allowlist entry '$($e.test)' is missing mandatory field '$f'."
                exit 3
              }
            }
            $days = ([datetime]$e.expires - $today).Days
            Write-Host ("  {0}`n    id={1} owner={2} expires={3} ({4} days)" -f $e.test, $e.id, $e.owner, $e.expires, $days)
            if ($days -lt 0) {
              Write-Error "REFUSE -- allowlist entry '$($e.id)' EXPIRED on $($e.expires), owned by $($e.owner). Renew it with a NEW MEASUREMENT recorded in 'evidence', or remove the suppression. A fresh date alone is not a renewal."
              exit 3
            }
            $allowedClasses += $e.test
          }
          Write-Host "--- end allowlist ---`n"

          # Printed, always. Exempt from the allowlist is NOT exempt from being seen -- a category that
          # stops being reported is a category that stops being questioned, and "no provider implements
          # fencing any more" should be visible the run it becomes true.
          if ($capabilitySkips.Count -gt 0) {
            Write-Host "`nStructurally inapplicable ($($capabilitySkips.Count)) -- provider does not implement the interface under test. Not allowlist-bearing:"
            $capabilitySkips | ForEach-Object { Write-Host "  $_" }
            Write-Host ""
          }

          if ($skippedNames.Count -gt 0) {
            Write-Host "Skipped tests, by name (a skip total is a number; a skip list is a claim you can check):"
            $skippedNames | ForEach-Object { Write-Host "  $_" }
            $unapproved = $skippedNames | Where-Object { $n = $_; -not ($allowedClasses | Where-Object { $n -like "$_*" }) }
            if ($unapproved) {
              Write-Error "REFUSE -- $($unapproved.Count) test(s) skipped without an approved allowlist entry. An unexplained skip is the defect; a named and approved one is a decision.`n$($unapproved -join "`n")"
              exit 3
            }
          }

          # Accounting: nothing VANISHED. This identity is necessary and NOT sufficient -- it is satisfied
          # by 0 executed and everything skipped -- so the unapproved-skip refusal above is its liveness arm.
          #
          # EVERY bucket a test can land in must appear here. Skips are sorted into TWO lists above
          # (allowlist-bearing suppressions, and structurally-inapplicable capability skips) and this sum
          # counted only the first, so every capability skip read as a VANISHED test. That is what the
          # long-running "2576 against 2591" was: 2546 executed + 30 suppressed + 15 capability = 2591,
          # exactly EXPECTED. Nothing was ever missing; a bucket was missing from the arithmetic.
          #
          # A capability skip IS accounted for: it is named, categorised at the skip site, and printed in
          # full above. It is not a test that disappeared. If a third skip category is ever added, it must
          # be added to this sum in the same commit -- that is the whole lesson of this line.
          $accounted = $totalExecuted + $skippedNames.Count + $capabilitySkips.Count
          Write-Host "executed=$totalExecuted + skipped=$($skippedNames.Count) + capability=$($capabilitySkips.Count) = $accounted, EXPECTED=$expected"
          if ($accounted -ne $expected) {
            # NAME THE DIFFERENCE. "2576 against 2591" is an arithmetic fact and nobody can act on it:
            # the 15 are either tests that never ran (a real partial run) or entries the census counted
            # and execution merges (a census defect), and those need OPPOSITE fixes. Measured on the
            # mirror: accounted held at 2576 across two runs while EXPECTED moved 2551 -> 2591, which
            # points at the census -- but "points at" is not evidence, and this diff is.
            #
            # Compared per NAME, as a multiset. The census regex truncates a theory's parameter list, so
            # `Foo.Bar(x: 1)` and `Foo.Bar(x: 2)` both census as `Foo.Bar`; TRX names are normalised the
            # same way and counted, so a method short by N cases is reported as short by N.
            $namesFile = $env:COSMOS_EXPECTED_NAMES_FILE
            if ($namesFile -and (Test-Path $namesFile)) {
              $expectedCounts = @{}
              foreach ($line in (Get-Content $namesFile | Where-Object { $_.Trim() })) {
                $n = $line.Trim()
                $expectedCounts[$n] = 1 + ($expectedCounts[$n] ?? 0)
              }
              $observedCounts = @{}
              foreach ($trx in $trxFiles) {
                [xml]$x = Get-Content $trx.FullName
                foreach ($r in $x.TestRun.Results.UnitTestResult) {
                  $n = ($r.testName -replace '\(.*$', '').Trim()
                  $observedCounts[$n] = 1 + ($observedCounts[$n] ?? 0)
                }
              }
              $allNames = @($expectedCounts.Keys) + @($observedCounts.Keys) | Sort-Object -Unique
              $short = @(); $surplus = @()
              foreach ($n in $allNames) {
                $e = $expectedCounts[$n] ?? 0
                $o = $observedCounts[$n] ?? 0
                if ($o -lt $e) { $short += "  -$($e - $o)  $n   (enumerated $e, saw $o)" }
                elseif ($o -gt $e) { $surplus += "  +$($o - $e)  $n   (enumerated $e, saw $o)" }
              }
              if ($short.Count -gt 0) {
                Write-Host "`nENUMERATED BUT NOT ACCOUNTED FOR ($($short.Count) name(s)) -- candidates for a genuinely partial run:"
                $short | ForEach-Object { Write-Host $_ }
              }
              if ($surplus.Count -gt 0) {
                Write-Host "`nACCOUNTED FOR BUT NOT ENUMERATED ($($surplus.Count) name(s)) -- candidates for a census defect:"
                $surplus | ForEach-Object { Write-Host $_ }
              }
              if ($short.Count -eq 0 -and $surplus.Count -eq 0) {
                Write-Host "`nPer-name totals agree exactly. The discrepancy is in the COUNTERS, not the test set -- suspect a TRX whose ResultSummary disagrees with its own rows."
              }
            } else {
              Write-Host "`n(no expected-name list at '$namesFile' -- run the census to get a named diff instead of this arithmetic)"
            }
            Write-Error "REFUSE -- $accounted tests accounted for against an EXPECTED set of $expected. A run that dies partway reports a clean failure total, so this discrepancy is the finding, not a rounding issue."
            exit 3
          }
          if ($totalFailed -gt 0) {
            Write-Error "Integration tests had $totalFailed failure(s)"
            exit 1
          }
          Write-Host "Integration shard: executed $totalExecuted of $expected expected, $totalFailed failed."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-integration
          path: TestResults/*.trx
          retention-days: 30

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage-integration
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 30

  # ── Functional tests -- self-contained build ──
  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Setup build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          solution-filter: eng/ci/shards/TestsOnly.slnf

      - name: Compose functional test filter
        shell: pwsh
        run: |
          $filterInfo = ./eng/ci/get-test-filter.ps1 -BaseFilter 'Category=Functional' -Mode Exclude -AsJson | ConvertFrom-Json
          "FUNCTIONAL_TEST_FILTER=$($filterInfo.filter)" >> $env:GITHUB_ENV
          Write-Host "Using functional filter with $($filterInfo.count) quarantined exclusions."

      - name: Run Functional Tests
        run: |
          bash eng/ci/run-filtered-tests.sh \
            --filter "${{ env.FUNCTIONAL_TEST_FILTER }}" -- \
            eng/ci/shards/TestsOnly.slnf \
            --configuration Release \
            --no-build \
            --blame-hang-timeout 5m \
            --logger "trx;LogFileName=functional-tests.trx" \
            --logger "console;verbosity=minimal" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- RunConfiguration.TestSessionTimeout=1200000 DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-functional
          path: TestResults/*.trx
          retention-days: 30

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage-functional
          path: TestResults/*/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 30

  # ── Contract tests -- self-contained build ──
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Setup build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          solution-filter: eng/ci/shards/TestsOnly.slnf

      - name: Run contract tests
        run: |
          dotnet test tests/contract/Excalibur.Dispatch.Contract.Tests/Excalibur.Dispatch.Contract.Tests.csproj \
            --configuration Release \
            --no-build \
            --blame-hang-timeout 5m \
            --logger "trx;LogFileName=contract-tests.trx" \
            --logger "console;verbosity=minimal" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- RunConfiguration.TestSessionTimeout=300000 DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-contract
          path: TestResults/*.trx
          retention-days: 30

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage-contract
          path: TestResults/*/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 30

  # ── Architecture tests -- self-contained build ──
  architecture-tests:
    name: Architecture Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Setup build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          solution-filter: eng/ci/shards/TestsOnly.slnf

      - name: Run architecture test projects
        run: |
          dotnet test tests/architecture/Boundary.Tests/Boundary.Tests.csproj \
            --configuration Release \
            --no-build \
            --blame-hang-timeout 5m \
            --logger "trx;LogFileName=boundary-tests.trx" \
            --logger "console;verbosity=minimal" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- RunConfiguration.TestSessionTimeout=420000 DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload architecture test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-architecture
          path: TestResults/*.trx
          retention-days: 30

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: code-coverage-architecture
          path: TestResults/*/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 30

  # ── Flaky quarantine governance ──
  flaky-quarantine-governance:
    name: Flaky Quarantine Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: package
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}

      - name: Validate flaky quarantine policy
        shell: pwsh
        run: |
          ./eng/ci/validate-flaky-quarantine.ps1 -OutDir management/reports/FlakyQuarantineReport -Enforce:$true

      - name: Upload quarantine governance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flaky-quarantine-report
          path: management/reports/FlakyQuarantineReport
          retention-days: 30

  # ── Flaky tests quarantine run (non-blocking) ──
  flaky-tests-quarantine:
    name: Flaky Tests Quarantine (Non-blocking)
    runs-on: ubuntu-latest
    needs: flaky-quarantine-governance
    if: always()
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Compose quarantined test filter
        shell: pwsh
        run: |
          $filterInfo = ./eng/ci/get-test-filter.ps1 -Mode Include -AsJson | ConvertFrom-Json
          "FLAKY_TEST_FILTER=$($filterInfo.filter)" >> $env:GITHUB_ENV
          "FLAKY_TEST_COUNT=$($filterInfo.count)" >> $env:GITHUB_ENV
          if ([int]$filterInfo.count -eq 0) {
            "## Flaky Tests Quarantine" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            "No tests are currently quarantined." >> $env:GITHUB_STEP_SUMMARY
          }
          else {
            Write-Host "Running $($filterInfo.count) quarantined tests."
          }

      - name: Restore dependencies
        if: env.FLAKY_TEST_COUNT != '0'
        # --locked-mode: see the shipping-restore step. Verified to pass on this shard before
        # being applied; a drifted lock file here fails with NU1004 rather than being rewritten.
        run: bash ./build.sh --restore --project eng/ci/shards/TestsOnly.slnf --locked-mode --verbosity quiet

      - name: Build
        if: env.FLAKY_TEST_COUNT != '0'
        run: bash ./build.sh --build --no-restore --project eng/ci/shards/TestsOnly.slnf --verbosity quiet

      - name: Run quarantined tests
        if: env.FLAKY_TEST_COUNT != '0'
        run: |
          bash eng/ci/run-filtered-tests.sh \
            --filter "${{ env.FLAKY_TEST_FILTER }}" -- \
            eng/ci/shards/TestsOnly.slnf \
            --configuration Release \
            --no-build \
            --blame-hang-timeout 5m \
            --logger "trx;LogFileName=flaky-quarantine.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./TestResults \
            -- RunConfiguration.TestSessionTimeout=900000

      - name: Upload quarantined test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-flaky-quarantine
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 30

  # ── Serialization policy validation ──
  serialization-policy:
    name: Serialization Policy Validation (R0.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: package
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Validate Serializer Policy
        shell: pwsh
        run: |
          Write-Host "Validating serializer policy (R0.14, R20.24-26)..."
          ./eng/validate-serializer-policy.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Serializer policy validation FAILED" -ForegroundColor Red
            exit 1
          }
          Write-Host "Serializer policy validation PASSED" -ForegroundColor Green
      - name: Run serialization boundary audit (extended report)
        shell: pwsh
        run: |
          ./eng/ci/serialization-boundary-audit.ps1 -OutDir management/reports/SerializationBoundaryReport
      - name: Upload serialization boundary report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: serialization-boundary-report
          path: management/reports/SerializationBoundaryReport

  # ── AOT build analysis (report-only) ──
  aot-build-analysis:
    name: AOT Build Analysis (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: package
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
