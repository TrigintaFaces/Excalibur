name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_performance_tests:
        description: 'Run performance regression tests'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  COVERAGE_THRESHOLD: 65
  # TestTimeouts.Scale() multiplies by this and defaults to 1.0 when unset, so an unset job runs every
  # scaled deadline at its bare local value. This lives at WORKFLOW level, not on a job, because the
  # same assembly runs in several: setting it only on `unit-tests` left the deterministic shard
  # unscaled in unit-tests-windows, -windows-async-risk, -macos and -macos-async-risk, and the
  # keyed-lock churn test duly timed out on the Windows agent at its unscaled 30s bound. Any job that
  # runs tests inherits it here; there is no per-job copy to forget.
  #
  # 3 is chosen against measurement: that test drives 16 workers through 4,000 fully serialized
  # acquisitions of one key, completes in 2-3s locally, and overran 30s on an agent running a dozen
  # assemblies in parallel. A timeout only costs wall-clock once something has already gone wrong, so
  # the wider margin trades nothing on the happy path.
  TEST_TIMEOUT_MULTIPLIER: "3"

jobs:
  # ── Package job (Ubuntu) -- NuGet packaging, deterministic validation ──
  # Replaces the old 'build' job. Does NOT produce test artifacts.
  package:
    name: Package (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h
          sudo rm -rf /usr/local/lib/android &            # ~12GB
          sudo rm -rf /opt/hostedtoolcache/CodeQL &       # ~6GB
          sudo rm -rf /usr/share/swift &                  # ~1.5GB
          sudo rm -rf /opt/ghc &
          sudo rm -rf /home/linuxbrew &
          sudo rm -rf /usr/local/.ghcup &
          sudo rm -rf /usr/local/share/boost &
          sudo rm -rf /usr/local/share/powershell &
          wait
          sudo apt-get clean || true
          docker system prune -af 2>/dev/null || true
          echo "Disk usage after cleanup:"
          df -h

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: .nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore shipping projects
        # --locked-mode: fail the build if any packages.lock.json disagrees with the project's
        # package references, instead of silently rewriting the lock file. Without it the 251
        # committed lock files are documentation: a drifted (or downgraded) dependency restores
        # green and the pinned version is overwritten in place. NU1004 names the package and both
        # versions. Samples carry no lock files, so this flag is deliberately NOT applied there.
        run: dotnet restore eng/ci/shards/ShippingOnly.slnf --locked-mode --verbosity quiet

      # Build the Dispatch core FIRST (clean, --no-incremental) before the transitive store
      # projects. A core public-API lag (RS0016/RS0017 -- a public symbol missing its PublicAPI.*.txt
      # entry) then fails fast HERE with a clear "core public API" error, instead of surfacing late and
      # confusingly as a downstream store-project build failure (a recurring core-public-API-lag pattern).
      - name: Build core first (fail fast on core public-API lag)
        run: dotnet build src/Dispatch/Excalibur.Dispatch/Excalibur.Dispatch.csproj --configuration Release --no-restore --no-incremental --verbosity quiet

      - name: Build shipping projects
        run: dotnet build eng/ci/shards/ShippingOnly.slnf --configuration Release --no-restore --verbosity quiet

      - name: Deterministic build validation
        run: |
          echo "Validating deterministic builds with CI flag..."
          dotnet build eng/ci/shards/ShippingOnly.slnf --configuration Release --no-restore -p:CI=true --verbosity quiet
          echo "Deterministic build validation successful"

      - name: Package validation
        run: |
          echo "Validating packageable projects..."
          dotnet pack eng/ci/shards/ShippingOnly.slnf --configuration Release --no-build --verbosity minimal --output ./packages
          echo "Package creation successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            ./packages/*.nupkg
            ./packages/*.snupkg
          retention-days: 1

  # Security scanning (reusable workflow)
  call-security:
    needs: package
    uses: ./.github/workflows/security.yml
    with:
      checkout-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      checkout-token: ${{ github.token }}
      event-name: ${{ github.event_name }}
    secrets: inherit

  # Governance validation (reusable workflow)
  call-governance:
    needs: package
    uses: ./.github/workflows/governance.yml
    with:
      checkout-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      checkout-token: ${{ github.token }}
      event-name: ${{ github.event_name }}
    secrets: inherit

  # Documentation validation (independent, no build dependency)
  dashboard-spa:
    name: Dashboard SPA (tests, types, asset drift)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/Excalibur/Excalibur.Operations.Dashboard.Spa/ClientApp/package-lock.json

      - name: Install dependencies
        working-directory: src/Excalibur/Excalibur.Operations.Dashboard.Spa/ClientApp
        run: npm ci

      # Runs vitest, svelte-check, and the asset-drift check. Before this job existed none of
      # the three ran in any pipeline: the SPA's tests were invoked by nothing, and its type
      # gate sat behind an MSBuild target defaulting to BuildSpaAssets=false.
      - name: SPA gate
        run: bash eng/ci/spa-gate.sh

      # The gate is only evidence if it can fail. This plants a source change with stale
      # assets and asserts the drift check goes RED, then restores the file.
      - name: Prove the gate is non-vacuous
        run: bash eng/ci/spa-gate.test.sh

  documentation-validation:
    name: Documentation Verification (T5.4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: TypeScript check
        working-directory: docs-site
        run: npm run typecheck

      - name: Validate version-safe docs links
        working-directory: docs-site
        run: npm run validate:version-links

      # Diff-scoped: fails only when a doc changed in THIS PR introduces a C# snippet
      # referencing a framework type that does not exist in the real public surface.
      # Pre-existing phantoms in untouched docs are tolerated (cleaned up separately);
      # intentional placeholders opt out with a ```csharp ignore fence. CI, not pre-commit.
      - name: Docs C# snippet phantom gate (diff-scoped)
        run: |
          git fetch --no-tags origin "${{ github.base_ref || 'main' }}" || true
          export DOCS_GATE_BASE_REF="origin/${{ github.base_ref || 'main' }}"
          bash eng/ci/docs-csharp-phantom-gate.sh

      # The gate is only evidence if it can fail: safety (a new phantom -> RED), liveness
      # (a real API -> GREEN), diff-scope (a pre-existing phantom in an unchanged doc -> GREEN),
      # and the ignore-marker opt-out. Proves all arms against a throwaway fixture.
      - name: Prove the docs phantom gate is non-vacuous
        run: bash eng/ci/docs-csharp-phantom-gate.test.sh

      - name: Build Docusaurus (enforcing zero warnings)
        working-directory: docs-site
        env:
          CI: true
          DOCUSAURUS_STRICT_LINKS: true
        run: |
          echo "Building Docusaurus with strict link validation..."
          npm run build 2>&1 | tee build-output.txt
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          WARNING_COUNT=$(grep -c -E "(warning|Warning)" build-output.txt || true)
          echo "Build exit code: $BUILD_EXIT_CODE"
          echo "Warning count: $WARNING_COUNT"
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "Docusaurus build FAILED"
            exit 1
          fi
          if [ "$WARNING_COUNT" -gt 0 ]; then
            echo "DOCS_WARNINGS=$WARNING_COUNT" >> $GITHUB_ENV
            echo "::error::Docusaurus build produced $WARNING_COUNT warning(s); this step enforces zero."
            grep -E "(warning|Warning)" build-output.txt
            # Until now this step COUNTED the warnings, wrote the count to a summary table, and
            # exited 0 -- its name asserted an enforcement its body never performed. Fail, so the
            # name is true. A step whose name promises a gate must be able to go red.
            exit 1
          fi
          echo "Docusaurus build completed with zero warnings"
          echo "DOCS_WARNINGS=0" >> $GITHUB_ENV

      - name: Verify build output exists
        run: |
          if [ ! -d "docs-site/build" ]; then
            echo "Build output directory not found"
            exit 1
          fi
          FILE_COUNT=$(find docs-site/build -name "*.html" | wc -l)
          echo "Built $FILE_COUNT HTML pages"
          if [ "$FILE_COUNT" -lt 10 ]; then
            echo "Build appears incomplete (less than 10 HTML pages)"
            exit 1
          fi

      - name: Upload build output for inspection
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-build-output
          path: docs-site/build-output.txt
          retention-days: 7

      - name: Documentation validation summary
        if: always()
        run: |
          echo "## Documentation Verification (T5.4)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Check | ${{ job.status == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docusaurus Build | ${{ job.status == 'success' && 'PASS' || 'FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Warnings | ${{ env.DOCS_WARNINGS || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Documentation verification passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "Documentation verification failed - see logs for details" >> $GITHUB_STEP_SUMMARY
          fi

  # ── Smoke tests -- no dependencies, starts immediately for fast PR feedback ──
  smoke-tests:
    name: Smoke Tests (Critical Path)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          solution-filter: eng/ci/shards/TestsOnly.slnf
          test-filter: "Priority=0"
          results-prefix: smoke-tests
          quarantine-mode: None
          base-test-filter: "Priority=0"
          test-session-timeout: '300000'

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-smoke
          path: TestResults/*.trx
          retention-days: 7

  # ── Unit shard coverage audit ──
  unit-shard-coverage:
    name: Unit Shard Coverage Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: package
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}

      - name: Validate unit-test shard coverage
        shell: pwsh
        run: |
          ./eng/ci/validate-unit-shards.ps1 -OutDir management/reports/UnitShardReport -Enforce $true

      - name: Upload shard coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-shard-coverage-report
          path: management/reports/UnitShardReport
          retention-days: 14

  # ── Unit tests -- 4 deterministic shards, self-contained build per shard ──
  unit-tests:
    name: Unit Tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    needs: smoke-tests
    timeout-minutes: 15
    # TEST_TIMEOUT_MULTIPLIER is inherited from the workflow env, deliberately: this job is not the
    # only one that runs the deterministic shard, and a copy here is what let the others go unscaled.
    strategy:
      matrix:
        shard:
          - { name: core, filter: "eng/ci/shards/UnitTests-Core.slnf" }
          # moe5g9: run the transport shard serial (xUnit.MaxParallelThreads=1 + no collection parallelism)
          # to avoid the concurrency-dependent librdkafka native-thread leak that roots the vstest host.
          - { name: transport, filter: "eng/ci/shards/UnitTests-Transport.slnf", extra-run-settings: "xUnit.MaxParallelThreads=1 xUnit.ParallelizeTestCollections=false" }
          - { name: middleware, filter: "eng/ci/shards/UnitTests-Middleware.slnf" }
          - { name: excalibur, filter: "eng/ci/shards/UnitTests-Excalibur.slnf" }
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          solution-filter: ${{ matrix.shard.filter }}
          collect-coverage: 'true'
          results-prefix: unit-tests-${{ matrix.shard.name }}
          free-disk-space: 'true'
          extra-run-settings: ${{ matrix.shard.extra-run-settings }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-${{ matrix.shard.name }}
          path: TestResults/*.trx
          retention-days: 30

      - name: Upload code coverage
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-unit-${{ matrix.shard.name }}
          path: TestResults/*/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 30

  # ── Async-risk unit tests -- advisory on PRs, blocking on push to main ──
  unit-tests-async-risk:
    name: Unit Tests - Async Risk (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    needs: smoke-tests
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 15
    strategy:
      matrix:
        shard:
          - { name: messaging, filter: "eng/ci/shards/UnitTests-Messaging.slnf" }
          - { name: observability, filter: "eng/ci/shards/UnitTests-Observability.slnf" }
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          solution-filter: ${{ matrix.shard.filter }}
          collect-coverage: 'true'
          results-prefix: unit-tests-async-risk-${{ matrix.shard.name }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-async-risk-${{ matrix.shard.name }}
          path: TestResults/*.trx
          retention-days: 30

      - name: Upload code coverage
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-unit-async-risk-${{ matrix.shard.name }}
          path: TestResults/*/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 30

  # ── Honest cross-shard aggregation ──
  # The per-shard jobs fail their own run on a test failure, but nothing asserted that the EXPECTED set
  # of blocking unit assemblies actually compiled and produced results: a project that fails to compile
  # (or is silently dropped) emits no trx, contributes 0 failures, and reads as CLEAN;
  # and an assembly in >1 shard is double-counted in any naive sum. This job gathers every unit
  # trx, dedupes by assembly, and REDs on any missing/non-compiling assembly or distinct failure.
  unit-shard-aggregation:
    name: Unit Shard Aggregation (honest set + compile + de-dup)
    runs-on: ubuntu-latest
    needs: [unit-tests, unit-tests-async-risk]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Download unit test result artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: test-results-unit-*
          path: AggregatedTrx
          merge-multiple: true
      - name: Verify honest aggregation (expected set compiled + ran, de-duped)
        shell: pwsh
        run: |
          # Expected assemblies = the BLOCKING (deterministic) tier projects. Every one MUST have produced
          # results; the advisory async-risk tier is reported but not enforced here (it stays advisory on
          # PRs per the shard policy). Assembly name = <ProjectFileBaseName>.dll.
          $det = Get-Content eng/ci/shards/UnitTests-Deterministic.slnf -Raw | ConvertFrom-Json
          $expected = @($det.solution.projects |
            Where-Object { $_ -like 'tests\unit\*' } |
            ForEach-Object { [IO.Path]::GetFileNameWithoutExtension($_) + '.dll' } |
            Sort-Object -Unique)
          Write-Host "Enforcing $($expected.Count) blocking-tier assemblies."
          # Non-vacuity floor: if the slnf derivation ever yields far fewer than the tier really holds,
          # the gate must refuse (exit 2) rather than pass a shrunken set (fmvdpg/tpu8m2 trap). 40 is a
          # conservative floor well below the current ~53 blocking-tier assemblies.
          ./eng/ci/validate-shard-results.ps1 -TrxDir AggregatedTrx -ExpectedAssemblies $expected -Enforce $true -MinExpectedAssemblies 40 -OutDir management/reports/ShardAggregation
      - name: Upload aggregation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-shard-aggregation-report
          path: management/reports/ShardAggregation/*.json
          if-no-files-found: warn
          retention-days: 30

  # ── Cross-platform: Windows deterministic ──
  unit-tests-windows:
    name: Unit Tests (Windows - Deterministic)
    runs-on: windows-latest
    needs: smoke-tests
    timeout-minutes: 60
    env:
      VSTEST_CONNECTION_TIMEOUT: 600
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          solution-filter: eng/ci/shards/UnitTests-Deterministic.slnf
          collect-coverage: 'false'
          results-prefix: unit-tests-windows-deterministic
          test-session-timeout: '1500000'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-windows-deterministic
          path: TestResults/*.trx
          retention-days: 30

  # ── Cross-platform: Windows async-risk ──
  unit-tests-windows-async-risk:
    name: Unit Tests (Windows - Async Risk)
    runs-on: windows-latest
    needs: smoke-tests
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 60
    env:
      VSTEST_CONNECTION_TIMEOUT: 600
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          solution-filter: eng/ci/shards/UnitTests-AsyncRisk.slnf
          collect-coverage: 'false'
          results-prefix: unit-tests-windows-async-risk
          max-cpu-count: '1'
          test-session-timeout: '1500000'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-windows-async-risk
          path: TestResults/*.trx
          retention-days: 30

  # ── Cross-platform: macOS deterministic ──
  unit-tests-macos:
    name: Unit Tests (macOS - Deterministic)
    runs-on: macos-latest
    needs: smoke-tests
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          solution-filter: eng/ci/shards/UnitTests-Deterministic.slnf
          collect-coverage: 'false'
          results-prefix: unit-tests-macos-deterministic
          test-session-timeout: '1500000'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-macos-deterministic
          path: TestResults/*.trx
          retention-days: 30

  # ── Cross-platform: macOS async-risk (sequenced after deterministic to limit 10x billing) ──
  unit-tests-macos-async-risk:
    name: Unit Tests (macOS - Async Risk)
    runs-on: macos-latest
    needs: unit-tests-macos
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Build and test
        uses: ./.github/actions/build-and-test
        with:
          solution-filter: eng/ci/shards/UnitTests-AsyncRisk.slnf
          collect-coverage: 'false'
          results-prefix: unit-tests-macos-async-risk
          max-cpu-count: '1'
          test-session-timeout: '1500000'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-macos-async-risk
          path: TestResults/*.trx
          retention-days: 30

  # ── Integration tests -- self-contained build, Docker pre-flight, -m:1 ──
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      - name: Setup build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          solution-filter: eng/ci/shards/IntegrationTests.slnf

      - name: Integration preflight diagnostics
        shell: pwsh
        run: |
          Write-Host "Runner OS: $env:RUNNER_OS"
          Write-Host "DOTNET_ROOT: $env:DOTNET_ROOT"
          Write-Host "GITHUB_ACTIONS: $env:GITHUB_ACTIONS"
          Write-Host "Docker command available: $([bool](Get-Command docker -ErrorAction SilentlyContinue))"
          if (Get-Command docker -ErrorAction SilentlyContinue) {
            docker --version
          }
          foreach ($name in @('AZURE_KEYVAULT_URI', 'COSMOS_EMULATOR_ENDPOINT')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Host ("{0}: not set" -f $name)
            }
            else {
              Write-Host ("{0}: set" -f $name)
            }
          }

      - name: Verify XPlat coverage collector package
        shell: bash
        run: |
          set -euo pipefail
          dotnet list tests/integration/Excalibur.Dispatch.Integration.Tests/Excalibur.Dispatch.Integration.Tests.csproj package --include-transitive | tee integration-packages.log
          if ! grep -qi "coverlet\\.collector" integration-packages.log; then
            echo "::error::coverlet.collector package is unavailable for integration tests (XPlat Code Coverage collector)."
            exit 1
          fi

      - name: Compose integration test filter
        shell: pwsh
        run: |
          $baseFilter = 'Category=Integration|Category=EndToEnd'
          $filterInfo = ./eng/ci/get-test-filter.ps1 -BaseFilter $baseFilter -Mode Exclude -AsJson | ConvertFrom-Json
          "INTEGRATION_TEST_FILTER=$($filterInfo.filter)" >> $env:GITHUB_ENV
          Write-Host "Using integration filter with $($filterInfo.count) quarantined exclusions."

      - name: Run Integration Tests
        id: run-integration
        # No step-level continue-on-error. The JOB already declares
        #   continue-on-error: ${{ github.event_name == 'pull_request' }}
        # which is the intended contract: advisory on a PR, blocking on push.
        # An unconditional `continue-on-error: true` here meant this step could
        # never fail, so the job could never fail, so that job-level guard was
        # unreachable — a correct control nullified by a nested one eleven lines
        # below it. Failures now propagate to the job, which decides by event.
        run: |
          bash eng/ci/run-filtered-tests.sh \
            --filter "${{ env.INTEGRATION_TEST_FILTER }}" -- \
            eng/ci/shards/IntegrationTests.slnf \
            -m:1 \
            --configuration Release \
            --no-build \
            --blame-hang-timeout 10m \
            --logger "trx;LogFilePrefix=integration-tests" \
            --logger "console;verbosity=minimal" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- RunConfiguration.TestSessionTimeout=3600000 DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Cleanup orphaned Docker containers
        if: always()
        run: |
          # Kill any TestContainers that survived a test host crash
          docker ps -q --filter "name=vault-compliance-test" | xargs -r docker rm -f 2>/dev/null || true
          docker ps -q --filter "name=testcontainers" | xargs -r docker rm -f 2>/dev/null || true

      - name: Verify integration test results
        if: always()
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Path ./TestResults -Filter "*.trx" -Recurse -ErrorAction SilentlyContinue
          if ($trxFiles.Count -eq 0) {
            Write-Error "No TRX result files found -- test run may have failed to start"
            exit 1
          }
          $totalFailed = 0
          foreach ($trx in $trxFiles) {
            [xml]$xml = Get-Content $trx.FullName
            $counters = $xml.TestRun.ResultSummary.Counters
            $failed = [int]$counters.failed
            $passed = [int]$counters.passed
            $total = [int]$counters.total
            Write-Host "$($trx.Name): passed=$passed failed=$failed total=$total"
            $totalFailed += $failed
          }
          if ($totalFailed -gt 0) {
            Write-Error "Integration tests had $totalFailed failure(s)"
            exit 1
          }
          Write-Host "All integration tests passed (test host cleanup crash is non-fatal)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-integration
          path: TestResults/*.trx
          retention-days: 30

      - name: Upload code coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-integration
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 30

  # ── Functional tests -- self-contained build ──
  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
