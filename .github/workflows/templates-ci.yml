# Template Validation Workflow
# Purpose: Validate dotnet new templates produce buildable projects
# Owner: SystemDeveloper

name: Templates CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'templates/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
  pull_request:
    branches: [main, develop]
    paths:
      - 'templates/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
  workflow_dispatch:

permissions: read-all

concurrency:
  # Event-aware: a PUSH keys the group by run id, so it shares a group with nothing and cannot be
  # superseded -- neither while running nor while queued. Every commit on a protected branch must
  # reach a verdict, and a ref-keyed group with an unconditional cancel silently denied that to
  # any commit followed quickly by another. Superseding a stale PULL REQUEST run is still wanted,
  # so PRs group by number and keep cancel-in-progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  validate-templates:
    name: Validate Templates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-templates-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-templates-
            ${{ runner.os }}-nuget-

      # Pack THIS TREE, so the scaffold build below answers "is this commit correct?".
      #
      # The templates float 10.0.0-*, and a scaffold built with no local feed resolves that from
      # nuget.org -- i.e. against the LAST RELEASE, not against the code in this commit. That makes
      # the job red for the whole window between any breaking change and the next publish, which is
      # correct work failing a gate, and a gate that is red for correct work is one people learn to
      # ignore. It also means a template broken BY this commit still passes as long as the published
      # packages happen to satisfy it.
      - name: Pack this tree to a local feed
        shell: pwsh
        run: |
          dotnet pack eng/ci/shards/ShippingOnly.slnf --configuration Release `
            --verbosity minimal --output ./artifacts/local-feed
          # The exact version is read back from a package rather than computed, so it cannot drift
          # from what was actually produced.
          $pkg = Get-ChildItem ./artifacts/local-feed -Filter 'Excalibur.Dispatch.*.nupkg' |
                 Where-Object { $_.Name -notmatch '\.symbols\.' } | Select-Object -First 1
          if (-not $pkg) { throw "pack produced no Excalibur.Dispatch package to read a version from" }
          if ($pkg.Name -notmatch '^Excalibur\.Dispatch\.((?:\d+\.){2}\d+.*)\.nupkg$') {
            throw "could not read a version out of $($pkg.Name)"
          }
          "LOCAL_FEED_VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "local feed version: $($Matches[1])"

      - name: Validate templates against THIS TREE
        shell: pwsh
        run: ./eng/test-templates.ps1 -LocalFeed ./artifacts/local-feed -LocalFeedVersion $env:LOCAL_FEED_VERSION

      # The other half of the question, and it is a different one: can a consumer scaffold TODAY,
      # against what is actually on nuget.org? That is release readiness, not commit correctness, and
      # it is ALLOWED to be red while a breaking change is in flight -- during that window it is
      # telling the truth. It caught "every scaffold is unrestorable" once and must keep being able to.
      #
      # workflow_dispatch ONLY, and deliberately not a schedule: this workflow has no schedule trigger
      # and none is added here, so the check runs when someone asks for it -- which is the moment
      # before cutting a release, the only moment its answer is actionable.
      - name: Validate templates against the published feed (release readiness)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./eng/test-templates.ps1

      - name: Template validation summary
        if: always()
        run: |
          echo "# Template Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validates all \`dotnet new\` templates produce buildable projects" >> $GITHUB_STEP_SUMMARY
          echo "with correct structure across all option combinations." >> $GITHUB_STEP_SUMMARY
