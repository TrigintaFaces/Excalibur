name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'images/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'images/**'
      - '.github/workflows/docs.yml'
  # Allow manual trigger
  workflow_dispatch:

# Build tools do not receive deployment or OIDC authority.
permissions: {}

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pages: read # configure-pages reads the existing site's configuration.
    env:
      # States pre-release STATUS, not availability: a reader who dismisses an
      # "available" banner has dismissed the only notice that the API can still change.
      DOCS_ANNOUNCEMENT_TEXT: 'Excalibur 10.0.0 is a <strong>pre-release</strong>. The API is not frozen until RC — <a href="/docs/known-issues">read the known issues</a> before adopting it.'
      DOCS_ANNOUNCEMENT_ID: "prerelease-status"
    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 0  # Required for lastUpdated to work

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      # A file under static/ is copied verbatim to the site root, so this lands at /build-stamp.txt
      # and can be fetched without a credential. It is what lets the deploy verify itself: without a
      # per-commit marker in the published output there is no way to tell a site that just updated
      # from one that silently kept serving the previous build.
      - name: Stamp the build with the commit that produced it
        run: echo "${GITHUB_SHA}" > static/build-stamp.txt

      # ── API reference ────────────────────────────────────────────────────────
      # DocFX generated a complete per-type reference and then discarded it: its own
      # workflow ends at upload-artifact with retention-days 30, so nothing a reader
      # can reach ever held it. Generating it HERE instead puts it inside the single
      # Pages artifact this job already uploads (docs-site/build), so there is no
      # second deploy target, no new workflow, and no extra Actions run. Docusaurus
      # copies static/ verbatim, so the output is served at /api/.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install DocFX
        # Pinned via .config/dotnet-tools.json rather than floating to newest.
        working-directory: .
        run: dotnet tool restore

      - name: Generate the API reference
        working-directory: eng/docs/api
        run: |
          dotnet docfx metadata docfx.json
          dotnet docfx build docfx.json

      # Verified before wiring this: all generated pages use relative links only
      # (zero root-absolute href/src across the output), so serving them from the
      # /api/ subpath rather than the site root does not break navigation.
      - name: Stage the API reference into the site
        run: |
          set -euo pipefail
          test -d ../eng/docs/api/_site || { echo "::error::DocFX produced no _site"; exit 1; }
          pages=$(find ../eng/docs/api/_site -name '*.html' | wc -l)
          echo "Staging ${pages} generated API pages into static/api/"
          # A thin reference is a generation failure that still exits 0; fail loudly
          # rather than publish an empty API section.
          if [ "${pages}" -lt 500 ]; then
            echo "::error::Only ${pages} API pages generated; expected many more."
            exit 1
          fi
          rm -rf static/api
          mkdir -p static/api
          cp -R ../eng/docs/api/_site/. static/api/

      - name: Build website
        run: npm run build

      - name: Confirm the API reference reached the built output
        run: |
          set -euo pipefail
          test -f build/api/index.html || { echo "::error::/api/ missing from build output"; exit 1; }
          echo "API reference published at /api/ ($(find build/api -name '*.html' | wc -l) pages)"

      - name: Confirm the stamp reached the built output
        run: |
          set -euo pipefail
          # The stamp is useless if the build drops it. Checking here means a later failure at the
          # live URL means the DEPLOY did not land, and not that the marker was never built.
          test -f build/build-stamp.txt
          built="$(cat build/build-stamp.txt)"
          if [ "$built" != "${GITHUB_SHA}" ]; then
            echo "::error::the built stamp is '${built}', expected '${GITHUB_SHA}'"
            exit 1
          fi
          echo "stamp present in build output: ${built}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs-site/build

  # Deployment job (only on main branch)
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      # "The workflow ran" and "the page changed" are different claims, and only the second one is
      # what a reader gets. A deploy that reports success while the site keeps serving the previous
      # build is indistinguishable from a working one from inside the workflow, so this asks the
      # published site what it is actually serving and fails if the answer is not this commit.
      #
      # Polls because Pages propagation is not instantaneous; a fixed sleep would either be too
      # short to be reliable or long enough to waste every run. Bounded, so a deploy that never
      # lands fails rather than hanging.
      - name: Verify the published site is serving this commit
        shell: bash
        run: |
          set -uo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          url="${base}/build-stamp.txt"
          echo "verifying ${url} carries ${GITHUB_SHA}"

          served=""
          for attempt in $(seq 1 20); do
            served="$(curl -fsS --max-time 20 "${url}" 2>/dev/null | tr -d '[:space:]')" || served=""
            if [ "${served}" = "${GITHUB_SHA}" ]; then
              echo "published site is serving this commit (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt}: site is serving '${served:-<no response>}'"
            sleep 15
          done

          echo "::error::REFUSE: after 5 minutes the published site serves '${served:-<no response>}', not ${GITHUB_SHA}. The deploy reported success but the site did not change, so every documentation correction in this commit is still invisible to readers. Check the Pages deployment for this run before assuming the content is live."
          exit 1
