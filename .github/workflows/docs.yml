name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'images/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'images/**'
      - '.github/workflows/docs.yml'
  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCS_ANNOUNCEMENT_TEXT: "A new Excalibur prerelease is available."
      DOCS_ANNOUNCEMENT_ID: "release-prerelease"
    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 0  # Required for lastUpdated to work

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      # A file under static/ is copied verbatim to the site root, so this lands at /build-stamp.txt
      # and can be fetched without a credential. It is what lets the deploy verify itself: without a
      # per-commit marker in the published output there is no way to tell a site that just updated
      # from one that silently kept serving the previous build.
      - name: Stamp the build with the commit that produced it
        run: echo "${GITHUB_SHA}" > static/build-stamp.txt

      - name: Build website
        run: npm run build

      - name: Confirm the stamp reached the built output
        run: |
          set -euo pipefail
          # The stamp is useless if the build drops it. Checking here means a later failure at the
          # live URL means the DEPLOY did not land, and not that the marker was never built.
          test -f build/build-stamp.txt
          built="$(cat build/build-stamp.txt)"
          if [ "$built" != "${GITHUB_SHA}" ]; then
            echo "::error::the built stamp is '${built}', expected '${GITHUB_SHA}'"
            exit 1
          fi
          echo "stamp present in build output: ${built}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs-site/build

  # Deployment job (only on main branch)
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      # "The workflow ran" and "the page changed" are different claims, and only the second one is
      # what a reader gets. A deploy that reports success while the site keeps serving the previous
      # build is indistinguishable from a working one from inside the workflow, so this asks the
      # published site what it is actually serving and fails if the answer is not this commit.
      #
      # Polls because Pages propagation is not instantaneous; a fixed sleep would either be too
      # short to be reliable or long enough to waste every run. Bounded, so a deploy that never
      # lands fails rather than hanging.
      - name: Verify the published site is serving this commit
        shell: bash
        run: |
          set -uo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          url="${base}/build-stamp.txt"
          echo "verifying ${url} carries ${GITHUB_SHA}"

          served=""
          for attempt in $(seq 1 20); do
            served="$(curl -fsS --max-time 20 "${url}" 2>/dev/null | tr -d '[:space:]')" || served=""
            if [ "${served}" = "${GITHUB_SHA}" ]; then
              echo "published site is serving this commit (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt}: site is serving '${served:-<no response>}'"
            sleep 15
          done

          echo "::error::REFUSE: after 5 minutes the published site serves '${served:-<no response>}', not ${GITHUB_SHA}. The deploy reported success but the site did not change, so every documentation correction in this commit is still invisible to readers. Check the Pages deployment for this run before assuming the content is live."
          exit 1
