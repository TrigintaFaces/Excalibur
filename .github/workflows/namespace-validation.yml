name: Namespace Depth Validation

# Enforces the namespace-depth limit: a namespace may not exceed the documented segment budget.
# Runs on all pushes and PRs to ensure violations cannot reach main branch

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**/*.cs'
      - 'tests/architecture/Boundary.Tests/**'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/namespace-validation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**/*.cs'
      - 'tests/architecture/Boundary.Tests/**'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/namespace-validation.yml'
  workflow_dispatch: # Allow manual triggering

# Least privilege, declared explicitly. GITHUB_TOKEN otherwise inherits the repository
# default, which may be write-all; a workflow that only reads code and reports should never
# hold a token that can push. Declaring permissions REPLACES the default set rather than
# adding to it, so every scope this workflow needs is listed here.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # Event-aware: a PUSH keys the group by run id, so it shares a group with nothing and cannot be
  # superseded -- neither while running nor while queued. Every commit on a protected branch must
  # reach a verdict, and a ref-keyed group with an unconditional cancel silently denied that to
  # any commit followed quickly by another. Superseding a stale PULL REQUEST run is still wanted,
  # so PRs group by number and keep cancel-in-progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  namespace-depth-validation:
    name: Validate Namespace Depth
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Validate namespace depth with Roslyn
        run: |
          dotnet test tests/architecture/Boundary.Tests/Boundary.Tests.csproj \
            --configuration Release -m:1 -warnaserror -p:BuildExamplesAndTests=true \
            -p:SolutionDir="$GITHUB_WORKSPACE/" -p:SolutionName=Excalibur \
            --filter FullyQualifiedName~NamespaceDepthShould \
            --logger 'trx;LogFilePrefix=namespace-depth' --results-directory artifacts/namespace-depth \
            --blame-hang-timeout 5m -- RunConfiguration.TestSessionTimeout=300000
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          results = [node for path in pathlib.Path('artifacts/namespace-depth').glob('*.trx')
                     for node in ET.parse(path).iter() if node.tag.endswith('}UnitTestResult')]
          assert results and all(node.attrib['outcome'] == 'Passed' for node in results), 'Namespace tests did not all execute successfully'
          assert any(node.attrib['testName'].endswith('.KeepProductionNamespacesWithinTheDepthBudget') for node in results), 'Production namespace population was not verified'
          print(f'Namespace validation: {len(results)} passed; preferred depth <=4, depth 5 requires justification, depth >=6 prohibited.')
          PY

      - name: Preserve namespace validation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: namespace-depth-results
          path: artifacts/namespace-depth/*.trx
          if-no-files-found: error
          retention-days: 30
