name: Release Rehearsal

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'eng/**'
      - '*.props'
      - '*.targets'
      - 'Directory.Packages.props'
      - '.github/workflows/release-rehearsal.yml'
      # The rehearsal asserts properties of the release job graph -- that the GitHub release stays a
      # draft until packages are uploaded, that publish-nuget is gated on staged validation, and that
      # the release workflow can only ADMIT a package set built by the official build rather than
      # build one itself. Both workflows are listed: without these paths the rehearsal would not run
      # when either CHANGES, so the one edit each assertion exists to catch is the one edit that
      # would not trigger it.
      - '.github/workflows/release.yml'
      - '.github/workflows/official-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'eng/**'
      - '*.props'
      - '*.targets'
      - 'Directory.Packages.props'
      - '.github/workflows/release-rehearsal.yml'
      # The rehearsal asserts properties of the release job graph -- that the GitHub release stays a
      # draft until packages are uploaded, that publish-nuget is gated on staged validation, and that
      # the release workflow can only ADMIT a package set built by the official build rather than
      # build one itself. Both workflows are listed: without these paths the rehearsal would not run
      # when either CHANGES, so the one edit each assertion exists to catch is the one edit that
      # would not trigger it.
      - '.github/workflows/release.yml'
      - '.github/workflows/official-build.yml'
  workflow_dispatch:

# Least privilege, declared explicitly. GITHUB_TOKEN otherwise inherits the repository
# default, which may be write-all; a workflow that only reads code and reports should never
# hold a token that can push. Declaring permissions REPLACES the default set rather than
# adding to it, so every scope this workflow needs is listed here.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # Event-aware: a PUSH keys the group by run id, so it shares a group with nothing and cannot be
  # superseded -- neither while running nor while queued. Every commit on a protected branch must
  # reach a verdict, and a ref-keyed group with an unconditional cancel silently denied that to
  # any commit followed quickly by another. Superseding a stale PULL REQUEST run is still wanted,
  # so PRs group by number and keep cancel-in-progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  release-rehearsal:
    name: Release Rehearsal
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 60

    # Signing-certificate availability is evaluated by step-level `if:` conditions below.
    # It MUST be declared at job scope: a step's own `env:` block is not in scope for that
    # step's `if:`, so a step-scoped declaration makes the condition reference an always-empty
    # value and the guarded step becomes unreachable by construction.
    env:
      NUGET_SIGNING_CERT_BASE64: ${{ secrets.NUGET_SIGNING_CERT_BASE64 }}
      NUGET_SIGNING_CERT_PASSWORD: ${{ secrets.NUGET_SIGNING_CERT_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Runs BEFORE the gate it proves, on every rehearsal. A gate whose own self-test is only run by
      # hand is a gate nobody has checked lately, and this one is the sole structural guard on the
      # promotion contract -- the property that the release workflow publishes a build it did not
      # make. The self-test constructs mutated workflow fixtures that violate each assertion in turn
      # and proves the gate goes RED on every one, and GREEN on a compliant tree: a gate proven only
      # to fail is satisfied by one that rejects everything, and a gate proven only to pass is
      # satisfied by one that asserts nothing.
      - name: Prove the promotion-contract gate can fail
        shell: bash
        run: python3 ./eng/ci/promotion-contract-gate.py --self-test

      - name: Run release rehearsal
        shell: pwsh
        run: |
          ./eng/ci/release-rehearsal.ps1 -OutDir ReleaseRehearsalReport

      - name: Sign NuGet packages (if certificate available)
        if: env.NUGET_SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'nuget-signing.pfx'
          try {
            [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:NUGET_SIGNING_CERT_BASE64))

            $packages = Get-ChildItem -Path 'ReleaseRehearsalReport' -Filter '*.nupkg' -Recurse -ErrorAction SilentlyContinue
            if ($packages.Count -eq 0) {
              # Check local feed output from pack-local.ps1
              $localFeed = Join-Path (Split-Path $PSScriptRoot -Parent) 'artifacts/packages'
              $packages = Get-ChildItem -Path $localFeed -Filter '*.nupkg' -Recurse -ErrorAction SilentlyContinue
            }

            if ($packages.Count -eq 0) {
              Write-Host "No .nupkg files found to sign."
              exit 0
            }

            foreach ($pkg in $packages) {
              Write-Host "Signing: $($pkg.Name)"
              dotnet nuget sign $pkg.FullName `
                --certificate-path $certPath `
                --certificate-password $env:NUGET_SIGNING_CERT_PASSWORD `
                --timestamper http://timestamp.digicert.com `
                --overwrite
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to sign $($pkg.Name)"
              }
            }

            Write-Host "All packages signed successfully."

            # Verify signatures
            foreach ($pkg in $packages) {
              Write-Host "Verifying: $($pkg.Name)"
              dotnet nuget verify $pkg.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Signature verification returned non-zero for $($pkg.Name) -- may require trusted root."
              }
            }
          }
          finally {
            if (Test-Path $certPath) { Remove-Item $certPath -Force }
          }

      - name: NuGet signing skipped (no certificate)
        if: env.NUGET_SIGNING_CERT_BASE64 == ''
        shell: bash
        run: |
          echo "::notice::NuGet package signing skipped -- NUGET_SIGNING_CERT_BASE64 secret not configured."
          echo "To enable signing, add NUGET_SIGNING_CERT_BASE64 and NUGET_SIGNING_CERT_PASSWORD secrets."

      - name: Upload rehearsal report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-rehearsal-report
          path: ReleaseRehearsalReport/
          retention-days: 30

      - name: Post rehearsal summary
        if: always()
        shell: bash
        run: |
          if [ -f "ReleaseRehearsalReport/summary.md" ]; then
            cat ReleaseRehearsalReport/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Release rehearsal report not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
