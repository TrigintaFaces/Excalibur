name: Official Build

# The official build: the ONE place the canonical shipping packages are produced.
#
# Everything downstream of a package -- the checksum manifest, the SBOM, the provenance
# attestation, the release itself -- is a statement about bytes. A statement is only as good as
# its binding to the bytes it describes, so all of it is produced HERE, in one job, beside the
# packages, in the same working directory that packed them. Nothing later re-derives any of it,
# because anything re-derived after a download describes the download.
#
# The release workflow does not build. It ADMITS: it resolves this run, downloads this artifact,
# re-checks these hashes, verifies this attestation, and refuses if any of that cannot be
# established. That is the whole point of separating the two.
#
# WHY A TAG ALSO BUILDS HERE, when "build once, promote many" would prefer it did not.
#
#   A package's version is baked into the .nupkg at pack time and NuGet versions are immutable, so
#   a package cannot be re-stamped later without repacking -- and repacking changes the bytes,
#   which invalidates the very attestation that made the artifact trustworthy. That leaves three
#   options and only one of them is honest:
#
#     re-stamp at release time    changes the bytes, breaks the attestation, promotes nothing
#     ship the height-based       publishes 1.2.3-alpha.0.14 under the tag v1.2.3
#     version
#     build the tagged commit     a second build of the same sources, by the same trusted
#     here, once, with            workflow, with the correct version, fully attested
#     provenance
#
#   The third is what runs. It is not the same BYTES main validated -- it is the same SOURCES,
#   built by the same non-PR workflow, and the release can prove which run produced them. That is
#   the strongest property available under an immutable-version package feed, and it is recorded
#   here so nobody later "corrects" it back into one of the first two.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 1.0.0). Leave blank to use the height-based version."
        required: false
        type: string

# Deny by default at workflow scope; each job grants only what it needs. The build job holds an
# OIDC identity and may record attestations -- nothing else here can, which is the point: an
# attestation anything could produce attests to nothing.
permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

concurrency:
  # Keyed by RUN ID, so every run sits in a group of its own and can be superseded by nothing --
  # not while running, and not while queued. Both halves matter and they are different mechanisms:
  # `cancel-in-progress: false` protects a run that has STARTED, and does nothing for one still
  # pending, which a busy ref-keyed group cancels outright. A cancelled official build leaves a
  # commit with no canonical package set and no way to tell that from one that was never built.
  #
  # This workflow has no pull_request trigger, so there is no run here worth coalescing and no
  # branch of this expression that should ever cancel anything.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-packages:
    name: Build Unsigned Packages
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sdk-version: ${{ steps.sdk.outputs.dotnet-version }}
      handoff-id: ${{ steps.handoff.outputs.artifact-id }}
      handoff-digest: ${{ steps.handoff.outputs.artifact-digest }}
      manifest-sha256: ${{ steps.transfer.outputs.manifest-sha256 }}
    steps:
      - name: Checkout the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # MinVer derives the version from tag history, so a shallow clone would silently produce
          # a different version than a full one. Depth is a correctness input here, not a speed
          # knob.
          fetch-depth: 0

      - name: Setup .NET
        id: sdk
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Resolve the version override BEFORE anything is built, so a malformed one refuses before a
      # single package exists rather than after.
      #
      # A tag carries the version in its own name; a manual dispatch may supply one; a push to the
      # default branch supplies none and MinVer's height-based version stands. "None" is a real
      # answer here, not a missing one -- the branch build is not a release candidate and must not
      # pretend to carry a release version.
      - name: Resolve the version to stamp
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          bash eng/ci/resolve-release-version.sh official

      # --locked-mode: resolve exactly the package graph the committed lock files record, and fail
      # rather than resolve a different one. RestorePackagesWithLockFile is on, so an unlocked
      # restore is free to pick a different graph and rewrite the lock file to match -- which means
      # the dependency graph that SHIPS would not be the graph the test workflow verified, and the
      # difference would never be reported. The verifying build already restores locked; this is the
      # producing build, and it is the one whose graph reaches consumers.
      - name: Restore shipping projects
        run: dotnet restore eng/ci/shards/ShippingOnly.slnf --locked-mode --verbosity quiet

      - name: Build shipping projects
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          # MinVer auto-detects the version from git tags. MinVerVersionOverride is what makes a
          # manual dispatch -- which has no matching tag -- produce the intended version instead of
          # a height-based one.
          if [ -n "$VERSION" ]; then
            dotnet build eng/ci/shards/ShippingOnly.slnf --configuration Release --no-restore --verbosity minimal \
              -p:MinVerVersionOverride="$VERSION"
          else
            dotnet build eng/ci/shards/ShippingOnly.slnf --configuration Release --no-restore --verbosity minimal
          fi

      - name: Create the canonical packages
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          # The version is already baked into the assemblies by MinVer during build. The
          # PackageVersion override is defense-in-depth for the NuGet metadata specifically, so the
          # package identity and the assembly identity cannot drift apart.
          if [ -n "$VERSION" ]; then
            dotnet pack eng/ci/shards/ShippingOnly.slnf \
              --configuration Release \
              --no-build \
              --verbosity minimal \
              --include-symbols \
              --include-source \
              -p:PackageVersion="$VERSION" \
              --output ./packages/
          else
            dotnet pack eng/ci/shards/ShippingOnly.slnf \
              --configuration Release \
              --no-build \
              --verbosity minimal \
              --include-symbols \
              --include-source \
              --output ./packages/
          fi

          # The templates package is not in the shipping shard: templates/ is deliberately isolated
          # from the root build policy by its own Directory.Build.props, so it is not a member of the
          # solution and cannot be named by a solution filter. It is therefore packed explicitly, into
          # the same canonical output, with the same version, or it reaches no consumer at all.
          #
          # "With the same version" is the half a branch build cannot satisfy. There is no explicit
          # version to pass, and this project carries a fixed version of its own rather than the
          # one the rest of the build stamped -- so packing it into the release folder puts two
          # different versions there, and the receipt below refuses the whole set. That refusal is
          # correct: a folder holding two versions does not describe a single build. It is not a
          # reason to relax the receipt. So a branch build packs the templates package to prove it
          # still packs, and keeps it out of the folder that describes the release; a release build,
          # which does have a version to pass, puts it where consumers get it.
          if [ -n "$VERSION" ]; then
            dotnet pack templates/Excalibur.Dispatch.Templates.csproj               --configuration Release               --verbosity minimal               -p:PackageVersion="$VERSION"               --output ./packages/
          else
            dotnet pack templates/Excalibur.Dispatch.Templates.csproj               --configuration Release               --verbosity minimal               --output ./templates-package/
          fi

      - name: Validate packages
        shell: pwsh
        run: |
          Write-Host "📦 Package Validation Summary" -ForegroundColor Green

          $packages = Get-ChildItem ./packages/*.nupkg
          if ($packages.Count -eq 0) {
            Write-Error "No packages created!"
            exit 1
          }

          foreach ($package in $packages) {
            Write-Host "✅ $($package.Name)" -ForegroundColor Green

            # Basic package validation
            $size = [math]::Round($package.Length / 1KB, 2)
            Write-Host "   Size: $size KB"

            # Verify package can be opened (basic integrity check)
            try {
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
              $entryCount = $zip.Entries.Count
              $zip.Dispose()
              Write-Host "   Entries: $entryCount"
            } catch {
              Write-Error "Package integrity check failed: $($package.Name)"
              exit 1
            }
          }

          Write-Host "`n✅ All packages validated successfully" -ForegroundColor Green

      - name: Generate CycloneDX SBOM for the shipping set
        run: |
          # Pinned in .config/dotnet-tools.json rather than installed at whatever version is newest
          # today, so the tool that produces our supply-chain evidence cannot change between runs.
          dotnet tool restore
          dotnet CycloneDX ./src -o ./sbom -F Json -t

      - name: Assert the SBOM exists
        shell: bash
        run: |
          set -euo pipefail
          count=$(find ./sbom -name 'bom.json' -o -name 'bom.xml' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::REFUSE: no SBOM generated. An absent SBOM is not an empty one, and the attestation below would have nothing to bind."
            exit 1
          fi
          echo "SBOM file(s): $count"

      - name: Record the unsigned handoff
        id: transfer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path('official-handoff')
          root.mkdir()
          shutil.copytree('packages', root / 'packages')
          shutil.copytree('sbom', root / 'sbom')
          files = {}
          for path in sorted(root.rglob('*')):
              if path.is_symlink():
                  raise SystemExit('REFUSE: linked handoff input')
              if path.is_file():
                  files[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          context = {key: os.environ[key] for key in ('GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_REF', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}
          manifest = root / 'handoff.json'
          manifest.write_text(json.dumps({'context': context, 'files': files}, sort_keys=True) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('manifest-sha256=' + hashlib.sha256(manifest.read_bytes()).hexdigest() + '\n')
          PY

      - name: Upload the internal unsigned handoff
        id: handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: official-build-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: official-handoff/
          if-no-files-found: error
          retention-days: 7

  packages:
    name: Finalize Official Packages
    needs: build-packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Signing credentials belong only in this environment. Its actual protection
    # settings must be configured and verified before author signing is enabled.
    environment: package-signing
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.receipt.outputs.version }}
    env:
      ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE || 'true' }}
      HANDOFF_ARTIFACT_ID: ${{ needs.build-packages.outputs.handoff-id }}
      HANDOFF_MANIFEST_SHA256: ${{ needs.build-packages.outputs.manifest-sha256 }}
      RELEASE_CANDIDATE_VERSION: ${{ needs.build-packages.outputs.version }}
    steps:
      # Fresh runner: no source checkout, build cache, local action, project
      # evaluation, tool restore, or execution of anything from the handoff.
      - name: Verify the handoff artifact identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.build-packages.outputs.handoff-digest }}
        run: |
          set -euo pipefail
          [[ "$HANDOFF_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$HANDOFF_ARTIFACT_ID" > "$RUNNER_TEMP/handoff-artifact.json"
          python3 - <<'PY'
          import json, os, pathlib
          a = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'handoff-artifact.json').read_text())
          def require(ok, reason):
              if not ok: raise SystemExit('REFUSE: ' + reason)
          require(str(a['id']) == os.environ['HANDOFF_ARTIFACT_ID'], 'artifact ID mismatch')
          require(a['name'] == 'official-build-handoff-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'], 'artifact attempt/name mismatch')
          require(a['expired'] is False, 'expired artifact')
          require(str(a['workflow_run']['id']) == os.environ['GITHUB_RUN_ID'], 'artifact run mismatch')
          require(a['workflow_run']['head_sha'] == os.environ['GITHUB_SHA'], 'artifact source mismatch')
          require(a['digest'] == 'sha256:' + os.environ['EXPECTED_ARTIFACT_DIGEST'].removeprefix('sha256:'), 'artifact digest mismatch')
          PY

      - name: Download the verified unsigned handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-packages.outputs.handoff-id }}
          path: official-handoff
          merge-multiple: true
          digest-mismatch: error

      - name: Verify unsigned handoff contents
        id: verify-handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, zipfile
          import xml.etree.ElementTree as ET
          root = pathlib.Path('official-handoff')
          def require(ok, reason):
              if not ok: raise SystemExit('REFUSE: ' + reason)
          manifest = root / 'handoff.json'
          require(not manifest.is_symlink(), 'linked manifest')
          require(hashlib.sha256(manifest.read_bytes()).hexdigest() == os.environ['HANDOFF_MANIFEST_SHA256'], 'handoff manifest hash mismatch')
          model = json.loads(manifest.read_text())
          context = {key: os.environ[key] for key in ('GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_REF', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}
          require(model['context'] == context, 'handoff invocation mismatch')
          actual = {}
          for path in root.rglob('*'):
              require(not path.is_symlink(), 'linked handoff file')
              if path.is_file() and path != manifest:
                  name = path.relative_to(root).as_posix()
                  require(bool(re.fullmatch(r'packages/[A-Za-z0-9_.+-]+\.(nupkg|snupkg)|sbom/bom\.(json|xml)', name)), 'unexpected handoff file')
                  actual[name] = hashlib.sha256(path.read_bytes()).hexdigest()
          require(actual == model['files'], 'handoff file membership/hash mismatch')
          require('sbom/bom.json' in actual, 'missing SBOM')
          packages = sorted((root / 'packages').glob('*.nupkg'))
          require(bool(packages), 'no shipping packages')
          versions, identities, payloads = set(), set(), {}
          for package in packages:
              with zipfile.ZipFile(package) as archive:
                  names = archive.namelist()
                  require(len(names) == len(set(names)), 'duplicate ZIP entry')
                  require('.signature.p7s' not in names, 'handoff package already signed')
                  nuspecs = [name for name in names if '/' not in name and name.endswith('.nuspec')]
                  require(len(nuspecs) == 1, 'ambiguous package identity')
                  metadata = ET.fromstring(archive.read(nuspecs[0]))
                  identity = metadata.findtext('.//{*}metadata/{*}id')
                  version = metadata.findtext('.//{*}metadata/{*}version')
                  require(bool(identity and version) and identity not in identities, 'missing or duplicate package identity')
                  identities.add(identity); versions.add(version)
                  payloads[package.name] = {name: hashlib.sha256(archive.read(name)).hexdigest() for name in names}
          require(len(versions) == 1, 'inconsistent package versions')
          require(not os.environ.get('RELEASE_CANDIDATE_VERSION') or versions == {os.environ['RELEASE_CANDIDATE_VERSION']}, 'requested version mismatch')
          pathlib.Path(os.environ['RUNNER_TEMP'], 'unsigned-payloads.json').write_text(json.dumps(payloads, sort_keys=True))
          shutil.copytree(root / 'packages', 'packages')
          shutil.copytree(root / 'sbom', 'sbom')
          PY

      # Reads the pin rather than restating it. This was the only setup-dotnet call site of 46 that
      # named a version, so it was the only one that could silently disagree with global.json — and
      # it did, which broke every dotnet command in this job once the pin moved, because the pin is
      # rollForward "disable". Deriving it makes that divergence inexpressible instead of something a
      # comment has to warn about.
      #
      # This step is inside the privileged finalizer job, whose exact shape is digested in
      # eng/ci/official-finalizer-contract.json. Any change to this job needs that contract updated
      # under independent review; comments are not part of the digest, the parsed job is.
      - name: Setup the pinned signing SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          # This job deliberately checks out no source, so global.json is not on disk here.
          # The version is the one the source job installed from global.json, so the pin is
          # still read from one place.
          dotnet-version: ${{ needs.build-packages.outputs.sdk-version }}

      - name: Decide whether this build must be signed
        id: signing
        shell: bash
        env:
          # A build carrying an EXPLICIT version is a release candidate -- it is the only kind the
          # release workflow can promote, because admission asserts every package carries the
          # release version and a height-based branch version cannot match one.
          RELEASE_CANDIDATE_VERSION: ${{ needs.build-packages.outputs.version }}
          NUGET_SIGNING_CERT_BASE64: ${{ secrets.NUGET_SIGNING_CERT_BASE64 }}
          NUGET_SIGNING_CERT_PASSWORD: ${{ secrets.NUGET_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          echo "sign=false" >> "$GITHUB_OUTPUT"
          if { [ -n "${NUGET_SIGNING_CERT_BASE64:-}" ] && [ -z "${NUGET_SIGNING_CERT_PASSWORD:-}" ]; } ||
             { [ -z "${NUGET_SIGNING_CERT_BASE64:-}" ] && [ -n "${NUGET_SIGNING_CERT_PASSWORD:-}" ]; }; then
            echo "::error::REFUSE: incomplete signing credentials"
            exit 1
          fi
          if [ -n "${NUGET_SIGNING_CERT_BASE64:-}" ] && [ -n "${NUGET_SIGNING_CERT_PASSWORD:-}" ]; then
            echo "sign=true" >> "$GITHUB_OUTPUT"
            echo "signing certificate is configured -- packages will be author-signed"
            exit 0
          fi

          # A branch build is not publishable, so a missing certificate there is a fact about the
          # runner rather than a release decision, and must not redden the default branch.
          if [ -z "${RELEASE_CANDIDATE_VERSION:-}" ]; then
            echo "::notice::No signing certificate configured. This build stamps no explicit version, so it is not a release candidate and cannot be promoted; it is left unsigned."
            exit 0
          fi

          # THE DISTINCTION IS THE WHOLE CONTROL. "The certificate is absent" and "we have decided to
          # ship unsigned" look identical at the moment of failure and are completely different
          # statements. Treating absence as consent is a silent fail-open: the build would go green
          # the first time a secret expired, rotated or was renamed, and nobody would learn that the
          # packages had stopped being signed. So absence refuses, and only an explicit opt-out
          # proceeds.
          if [ "${ALLOW_UNSIGNED_RELEASE:-}" != "true" ]; then
            echo "::error::REFUSE: this build stamps release version ${RELEASE_CANDIDATE_VERSION}, so it is promotable, but signing is not configured and no explicit opt-out is set."
            echo "::error::Either configure NUGET_SIGNING_CERT_BASE64 and NUGET_SIGNING_CERT_PASSWORD for this workflow, or set the repository variable ALLOW_UNSIGNED_RELEASE=true to produce a promotable set unsigned deliberately. A missing secret is NOT taken as consent to ship unsigned."
            exit 1
          fi

          # WHAT UNSIGNED COSTS, so the opt-out stays a judgement rather than a shrug: nuget.org
          # accepts unsigned packages and applies its own repository signature to everything it
          # serves, so consumers keep an authenticity guarantee from the registry. Author signing
          # adds a second, publisher-level guarantee on top, and it is not free -- the certificate
          # must come from a public CA, since nuget.org rejects self-issued ones. Publishing unsigned
          # is a real reduction in guarantee, not a formality.
          echo "::warning::Producing a promotable UNSIGNED package set. These packages will carry NO author signature. This is the committed default while no signing certificate is available -- it is a deliberate decision recorded in the workflow, not a missing secret, but it is still a reduction in guarantee and this warning is meant to stay visible on every release."

      # Skipped when no certificate is configured. Reachable only after the decision above has either
      # confirmed the certificate or recorded a deliberate opt-out, so a skip here can never be the
      # first place that decision is made.
      #
      # Only .nupkg is signed -- the same subject set that is attested and pushed. A .snupkg is never
      # published, so signing one would change bytes no consumer receives.
      - name: Verify signing environment protections
        if: steps.signing.outputs.sign == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/package-signing" > "$RUNNER_TEMP/signing-environment.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/environments/package-signing/deployment-branch-policies" > "$RUNNER_TEMP/signing-ref-policies.json"
          python3 - <<'PY'
          import json, os, pathlib
          model = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'signing-environment.json').read_text())
          reviewers = [rule for rule in model.get('protection_rules', []) if rule.get('type') == 'required_reviewers']
          policy = model.get('deployment_branch_policy') or {}
          pages = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'signing-ref-policies.json').read_text())
          allowed = [(rule.get('type'), rule.get('name')) for page in pages for rule in page['branch_policies']]
          if (model.get('can_admins_bypass') is not False or
              not any(rule.get('reviewers') and rule.get('prevent_self_review') is True for rule in reviewers) or
              policy.get('custom_branch_policies') is not True or policy.get('protected_branches') is not False or
              sorted(allowed) != [('branch', 'main'), ('tag', 'v*')]):
              raise SystemExit('REFUSE: author signing requires non-bypassable review, no self-review, and restricted deployment refs')
          PY

      - name: Sign the shipping packages
        if: steps.signing.outputs.sign == 'true'
        env:
          NUGET_SIGNING_CERT_BASE64: ${{ secrets.NUGET_SIGNING_CERT_BASE64 }}
          NUGET_SIGNING_CERT_PASSWORD: ${{ secrets.NUGET_SIGNING_CERT_PASSWORD }}
        shell: bash
        working-directory: packages
        run: |
          set -euo pipefail
          cert_path="${RUNNER_TEMP}/nuget-signing.pfx"
          # Removed however this step ends -- success, signing failure, or the runner stopping it --
          # so the decoded certificate never outlives the work it exists for and cannot be picked up
          # by a later step or swept into an artifact.
          cleanup() { rm -f "$cert_path"; }
          trap cleanup EXIT

          # Written by redirection and never echoed. The certificate and its password are the two
          # values in this job that must not reach the log.
          printf '%s' "$NUGET_SIGNING_CERT_BASE64" | base64 --decode > "$cert_path"

          shopt -s nullglob
          packages=( *.nupkg )
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::REFUSE: no .nupkg to sign. Zero subjects is not zero findings -- an empty set would be hashed, attested and uploaded as though it were a release."
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "signing: ${package}"
            dotnet nuget sign "$package" \
              --certificate-path "$cert_path" \
              --certificate-password "$NUGET_SIGNING_CERT_PASSWORD" \
              --timestamper http://timestamp.digicert.com \
              --overwrite || {
                echo "::error::failed to sign ${package}"
                exit 1
              }
          done

          # Verified HERE, because here is where the bytes are still changing. After this step
          # nothing rewrites them, so a signature confirmed now is the signature that ships.
          for package in "${packages[@]}"; do
            echo "verifying: ${package}"
            dotnet nuget verify "$package" || {
              echo "::error::signature verification failed for ${package}"
              exit 1
            }
          done

          echo "signed and verified ${#packages[@]} package(s)"

      # A hash manifest, computed over the packages that are ABOUT TO BE UPLOADED -- not recomputed
      # later from a download, which would attest to whatever arrived rather than to what was built.
      # This is what makes divergence detectable at all: without it, "the same packages" is an
      # assertion nobody can check after the fact.
      - name: Verify signing preserved package payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          expected = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'unsigned-payloads.json').read_text())
          actual = {}
          for path in pathlib.Path('packages').glob('*.nupkg'):
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  if len(names) != len(set(names)): raise SystemExit('REFUSE: duplicate signed ZIP entry')
                  actual[path.name] = {name: hashlib.sha256(archive.read(name)).hexdigest() for name in names if name != '.signature.p7s'}
          if actual != expected: raise SystemExit('REFUSE: signing changed package payloads')
          PY

      - name: Record package hashes
        shell: bash
        working-directory: packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.nupkg *.snupkg )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::REFUSE: no packages to hash. Nothing was built, so nothing can be attested."
            exit 1
          fi
          sha256sum "${files[@]}" | tee SHA256SUMS.txt
          echo "hashed ${#files[@]} file(s)"

      # The build receipt is the machine-readable answer to "which run produced these exact bytes,
      # from which commit, at which version". It travels WITH the packages, because a receipt held
      # anywhere else is a claim about an artifact rather than a property of it.
      #
      # The version it records is READ BACK OUT of the packages -- never the one this workflow
      # intended to stamp. On a branch build there is no intended version at all and MinVer's is the
      # only answer; on a tag build, reading it back is the only thing that would catch a stamping
      # step that silently did not take effect. Either way the receipt states a measured value.
      #
      # Deliberately NOT covered by SHA256SUMS.txt: the receipt quotes those hashes, so it cannot
      # also be one of them. The manifest describes the shipping artifacts; the receipt describes
      # where they came from.
      #
      # The nuspec is parsed as XML, not matched with a regex, and read through the same
      # System.IO.Compression path this workflow already uses to open a .nupkg. A regex over the raw
      # nuspec has to distinguish the metadata <version> ELEMENT from the version ATTRIBUTE on every
      # <dependency>, which it can only do by position -- correct until a package's metadata is
      # ordered differently.
      - name: Emit the build receipt
        id: receipt
        shell: pwsh
        working-directory: packages
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $packages = @(Get-ChildItem -Filter '*.nupkg')
          if ($packages.Count -eq 0) {
            Write-Host "::error::REFUSE: no packages to describe. An empty receipt would read as a complete one."
            exit 1
          }

          $entries = foreach ($pkg in $packages) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
            try {
              # The manifest sits at the archive root; anything nested is not the package's own.
              $nuspec = $zip.Entries |
                Where-Object { $_.FullName -like '*.nuspec' -and $_.FullName -notmatch '/' } |
                Select-Object -First 1
              if ($null -eq $nuspec) {
                Write-Host "::error::REFUSE: $($pkg.Name) contains no root .nuspec. A package whose identity cannot be read cannot be promoted."
                exit 1
              }
              $reader = New-Object System.IO.StreamReader($nuspec.Open())
              try { $xml = [xml]$reader.ReadToEnd() } finally { $reader.Dispose() }
            } finally { $zip.Dispose() }

            $id = $xml.package.metadata.id
            $ver = $xml.package.metadata.version
            if ([string]::IsNullOrWhiteSpace($id) -or [string]::IsNullOrWhiteSpace($ver)) {
              Write-Host "::error::REFUSE: could not read id/version from $($pkg.Name); the receipt would name a package it cannot identify."
              exit 1
            }

            [pscustomobject]@{
              id      = $id
              version = $ver
              sha256  = (Get-FileHash -Path $pkg.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }

          $distinct = @($entries.version | Sort-Object -Unique)
          if ($distinct.Count -ne 1) {
            Write-Host "::error::REFUSE: the package set carries $($distinct.Count) distinct versions, so there is no single version this build produced."
            $distinct | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          $version = $distinct[0]

          [pscustomobject]@{
            official_build_run_id      = $env:GITHUB_RUN_ID
            official_build_run_attempt = $env:GITHUB_RUN_ATTEMPT
            official_build_workflow_ref = $env:GITHUB_WORKFLOW_REF
            commit_sha                 = $env:GITHUB_SHA
            ref                        = $env:GITHUB_REF
            version                    = $version
            unsigned_handoff_artifact_id = $env:HANDOFF_ARTIFACT_ID
            unsigned_handoff_manifest_sha256 = $env:HANDOFF_MANIFEST_SHA256
            packages                   = @($entries)
          } | ConvertTo-Json -Depth 5 | Set-Content -Path 'build-receipt.json'

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Write-Host "packed version: $version ($($entries.Count) package(s))"
          Get-Content 'build-receipt.json'

      - name: Attest build provenance for the canonical package set
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: packages/*.nupkg

      # Binds the SBOM to the packages cryptographically, so "this SBOM describes these packages" is
      # verifiable rather than inferred from two artifacts sitting side by side. Without it a
      # consumer can check that a package came from us and can read a dependency list, but cannot
      # establish that the list is that package's.
      - name: Attest the SBOM against the packages it describes
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: packages/*.nupkg
          sbom-path: sbom/bom.json

      - name: Upload the official SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Same artifact name the release workflow already reads, so moving generation here changes
          # where the SBOM comes from without changing what consumes it.
          name: release-cyclonedx-sbom
          path: sbom/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload the canonical package set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Deliberately unsuffixed. An OS or platform suffix is what makes two candidate package
          # sets nameable and therefore pickable; one unsuffixed name means there is exactly one
          # artifact any consumer can ask for, and no convention by which to choose between rivals.
          name: packages
          # SHA256SUMS.txt and build-receipt.json ship WITH the packages or they may as well not
          # exist: computed on the runner and left there, they would answer the divergence question
          # only during the one run that cannot ask it. (This comment sits OUTSIDE the block scalar
          # below deliberately -- inside `path: |`, a `#` is literal text, not a comment, and would
          # become a path pattern.)
          path: |
            packages/*.nupkg
            packages/*.snupkg
            packages/SHA256SUMS.txt
            packages/build-receipt.json
          if-no-files-found: error
          retention-days: 90

  # ONE official-build result per commit.
  #
  # A branch protection rule, a release admission check, or a human asking "did the official build
  # pass for this SHA?" needs a single stable name to ask about. Job names multiply as the workflow
  # grows; this one does not. It also converts the three non-success conclusions into failure
  # explicitly, because `needs` alone does not: a skipped or cancelled dependency leaves this job
  # unrun rather than red, and an unrun check is indistinguishable from one nobody required.
  official-build:
    name: Official Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: [packages]
    if: always()
    steps:
      - name: Report the official build result
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.packages.outputs.version }}
        run: |
          set -euo pipefail
          result="${{ needs.packages.result }}"
          echo "packages: ${result}"
          {
            echo "### Official Build"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| ref | \`${GITHUB_REF}\` |"
            echo "| run id | \`${GITHUB_RUN_ID}\` |"
            echo "| version | \`${RELEASE_VERSION}\` |"
            echo "| packages | ${result} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$result" != "success" ]; then
            echo "::error::REFUSE: the official build did not succeed (packages: ${result}). This commit has no canonical package set, and a release must not be able to find one."
            exit 1
          fi
          echo "official build succeeded; the canonical package set for ${GITHUB_SHA} is artifact 'packages' of run ${GITHUB_RUN_ID}."
