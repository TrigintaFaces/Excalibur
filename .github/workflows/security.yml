name: Security Scanning

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: 'Git ref to checkout'
        required: true
        type: string
      checkout-token:
        description: 'Token for checkout (defaults to github.token)'
        required: false
        type: string
        default: ''
      event-name:
        description: 'The triggering event name (push, pull_request, etc.)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  security-sast:
    name: Security SAST (PR report-only, push blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ inputs.event-name == 'pull_request' }}
    steps:
      - name: Checkout code (needed to resolve local composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Setup .NET build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          checkout-ref: ${{ inputs.checkout-ref }}
          checkout-token: ${{ inputs.checkout-token }}
          solution-filter: 'eng/ci/shards/ShippingOnly.slnf'
          restore-only: 'true'
          free-disk-space: 'true'

      - name: Build with warnings as errors (SAST-lite)
        shell: bash
        run: |
          set -euo pipefail
          build_exit=0
          dotnet build eng/ci/shards/ShippingOnly.slnf --configuration Release --no-restore --verbosity quiet -warnaserror -clp:ErrorsOnly\;Summary > sast-build.log 2>&1 || build_exit=$?
          if [ "$build_exit" -ne 0 ]; then
            echo "Build failed. Last 200 lines from sast-build.log:"
            tail -n 200 sast-build.log || true
            exit "$build_exit"
          fi

      - name: Upload SAST log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sast-build
          path: sast-build.log

  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.3"
          # Extract into RUNNER_TEMP, never the workspace. The tarball carries gitleaks, LICENSE and
          # README.md; piping it to `tar -xz` here unpacked all three into the checkout, and only the
          # binary was moved out. gitleaks' own README stayed at the workspace root -- the same relative
          # path as the repository's -- and it DOCUMENTS the detection rules, example tokens included.
          # The next step then scanned it with --no-git and reported a Sidekiq secret at README.md:50,
          # cols 23-75. That is gitleaks finding an example secret in its own documentation: not in this
          # repository, not in its history, and not reproducible anywhere except a workspace polluted by
          # this install step. Reproduced exactly by scanning the bundled README with the same version.
          mkdir -p "${RUNNER_TEMP}/bin" "${RUNNER_TEMP}/gitleaks-dist"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "${RUNNER_TEMP}/gitleaks-dist"
          mv "${RUNNER_TEMP}/gitleaks-dist/gitleaks" "${RUNNER_TEMP}/bin/gitleaks"
          chmod +x "${RUNNER_TEMP}/bin/gitleaks"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/gitleaks" version

      - name: Run Gitleaks
        run: |
          set -euo pipefail
          # --config is REQUIRED, and its absence here was a real inconsistency: the sibling job in
          # secret-scan.yml scans the same tree with --config .gitleaks.toml while this one ran raw
          # defaults, so the repository's allowlist -- its build-output and dependency path
          # exclusions, and the documented false-positive value patterns -- applied to one
          # scanner and not the other. Two scanners over one tree must read one configuration, or a
          # finding suppressed in one job resurfaces in the other and nobody can tell which is right.
          #
          # This is NOT claimed as the cause of any particular past failure; that was not established.
          gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            -v \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-report
          path: gitleaks.sarif

  sbom-generation:
    name: SBOM Generation (CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code (needed to resolve local composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Setup .NET build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          checkout-ref: ${{ inputs.checkout-ref }}
          checkout-token: ${{ inputs.checkout-token }}
          solution-filter: ''

      - name: Restore dependencies
        run: bash ./build.sh --restore
      - name: Generate CycloneDX SBOM for all packages
        run: |
          # Pinned in .config/dotnet-tools.json rather than installed at whatever version is
          # newest today. `|| dotnet tool update` previously meant this step could silently change
          # the SBOM generator between runs, which is a poor property for the tool that produces our
          # supply-chain evidence.
          dotnet tool restore
          dotnet CycloneDX ./src -o ./src -F Json -t

      - name: Validate SBOM completeness
        run: |
          echo "Validating SBOM completeness..."
          sbom_count=$(find . -name "bom.json" -o -name "bom.xml" | wc -l)
          echo "Found $sbom_count SBOM file(s)"
          if [ "$sbom_count" -eq 0 ]; then
            echo "No SBOM files generated"
            exit 1
          fi
          find . -name "bom.json" -o -name "bom.xml"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cyclonedx-sbom
          path: |
            **/bom.json
            **/bom.xml
          retention-days: 90

      - name: SBOM summary
        run: |
          echo "## Software Bill of Materials (SBOM)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Format:** CycloneDX" >> $GITHUB_STEP_SUMMARY
          echo "**Standard:** NIST 800-53 CM-8" >> $GITHUB_STEP_SUMMARY
          echo "**Scope:** All NuGet packages in src/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated SBOMs" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -name "bom.json" -o -name "bom.xml" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SBOM artifacts uploaded with 90-day retention" >> $GITHUB_STEP_SUMMARY
          echo "Satisfies FedRAMP CM-8 control requirement" >> $GITHUB_STEP_SUMMARY

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: ${{ inputs.event-name == 'pull_request' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Check dependency review support
        id: dependency_review_support
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom"
          status_code="$(curl -sS -o /tmp/dependency-graph.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${{ github.token }}" \
            "${api_url}" || true)"
          if [[ "${status_code}" == "200" ]]; then
            echo "supported=true" >> "${GITHUB_OUTPUT}"
          else
            echo "supported=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Dependency review unsupported or unavailable (HTTP ${status_code}); skipping blocking enforcement."
          fi

      - name: Check dependency review quota
        id: dependency_review_quota
        if: steps.dependency_review_support.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail
          min_remaining=150
          if ! command -v jq >/dev/null 2>&1; then
            echo "quota_ok=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::jq unavailable; skipping blocking dependency review enforcement."
            exit 0
          fi
          rate_json="$(curl -sS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/rate_limit" || true)"
          remaining="$(echo "${rate_json}" | jq -r '.resources.core.remaining // 0')"
          reset_epoch="$(echo "${rate_json}" | jq -r '.resources.core.reset // 0')"
          now_epoch="$(date +%s)"
          reset_in=$(( reset_epoch - now_epoch ))
          echo "remaining=${remaining}" >> "${GITHUB_OUTPUT}"
          if [[ "${remaining}" -lt "${min_remaining}" ]]; then
            echo "quota_ok=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Low API quota (${remaining} remaining, reset in ${reset_in}s); skipping blocking dependency review enforcement."
          else
            echo "quota_ok=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check dependency review API health
        id: dependency_review_api_health
        if: steps.dependency_review_support.outputs.supported == 'true' && steps.dependency_review_quota.outputs.quota_ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          license_url="https://api.github.com/repos/${{ github.repository }}/license"
          status_code="$(curl -sS --max-time 10 -o /tmp/dependency-license.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${{ github.token }}" \
            "${license_url}" || true)"
          if [[ "${status_code}" == "200" || "${status_code}" == "404" ]]; then
            echo "api_ok=true" >> "${GITHUB_OUTPUT}"
          else
            echo "api_ok=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Dependency review API health check failed (license endpoint HTTP ${status_code}); skipping this non-blocking gate."
          fi

      - name: Dependency review (attempt 1)
        id: dependency_review_attempt_1
        if: steps.dependency_review_support.outputs.supported == 'true' && steps.dependency_review_quota.outputs.quota_ok == 'true' && steps.dependency_review_api_health.outputs.api_ok == 'true'
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          repo-token: ${{ github.token }}
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          show-openssf-scorecard: false

      - name: Backoff before dependency review retry 2
        if: steps.dependency_review_support.outputs.supported == 'true' && steps.dependency_review_quota.outputs.quota_ok == 'true' && steps.dependency_review_api_health.outputs.api_ok == 'true' && steps.dependency_review_attempt_1.outcome == 'failure'
        shell: bash
        run: sleep 10

      - name: Dependency review (attempt 2)
        id: dependency_review_attempt_2
        if: steps.dependency_review_support.outputs.supported == 'true' && steps.dependency_review_quota.outputs.quota_ok == 'true' && steps.dependency_review_api_health.outputs.api_ok == 'true' && steps.dependency_review_attempt_1.outcome == 'failure'
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          repo-token: ${{ github.token }}
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          show-openssf-scorecard: false

      - name: Enforce dependency review result
        if: steps.dependency_review_support.outputs.supported == 'true' && steps.dependency_review_quota.outputs.quota_ok == 'true' && steps.dependency_review_api_health.outputs.api_ok == 'true' && steps.dependency_review_attempt_1.outcome == 'failure' && steps.dependency_review_attempt_2.outcome == 'failure'
        run: |
          echo "::warning::Dependency review failed after 2 attempts (likely transient GitHub API/rate-limit issue)."
          echo "::warning::Blocking vulnerability enforcement remains covered by the Dependency Vulnerability Audit gate."

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code (needed to resolve local composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Setup .NET build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          checkout-ref: ${{ inputs.checkout-ref }}
          checkout-token: ${{ inputs.checkout-token }}
          solution-filter: ''

      - name: Run dependency audit
        shell: pwsh
        run: |
          # -MaxProjects is a RUNAWAY guard and must sit ABOVE the src/ population, not level
          # with it: a cap EQUAL to the population breaches the moment one project is added.
          # src/ held 201 when this went red at 200. nightly.yml already used 400; this is the
          # sibling that was not updated with it.
          ./eng/ci/dependency-audit.ps1 `
            -OutDir artifacts/reports/DependencyAuditReport `
            -ProjectRoot src `
            -PerProjectTimeoutSeconds 120 `
            -TotalBudgetMinutes 30 `
            -MaxProjects 400 `
            -FailOnGuardrailBreach

      - name: Enforce vulnerability policy (allowlist optional)
        shell: pwsh
        run: |
          $json = @(Get-Content 'artifacts/reports/DependencyAuditReport/vulnerabilities.json' | ConvertFrom-Json)
          $vulnRecords = @(
            $json | Where-Object {
              if ($_.PSObject.Properties.Name -contains 'HasVulnerabilities') {
                return [bool]$_.HasVulnerabilities
              }
              $output = [string]$_.Output
              return $output -match '(?i)has the following vulnerable packages' -or
                     $output -match '(?i)\bGHSA-[0-9A-Za-z-]+\b' -or
                     $output -match '(?i)\bCVE-\d{4}-\d+\b' -or
                     $output -match '(?i)https://github\.com/advisories/'
            }
          )
          if ($vulnRecords.Count -gt 0) {
            Write-Host "Detected vulnerable packages in $($vulnRecords.Count) project(s)."

            # Each detected advisory blocks unless ITS OWN id is allowlisted. The allowlist is matched by
            # CONTENTS, never by existence: an empty or unrelated allowlist must not waive anything, and an
            # unreadable one must not waive anything either. Every branch below either allowlists a specific
            # id or fails the step.
            $detectedIds = @(
              $vulnRecords
              | ForEach-Object { [regex]::Matches([string]$_.Output, '(?i)\b(GHSA-[0-9A-Za-z-]+|CVE-\d{4}-\d+)\b') }
              | ForEach-Object { $_.Value.ToUpperInvariant() }
              | Sort-Object -Unique
            )

            $allowlistPath = 'eng/governance/cve-allowlist.yaml'
            $allowedIds = @()
            if (Test-Path $allowlistPath) {
              try {
                $allowlistText = Get-Content $allowlistPath -Raw -ErrorAction Stop
              } catch {
                Write-Error "Allowlist '$allowlistPath' exists but could not be read: $($_.Exception.Message). Failing closed."
                exit 1
              }
              $allowedIds = @(
                [regex]::Matches($allowlistText, '(?i)\b(GHSA-[0-9A-Za-z-]+|CVE-\d{4}-\d+)\b')
                | ForEach-Object { $_.Value.ToUpperInvariant() }
                | Sort-Object -Unique
              )
              Write-Host "Allowlist lists $($allowedIds.Count) advisory id(s)."
            } else {
              Write-Host "No allowlist present; every detected advisory blocks."
            }

            if ($detectedIds.Count -eq 0) {
              Write-Error "Vulnerable packages detected but no advisory id could be parsed from the audit output. Failing closed — an unidentifiable advisory cannot be allowlisted."
              exit 1
            }

            $unallowed = @($detectedIds | Where-Object { $allowedIds -notcontains $_ })
            if ($unallowed.Count -gt 0) {
              Write-Error "Vulnerabilities not covered by the allowlist: $($unallowed -join ', '). Failing per policy. Add each id to $allowlistPath to waive it deliberately."
              exit 1
            }

            Write-Host "All $($detectedIds.Count) detected advisory id(s) are individually allowlisted. Non-blocking."
          } else {
            Write-Host "No vulnerabilities detected."
          }

      - name: Upload dependency audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-audit
          path: artifacts/reports/DependencyAuditReport

  notices-lint:
    name: Notices & License Headers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code (needed to resolve local composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Setup .NET build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          checkout-ref: ${{ inputs.checkout-ref }}
          checkout-token: ${{ inputs.checkout-token }}
          solution-filter: ''

      - name: Verify license headers
        shell: pwsh
        run: |
          ./eng/ci/license-headers-verify.ps1 -Root src

      - name: Generate THIRD-PARTY-NOTICES (temp)
        shell: pwsh
        run: |
          ./eng/ci/notices-generate.ps1 -Output THIRD-PARTY-NOTICES.gen.md

      - name: Diff notices
        shell: bash
        run: |
          if ! diff -u THIRD-PARTY-NOTICES.md THIRD-PARTY-NOTICES.gen.md; then
            echo "::error::THIRD-PARTY-NOTICES.md is out of date. Run eng/ci/notices-generate.ps1"
            exit 1
          fi

  oss-metadata:
    name: OSS Metadata Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code (needed to resolve local composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 1

      - name: Setup .NET build environment
        uses: ./.github/actions/setup-dotnet-build
        with:
          checkout-ref: ${{ inputs.checkout-ref }}
          checkout-token: ${{ inputs.checkout-token }}
          solution-filter: ''

      - name: Run OSS metadata audit
        shell: pwsh
        run: |
          ./eng/ci/oss-metadata-audit.ps1 -OutDir artifacts/reports/OssMetadataReport -Catalog eng/governance/package-ids.yaml

      - name: Upload OSS metadata report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: oss-metadata-report
          path: artifacts/reports/OssMetadataReport/oss-metadata.json
