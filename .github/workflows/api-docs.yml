# API Reference Documentation Generation
# Purpose: Generate and publish DocFX API reference documentation
# Owner: PlatformDeveloper

name: API Reference Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/api/**'
      - 'Directory.Build.props'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Event-aware: a PUSH keys the group by run id, so it shares a group with nothing and cannot be
  # superseded -- neither while running nor while queued. Every commit on a protected branch must
  # reach a verdict, and a ref-keyed group with an unconditional cancel silently denied that to
  # any commit followed quickly by another. Superseding a stale PULL REQUEST run is still wanted,
  # so PRs group by number and keep cancel-in-progress.
  group: api-docs-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  generate-api-docs:
    name: Generate API Reference
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-api-docs-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-api-docs-
            ${{ runner.os }}-nuget-

      - name: Install DocFX
        # `dotnet tool restore` installs the versions pinned in .config/dotnet-tools.json rather
        # than whatever is newest today. A floating tool is an unpinned input to the build: it can
        # change output, or break, on a day nothing in this repository changed. The manifest is
        # tracked, so the version is reviewable and Dependabot can propose updates to it.
        run: dotnet tool restore

      - name: Generate API metadata and build site
        working-directory: docs/api
        run: |
          echo "Generating API metadata..."
          dotnet docfx metadata docfx.json
          echo "Building API reference site..."
          dotnet docfx build docfx.json

      - name: Upload API docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: api-reference-docs
          path: docs/api/_site/
          retention-days: 30

      - name: API docs summary
        if: always()
        run: |
          echo "# API Reference Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "docs/api/_site" ]; then
            page_count=$(find docs/api/_site -name "*.html" | wc -l)
            echo "Generated **${page_count}** API reference pages." >> $GITHUB_STEP_SUMMARY
          else
            echo "API docs generation failed." >> $GITHUB_STEP_SUMMARY
          fi
