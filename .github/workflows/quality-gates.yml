name: Quality Gates

on:
  # This repo integrates by pushing to main, not by pull request: exactly two PRs
  # have ever been opened. A pull_request-only trigger therefore meant every gate
  # declared below had effectively never executed -- declared-in-CI is not run-in-CI.
  # Every step already handles the non-PR case (`github.sha` and `HEAD^` fallbacks),
  # so the workflow was push-ready by construction; only the trigger was missing.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Least privilege, declared explicitly. GITHUB_TOKEN otherwise inherits the repository
# default, which may be write-all; a workflow that only reads code and reports should never
# hold a token that can push. Declaring permissions REPLACES the default set rather than
# adding to it, so every scope this workflow needs is listed here.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # Every commit on a protected branch must reach a verdict. Two separate mechanisms could take that
  # away, and both are closed here.
  #
  # 1. RUNNING runs. This was `${{ github.workflow }}-${{ github.ref }}` with an unconditional
  #    cancel-in-progress, which killed a push run on main the moment a later commit arrived.
  #    Observed twice in one session: release-blocking governance refused with `quality=cancelled`,
  #    the gate having proven nothing and correctly declining to call that success.
  #
  # 2. QUEUED runs -- the half that fix missed. `cancel-in-progress: false` protects a run that has
  #    STARTED; it does nothing for one still pending. GitHub documents that when a run enters a
  #    busy group, "any previously pending job or workflow in the concurrency group will be
  #    canceled". Measured, not theorised: two pushes in quick succession left the middle commit's
  #    run cancelled 18 minutes after creation with ZERO jobs -- that commit got no CI verdict at
  #    all, while its other workflows went green and made it look validated.
  #
  # So a PUSH keys the group by RUN ID: unique by construction, sharing a group with nothing, and
  # therefore unsupersedable. Coalescing superseded PULL REQUEST runs is still wanted and still
  # happens -- PRs group by number, and cancel-in-progress stays true for them.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  # RATCHET FLOOR, not the goal. This is the level coverage must not fall BELOW; raise it whenever a
  # green run measures higher. COVERAGE_TARGET below records where we actually want to be.
  #
  # It was 65 — a number the repo has never met. Measured 2026-07-31: combined 44.3%
  # (src/Dispatch 49.13%, src/Excalibur 41.6%). The history explains how that persisted:
  #
  #   2026-02-25  ef5fb3a6b  "make quality-gates coverage threshold report-only"  removed -FailBelowThreshold
  #   2026-04-05  769d3e2d8  "Microsoft-quality sweep … [Sprint 749]"             silently restored it
  #
  # So a deliberate report-only decision was reverted by an unrelated multi-concern sweep, and the gate
  # has blocked on an unmeetable number ever since. A threshold nobody can reach does not raise
  # coverage; it trains everyone to bypass the gate, which is worse than not having one.
  #
  # A floor at the measured level enforces something TRUE and always achievable — do not regress — and
  # it catches the failure that actually matters: a shard silently stopping contributing coverage.
  #
  # CAVEAT, deliberately recorded rather than smoothed over: 44.3% was measured on a run whose
  # integration shard had been refusing, so its contribution is uncertain and this floor may be
  # pessimistic. Re-baseline from the first fully green run rather than treating 44 as settled.
  COVERAGE_THRESHOLD: 44
  # Where we intend to be. Not enforced — recorded so lowering the floor to the truth does not quietly
  # delete the ambition, which is how the report-only decision got lost in the first place.
  COVERAGE_TARGET: 65

jobs:
  core-perf-change-detection:
    name: Detect Core/Perf Changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      core_perf: ${{ steps.filter.outputs.core_perf }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          fi
          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${HEAD_SHA}"
          fi

          CHANGED=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" 2>/dev/null || echo "")

          if echo "$CHANGED" | grep -qE '^(src/Dispatch/|src/Excalibur/|tests/|benchmarks/|eng/)'; then
            echo "core_perf=true" >> "$GITHUB_OUTPUT"
          else
            echo "core_perf=false" >> "$GITHUB_OUTPUT"
          fi

  # Code analysis gate -- build with -warnaserror to enforce analyzer rules
  code-analysis:
    name: Code Analysis (Warning-as-Error Build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/swift /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /home/linuxbrew /usr/local/.ghcup /usr/local/share/boost || true
          sudo apt-get clean || true
          docker system prune -af || true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore and build with warning-as-error
        run: |
          dotnet restore --verbosity quiet
          dotnet build --configuration Release --no-restore --verbosity quiet -warnaserror /p:TreatWarningsAsErrors=true

      # ADVISORY — surfaces candidate hand-rolled reinventions of BCL/first-party primitives on the diff so
      # the "What Would Microsoft Do?" / BCL-first presumption is visible in CI. Heuristic (expected false
      # positives) → prints candidates for two-prong triage (microsoft-first.md §C); NEVER fails the build.
      - name: WWMD BCL-reinvention smell scan (advisory)
        shell: bash
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}"
          bash eng/ci/wwmd-reinvention-smells.sh --base "$base" || true

      # BLOCKING. A single /// doc block carrying two <summary>/<remarks>/<value> ships HALF a member's
      # documented contract: the XML doc generator keeps one element and drops the rest, with ZERO
      # compiler warnings, so the loss reaches the published .xml and IntelliSense unannounced.
      #
      # This runs the gate against the real source tree. The harness battery separately proves the gate
      # is non-vacuous on fixtures — that proves the INSTRUMENT works, not that the TREE is clean, and
      # only this step asserts the latter. The local pre-commit hook checks the staged subset, but
      # core.hooksPath is machine-local config that no tracked file can set, so a fresh clone installs
      # no hooks and this step is the only thing standing between a duplicate tag and the package.
      #
      # Exit contract: 0 clean · 1 duplicate tag(s) → FAIL · 2 no C# found → FAIL (an unevaluated tree
      # is not a clean one; a silent skip here would be indistinguishable from a pass).
      - name: Duplicate XML doc tags (shipped source)
        shell: bash
        run: bash eng/ci/duplicate-xml-doc-tags.sh src

  # Code coverage quality gate (sharded, self-contained)
  coverage-shards:
    name: "Code Coverage (Shard: ${{ matrix.shard.name }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: core, filter: "eng/ci/shards/UnitTests-Core.slnf", test_filter: "(Category=Unit|Category=DependencyInjection)&Category!=Performance" }
          - { name: transport, filter: "eng/ci/shards/UnitTests-Transport.slnf", test_filter: "(Category=Unit|Category=DependencyInjection)&Category!=Performance" }
          - { name: middleware, filter: "eng/ci/shards/UnitTests-Middleware.slnf", test_filter: "(Category=Unit|Category=DependencyInjection)&Category!=Performance" }
          # Split from a single `excalibur` leg that carried 43 test projects -- roughly 3x core (15)
          # and 14x transport (3). Under coverage instrumentation it exhausted its runner: the job
          # died with "The hosted runner lost communication with the server", which skipped the
          # dependent aggregation job, which the summary correctly reports as a BLOCKING gate
          # failure. Quality Gates was therefore red on every run for a reason that had nothing to
          # do with the coverage threshold -- the threshold was never evaluated.
          #
          # Legs are sized at 13-16 projects because core sustains 15 today. That is a demonstrated
          # survivable size rather than a guess. Raising the timeout would not have helped: the job
          # was not running out of time, it was being killed.
          - { name: excalibur-data, filter: "eng/ci/shards/UnitTests-Excalibur-Data.slnf", test_filter: "(Category=Unit|Category=DependencyInjection)&Category!=Performance" }
          - { name: excalibur-platform, filter: "eng/ci/shards/UnitTests-Excalibur-Platform.slnf", test_filter: "(Category=Unit|Category=DependencyInjection)&Category!=Performance" }
          - { name: excalibur-messaging, filter: "eng/ci/shards/UnitTests-Excalibur-Messaging.slnf", test_filter: "(Category=Unit|Category=DependencyInjection)&Category!=Performance" }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore and build shard
        run: |
          bash ./build.sh --restore --project ${{ matrix.shard.filter }} --verbosity quiet
          # See .github/actions/setup-dotnet-build: without this the shard's test projects are
          # compile-skipped on Windows and produce empty assemblies.
          bash ./build.sh --build --no-restore --project ${{ matrix.shard.filter }} --verbosity quiet

      # A missing settings file surfaces as "The Settings file ... could not be found" buried in a
      # test run's output, after the run has already started and produced nothing. Assert it up front
      # so the failure names itself. This exact file was missed by a manual sync and took all six
      # shards down with a message that read like a collector fault.
      # Present AND well-formed. Presence alone was not enough: a `--` inside an XML comment (illegal
      # in XML, and easy to type as a dash in prose) made the collector reject the file with
      # "Settings file provided does not conform to required format", repeated once per test project
      # and attributed to nothing in particular. All six shards went down together, again, with a
      # message that again read like a collector fault. A settings file is code; parse it before use.
      - name: Assert the coverage settings file is present and well-formed
        shell: bash
        run: |
          set -euo pipefail
          test -f tests/coverage.msft.runsettings || {
            echo "::error::tests/coverage.msft.runsettings is missing. The coverage collector cannot run without it; this is a missing FILE, not a collector fault."
            exit 1
          }
          python3 - <<'PY' || exit 1
          import sys, xml.dom.minidom
          p = "tests/coverage.msft.runsettings"
          try:
              xml.dom.minidom.parse(p)
          except Exception as e:
              print(f"::error::{p} is not well-formed XML: {e}. The collector will reject it and blame itself. "
                    f"Note '--' is illegal inside an XML comment.")
              sys.exit(1)
          print(f"{p}: present and well-formed")
          PY

      - name: Run shard tests with coverage
        run: |
          # --logger trx and --blame-crash are diagnostic, not decorative. This shard previously
          # logged to console only and uploaded nothing but coverage, so a failure left no
          # machine-readable record of WHICH test died: a run that ended after 54 minutes, well
          # inside its 120-minute budget, could not be attributed to a test, a hang or a host
          # crash. Every other test job in this repo writes a TRX; this one did not, and the
          # skip-accounting gate that reads TRX had nothing to read.
          #
          # --blame-hang-timeout was already here and catches a HANG. It does not catch the test
          # host EXITING -- an OOM, a stack overflow, a native crash in a provider SDK -- which
          # produces exactly the signature seen: suites reporting clean, then silence.
          #
          # TestSessionTimeout=3600000 (60 min) against a 120-minute job budget, deliberately half.
          # This shard was the only test job in the repository with no session cap, and it hung:
          # Excalibur.Tests started and was still running three hours later while the four measured
          # assemblies ahead of it took 7s, 24s, 1m02s and 2s. With no cap the runner eventually
          # kills the job at the wall and writes NOTHING -- the same race ci.yml documents for the
          # deterministic shard, where an equal session and job timeout meant the session timeout
          # could never win and no TRX survived. The cap must be strictly lower so it fires FIRST,
          # aborts the session, and leaves results behind; 60 against 120 is not a tuning guess but
          # the property that makes the timeout observable.
          #
          # --blame-hang-timeout does NOT cover this and is not a substitute. It aborts a TEST that
          # does not complete within its window; it is blind to a run whose tests all finish and
          # whose host then never exits -- a lingering foreground thread, an undisposed timer, a
          # client still holding a connection. That is a hang AFTER the tests, and the observed
          # signature (assemblies reporting clean, then silence, with blame attached and quiet) is
          # exactly what that looks like.
          #
          # LogFilePrefix, NOT LogFileName. A shard runs several test assemblies in sequence and
          # each writes the logger's file, so a fixed name means every assembly overwrites the
          # previous one -- observed live as repeated "WARNING: Overwriting results file". The
          # surviving TRX would then hold only the last assembly to finish, and if the host died
          # part-way it would hold an EARLIER assembly's results while appearing to describe the
          # run: a diagnostic that is not merely incomplete but actively misleading, which is worse
          # than the console-only logging this replaced. The prefix form emits one file per
          # assembly, and the upload below globs them all.
          bash eng/ci/run-filtered-tests.sh \
            --filter "${{ matrix.shard.test_filter }}" -- \
            ${{ matrix.shard.filter }} \
            --configuration Release \
            --no-build \
            --blame-hang-timeout 5m \
            --blame-crash \
            --logger "trx;LogFilePrefix=coverage-shard-${{ matrix.shard.name }}" \
            --logger "console;verbosity=minimal" \
            --collect:"Code Coverage" \
            --settings tests/coverage.msft.runsettings \
            --results-directory ./coverage \
            -- RunConfiguration.TestSessionTimeout=3600000

      # The built-in collector emits a binary .coverage; everything downstream reads cobertura.
      - name: Convert coverage to cobertura
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install -g dotnet-coverage || dotnet tool update -g dotnet-coverage
          export PATH="$PATH:$HOME/.dotnet/tools"
          mapfile -t files < <(find ./coverage -name "*.coverage")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no .coverage file produced -- the collector did not run. An absent report is not a clean report."
            exit 1
          fi
          mkdir -p ./coverage/merged
          dotnet-coverage merge "${files[@]}" --output ./coverage/merged/coverage.cobertura.xml --output-format cobertura

      # if: always() is the load-bearing part. Without it this step is skipped on a failing run,
      # so the artifacts existed only when nobody needed them -- diagnostics uploaded on success
      # and withheld on failure is the exact inversion of what they are for. Kept separate from
      # the coverage upload below so its if-no-files-found: error still guards the coverage file.
      - name: Upload shard diagnostics (TRX, hang and crash reports)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # NOT `coverage-shard-diagnostics-*`: the aggregation job downloads `coverage-shard-*`,
          # and a diagnostics artifact named that way is pulled in as if it were a coverage report.
          # It carries no cobertura, so it contributed nothing but download volume -- twelve
          # extractions racing into one directory instead of six.
          name: shard-diagnostics-${{ matrix.shard.name }}
          path: |
            ./coverage/**/*.trx
            ./coverage/**/Sequence_*.xml
            ./coverage/**/*.dmp
          if-no-files-found: warn
          retention-days: 14

      - name: Upload shard coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-shard-${{ matrix.shard.name }}
          path: ./coverage/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: coverage-shards
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
      # merge-multiple is deliberately ABSENT. Every shard writes its report to the same internal
      # path (merged/coverage.cobertura.xml), so merging them into one directory put six concurrent
      # writers on one file: a corrupt 31MB document that ReportGenerator could not parse, on a run
      # where all six shards had succeeded. Without it each artifact extracts to its own
      # coverage/coverage-shard-<name>/ directory -- distinct paths, no race, and the downstream
      # globs see all six reports instead of the one that happened to win.
      - name: Download shard coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: coverage

      # Runs BEFORE the merge so an incomplete measurement is named as such. A missing report and a
      # low percentage are opposite problems; without this the aggregation would compute a confident
      # number from whatever subset arrived.
      - name: Verify every shard reported
        shell: bash
        run: bash eng/ci/coverage-shard-reports-complete.sh --coverage-root coverage

      - name: Merge coverage reports
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install -g dotnet-reportgenerator-globaltool || true

          # ReportGenerator exits 0 when it reads NOTHING -- it wrote Cobertura.xml, summary.html and
          # Summary.txt from zero reports on the run that produced this comment. Its exit code alone
          # cannot distinguish "merged six shards" from "parsed nothing at all", so count the inputs
          # ourselves and hold its output to that count.
          mapfile -t reports < <(find ./coverage -type f -name 'coverage.cobertura.xml' | sort)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::error::REFUSE: no cobertura reports to merge. An absent report is not a clean report."
            exit 1
          fi
          echo "merging ${#reports[@]} shard report(s):"
          printf '  %s\n' "${reports[@]}"

          # Redirect rather than pipe. `... | tee log` would make the pipeline's status tee's, which
          # is the same exit-masking that once let a failed commit report success -- and it is worth
          # avoiding even under `pipefail`, because the captured value here has to be unambiguous.
          set +e
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"./coverage/merged" \
            -reporttypes:"Cobertura;HtmlSummary;TextSummary" > reportgenerator.log 2>&1
          rg_exit=$?
          set -e
          cat reportgenerator.log

          if [ "$rg_exit" -ne 0 ]; then
            echo "::error::REFUSE: ReportGenerator exited ${rg_exit}."
            exit 1
          fi
          if ! [ -s ./coverage/merged/Cobertura.xml ]; then
            echo "::error::REFUSE: ReportGenerator exited 0 but produced no non-empty Cobertura.xml -- it read none of the ${#reports[@]} reports it was given. An exit code is not evidence of an effect."
            exit 1
          fi
          if grep -qiE 'Error during reading report|Failed to parse' reportgenerator.log; then
            echo "::error::REFUSE: ReportGenerator reported a read failure while still exiting 0. See the log above."
            exit 1
          fi

      - name: Enforce coverage threshold
        id: coverage_threshold
        shell: pwsh
        run: |
          ./eng/ci/coverage-threshold.ps1 `
            -CoverageRoot "coverage" `
            -Threshold ([int]'${{ env.COVERAGE_THRESHOLD }}') `
            -FailBelowThreshold
      - name: Coverage threshold status
        shell: bash
        run: |
          combined="${{ steps.coverage_threshold.outputs.coverage_combined_pct }}"
          dispatch="${{ steps.coverage_threshold.outputs.coverage_dispatch_pct }}"
          excalibur="${{ steps.coverage_threshold.outputs.coverage_excalibur_pct }}"
          threshold="${{ env.COVERAGE_THRESHOLD }}"
          target="${{ env.COVERAGE_TARGET }}"

          echo "Coverage (Dispatch): ${dispatch}%"
          echo "Coverage (Excalibur): ${excalibur}%"
          echo "Coverage (Combined): ${combined}%"
          echo "Ratchet floor (enforced): ${threshold}%   — coverage must not fall below this"
          echo "Target (not enforced):    ${target}%   — where we intend to be"

          # REFUSE, not pass. "Below the target" is a policy choice we have deliberately made
          # report-only; "no figure at all" is a broken instrument, and reporting success for a
          # measurement that never happened is the one thing a gate must never do. These are
          # different states and they get different exits.
          if [ -z "$combined" ]; then
            echo "::error::Coverage REFUSE — the threshold script emitted no combined figure, so coverage was NOT measured. This is not a pass: fix the coverage instrument or the report inputs."
            exit 1
          fi

          # The distance to the TARGET is reported every run so lowering the enforced floor to the truth
          # does not make the ambition invisible. A goal nobody is shown is a goal nobody moves toward.
          if (( $(awk "BEGIN {print ($combined < $target)}") )); then
            gap="$(awk "BEGIN {printf \"%.1f\", $target - $combined}")"
            echo "::notice::Coverage ${combined}% is ${gap} points below the ${target}% target. The enforced floor is ${threshold}%; raise it when a green run measures higher."
          fi

          if (( $(awk "BEGIN {print ($combined < $threshold)}") )); then
            echo "::warning::Coverage below target (report-only): combined ${combined}% < required ${threshold}%."
          else
            echo "✅ Coverage target met: ${combined}% >= ${threshold}%."
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: ./coverage/merged
          retention-days: 7

  # Test quality gate (self-contained)
  test-quality:
    name: Test Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore and build
        run: |
          bash ./build.sh --restore --project eng/ci/shards/UnitTests-Deterministic.slnf --verbosity quiet
          bash ./build.sh --build --no-restore --project eng/ci/shards/UnitTests-Deterministic.slnf --verbosity quiet

      - name: Run deterministic unit and DI tests
        run: |
          # LogFilePrefix, NOT LogFileName: this target is a solution FILTER, so several test
          # assemblies run in sequence and a fixed name makes each overwrite the last, leaving a
          # file that describes only whichever assembly finished last. The sibling
          # transport-conformance step keeps LogFileName correctly -- it runs a single project, so
          # there is nothing to overwrite.
          #
          # This comment sits ABOVE the command, not between its continued lines: a backslash
          # joins the lines before comments are processed, so a `#` inside the continuation would
          # swallow every flag after it.
          bash eng/ci/run-filtered-tests.sh \
            --filter "(Category=Unit|Category=DependencyInjection)&Category!=Performance" -- \
            eng/ci/shards/UnitTests-Deterministic.slnf --configuration Release --no-build \
            --blame-hang-timeout 5m \
            --logger "trx;LogFilePrefix=deterministic-unit" \
            --logger "console;verbosity=minimal" \
            --results-directory ./test-results \
            -- RunConfiguration.TestSessionTimeout=600000

      - name: Validate no test failures
        run: |
          # Count test results
          PASSED=$(find ./test-results -name "*.trx" -exec grep -o 'outcome="Passed"' {} \; | wc -l)
          FAILED=$(find ./test-results -name "*.trx" -exec grep -o 'outcome="Failed"' {} \; | wc -l)

          echo "Tests passed: $PASSED"
          echo "Tests failed: $FAILED"

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ $FAILED test(s) failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: test-results
          path: ./test-results
          retention-days: 14

  # Transport conformance (self-contained, conditional)
  transport-conformance:
    name: Transport Conformance (Core/Perf Changes)
    runs-on: ubuntu-latest
    needs: core-perf-change-detection
    if: github.event_name == 'workflow_dispatch' || needs.core-perf-change-detection.outputs.core_perf == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore and build
        run: |
          dotnet restore tests/conformance/Excalibur.Dispatch.Tests.Conformance/Excalibur.Dispatch.Tests.Conformance.csproj --verbosity quiet
          dotnet build tests/conformance/Excalibur.Dispatch.Tests.Conformance/Excalibur.Dispatch.Tests.Conformance.csproj --configuration Release --no-restore --verbosity quiet -p:BuildExamplesAndTests=true

      - name: Run transport conformance suite
        run: |
          bash eng/ci/run-filtered-tests.sh \
            --filter "Category=TransportConformance" -- \
            tests/conformance/Excalibur.Dispatch.Tests.Conformance/Excalibur.Dispatch.Tests.Conformance.csproj \
            --configuration Release \
            --no-build \
            --blame-hang-timeout 10m \
            --logger "trx;LogFileName=transport-conformance.trx" \
            --logger "console;verbosity=minimal" \
            --results-directory ./transport-conformance-results \
            -- RunConfiguration.TestSessionTimeout=900000

      - name: Upload transport conformance results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: transport-conformance-results
          path: ./transport-conformance-results
          retention-days: 14

  # Solution governance gate
  governance:
    name: Solution Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Validate solution governance
        shell: pwsh
        run: ./eng/validate-solution.ps1

      - name: Warning audit (informational)
        shell: pwsh
        continue-on-error: true
        run: |
          if (Test-Path "eng/ci/shards/ShippingOnly.slnf") {
            ./eng/audit-warnings.ps1 -Configuration Release
          } else {
            Write-Host "eng/ci/shards/ShippingOnly.slnf not found, skipping warning audit"
          }

  # Architecture validation gate (self-contained)
  architecture:
    name: Architecture Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Validate Dispatch-Excalibur Dependency Direction
        run: |
          echo "Checking for forbidden Dispatch-Excalibur references..."

          PROJECT_VIOLATIONS=$(grep -rE '<ProjectReference.*Excalibur\.(Domain|EventSourcing|Data|Saga|Application|Outbox|Jobs|LeaderElection[^.]|Hosting\.(Web|Jobs)|Security[^.])' src/Dispatch/**/*.csproj 2>/dev/null || true)
          PACKAGE_VIOLATIONS=$(grep -rE '<PackageReference.*Include="Excalibur\.(Domain|EventSourcing|Data|Saga|Application|Outbox|Jobs|Security)' src/Dispatch/**/*.csproj 2>/dev/null || true)

          VIOLATIONS=""
          if [ -n "$PROJECT_VIOLATIONS" ]; then VIOLATIONS="$PROJECT_VIOLATIONS"; fi
          if [ -n "$PACKAGE_VIOLATIONS" ]; then VIOLATIONS="$VIOLATIONS$PACKAGE_VIOLATIONS"; fi

          if [ -n "$VIOLATIONS" ]; then
            echo "❌ DEPENDENCY DIRECTION VIOLATION DETECTED"
            echo "$VIOLATIONS"
            exit 1
          else
            echo "✅ No Dispatch-Excalibur dependency violations found"
          fi

      - name: Build architecture tests
        run: |
          if [ -d "tests/architecture/Boundary.Tests" ]; then
            dotnet restore tests/architecture/Boundary.Tests/Boundary.Tests.csproj --verbosity quiet
            dotnet build tests/architecture/Boundary.Tests/Boundary.Tests.csproj --configuration Release --no-restore --verbosity quiet -p:BuildExamplesAndTests=true
          fi

      - name: Run architecture tests
        run: |
          if [ -d "tests/ArchitectureTests" ]; then
            dotnet restore tests/ArchitectureTests --verbosity quiet
            dotnet build tests/ArchitectureTests --configuration Release --no-restore --verbosity quiet -p:BuildExamplesAndTests=true
            dotnet test tests/ArchitectureTests --configuration Release --no-build --blame-hang-timeout 5m --logger "console;verbosity=quiet" -- RunConfiguration.TestSessionTimeout=420000
          else
            echo "Architecture test project not found, skipping..."
          fi

      - name: Run boundary tests
        # ARCH_ENFORCE=true makes the architecture boundary gate ENFORCING:
        # a real boundary violation (banned provider/framework in abstractions/core, etc.) FAILS the
        # build instead of being report-only. Local runs without the flag remain report-only (opt-out).
        env:
          ARCH_ENFORCE: "true"
        run: |
          if [ -d "tests/architecture/Boundary.Tests" ]; then
            dotnet test tests/architecture/Boundary.Tests/ --configuration Release --no-build --blame-hang-timeout 5m --logger "console;verbosity=quiet" -- RunConfiguration.TestSessionTimeout=420000
          else
            echo "Boundary.Tests project not yet created, skipping..."
          fi

  # API compatibility gate
  harness-gates:
    name: Harness Gate Battery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 0

      # Prove the orchestrator's exit is HONEST (a failing gate makes it exit 1) before trusting its
      # verdict -- the control runs in the SAME environment as the gate it proves.
      - name: Prove the gate orchestrator exit is honest
        run: bash eng/ci/harness-gates-ci.test.sh

      # Run the full CI-authoritative gate battery. Any gate/lock/assert failure -> exit 1 -> job red.
      - name: Run the CI-authoritative gate battery
        run: bash eng/ci/harness-gates-ci.sh

  # Summary gate -- blocking vs advisory split
  summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [coverage, test-quality, transport-conformance, code-analysis, governance, architecture, harness-gates]
    if: always()
    steps:
      - name: Check all gates
        run: |
          echo "Quality Gates Summary"
          echo "===================="
          echo ""

          blocking_failures=""
          advisory_failures=""

          # --- Blocking gates ---
          check_blocking() {
            local gate="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::Blocking gate failed: ${gate} (${result})"
              blocking_failures="${blocking_failures}${gate}=${result} "
            fi
          }

          check_blocking "coverage" "${{ needs.coverage.result }}"
          check_blocking "test-quality" "${{ needs.test-quality.result }}"
          check_blocking "code-analysis" "${{ needs.code-analysis.result }}"
          check_blocking "governance" "${{ needs.governance.result }}"
          check_blocking "architecture" "${{ needs.architecture.result }}"
          check_blocking "harness-gates" "${{ needs.harness-gates.result }}"

          # --- Advisory gates ---
          conformance_result="${{ needs.transport-conformance.result }}"
          if [ "$conformance_result" != "success" ] && [ "$conformance_result" != "skipped" ]; then
            advisory_failures="${advisory_failures}transport-conformance=${conformance_result} "
          fi

          # --- Report ---
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Quality Gates" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Result | Tier |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Code Coverage | ${{ needs.coverage.result }} | blocking |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Quality | ${{ needs.test-quality.result }} | blocking |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Code Analysis | ${{ needs.code-analysis.result }} | blocking |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Governance | ${{ needs.governance.result }} | blocking |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Architecture | ${{ needs.architecture.result }} | blocking |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Harness Gate Battery | ${{ needs.harness-gates.result }} | blocking |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Transport Conformance | ${{ needs.transport-conformance.result }} | advisory |" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$blocking_failures" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Blocking gate failures: ${blocking_failures}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -n "$advisory_failures" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Advisory gate failures (non-blocking): ${advisory_failures}" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ All blocking quality gates passed." >> "$GITHUB_STEP_SUMMARY"
