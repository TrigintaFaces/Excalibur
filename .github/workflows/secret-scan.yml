name: "Secret Detection Scan"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # A required context must be produceable on EVERY event that gates a merge, and the queue is one of
  # them. Without this trigger the workflow simply never starts for a queued change, and a required
  # check that never runs is not skipped -- it reports "Expected - waiting for status to be reported",
  # forever, exactly as the push/pull_request notes above describe. The queue would hang on a check
  # that cannot arrive, with nothing to re-run.
  #
  # Inert until the queue is enabled on the repository, which is a setting rather than content.
  merge_group:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  # Event-aware: a PUSH keys the group by run id, so it shares a group with nothing and cannot be
  # superseded -- neither while running nor while queued. Every commit on a protected branch must
  # reach a verdict, and a ref-keyed group with an unconditional cancel silently denied that to
  # any commit followed quickly by another. Superseding a stale PULL REQUEST run is still wanted,
  # so PRs group by number and keep cancel-in-progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gitleaks:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Install Gitleaks
        run: python3 eng/ci/install-gitleaks.py

      - name: Run Gitleaks
        id: gitleaks_scan
        continue-on-error: true
        run: |
          set -euo pipefail
          # Scan current checkout only; avoids history-only findings from old commits.
          # Allowlists are managed in .gitleaks.toml (path-regex based, not line-based).
          gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            -v \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-report.sarif

      - name: Upload Gitleaks SARIF report
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks
          wait-for-processing: false

      - name: Upload scan results
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 30

      - name: Fail on secret detection
        if: steps.gitleaks_scan.outcome == 'failure'
        run: |
          echo "❌ SECRET DETECTION FAILED"
          echo "Secrets detected in the codebase. Review the Gitleaks report."
          echo "Add legitimate false positives to .gitleaksignore"
          exit 1
      # A required check that fails and explains nothing costs more than one that does not exist: it
      # blocks the merge and the only way to learn why is the raw log of a job that has scrolled past.
      # This job is one of four required contexts and wrote no summary at all.
      #
      # always(), because the case that needs the summary most is the failing one.
      - name: Report result
        if: always()
        run: |
          bash eng/ci/job-summary.sh             --title "Scan for Secrets"             --verdict "${{ steps.gitleaks_scan.outcome == 'success' && 'pass' || (steps.gitleaks_scan.outcome == 'failure' && 'fail' || 'refuse') }}"             --detail "${{ steps.gitleaks_scan.outcome == 'success' && 'gitleaks scanned the checked-out tree and found no committed secrets' || (steps.gitleaks_scan.outcome == 'failure' && 'gitleaks scanned the checked-out tree and reported at least one hit' || 'NOTHING WAS SCANNED. The scan step did not run -- the install or the checkout failed before it. This is not a clean tree; it is an unmeasured one.') }}"             --next "A hit is treated as a live credential until proven otherwise: rotate it first, then remove it from history. If it is a false positive, add an allowlist entry at the authoring site rather than relaxing the scanner."
