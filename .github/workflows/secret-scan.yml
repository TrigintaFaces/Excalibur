name: "Secret Detection Scan"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gitleaks:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.24.3"
          # Extract into RUNNER_TEMP, never the workspace. The tarball carries gitleaks, LICENSE and
          # README.md; piping it to `tar -xz` here unpacked all three into the checkout, and only the
          # binary was moved out. gitleaks' own README stayed at the workspace root -- the same relative
          # path as the repository's -- and it DOCUMENTS the detection rules, example tokens included.
          # The next step then scanned it with --no-git and reported a Sidekiq secret at README.md:50,
          # cols 23-75. That is gitleaks finding an example secret in its own documentation: not in this
          # repository, not in its history, and not reproducible anywhere except a workspace polluted by
          # this install step. Reproduced exactly by scanning the bundled README with the same version.
          mkdir -p "${RUNNER_TEMP}/bin" "${RUNNER_TEMP}/gitleaks-dist"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "${RUNNER_TEMP}/gitleaks-dist"
          mv "${RUNNER_TEMP}/gitleaks-dist/gitleaks" "${RUNNER_TEMP}/bin/gitleaks"
          chmod +x "${RUNNER_TEMP}/bin/gitleaks"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/gitleaks" version

      - name: Run Gitleaks
        id: gitleaks_scan
        continue-on-error: true
        run: |
          set -euo pipefail
          # Scan current checkout only; avoids history-only findings from old commits.
          # Allowlists are managed in .gitleaks.toml (path-regex based, not line-based).
          gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            -v \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-report.sarif

      - name: Upload Gitleaks SARIF report
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks
          wait-for-processing: false

      - name: Upload scan results
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 30

      - name: Fail on secret detection
        if: steps.gitleaks_scan.outcome == 'failure'
        run: |
          echo "❌ SECRET DETECTION FAILED"
          echo "Secrets detected in the codebase. Review the Gitleaks report."
          echo "Add legitimate false positives to .gitleaksignore"
          exit 1
