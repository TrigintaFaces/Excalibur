# Committed-Content Gates
#
# The enforcement boundary for must-block checks that run on COMMITTED content: this workflow runs on
# the mirror (GitHub Actions) against the checked-out SHA under branch protection, so its checks are
# non-bypassable by construction — unlike a local pre-commit hook, which is bypassable and scoped to a
# working tree. Gate LOGIC lives once in eng/ci/*.sh (invoked here for enforcement and by a thin local
# pre-commit for fast feedback). Each gate below is a required status check and ships a planted-violation
# proof (its self-test reddens on a seeded violation) so it can never pass vacuously.
#
# Scope: the committed-content / shipped-artifact correctness + public-surface checks. Build/test live in
# ci.yml; secret-scanning is the one local pre-copy gate + GitHub push-protection on the mirror.

name: Committed-Content Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # Event-aware: a PUSH keys the group by run id, so it shares a group with nothing and cannot be
  # superseded -- neither while running nor while queued. Every commit on a protected branch must
  # reach a verdict, and a ref-keyed group with an unconditional cancel silently denied that to
  # any commit followed quickly by another. Superseding a stale PULL REQUEST run is still wanted,
  # so PRs group by number and keep cancel-in-progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Proves the real-infra tenant-isolation gate's own MECHANISM is non-vacuous: it exercises the gate's
  # REAL `dotnet test` invocation + output-parse + exit-mapping against a permanent planted-violation
  # fixture (Category=GateSelfTest — env-armed, Docker-free), asserting a real dotnet FAIL maps to the
  # gate's FAIL exit and a real PASS maps to PASS. Docker-free, so it runs here on every commit.
  #
  # SCOPE (accurate): this job proves the gate's mechanism ONLY. The container-backed ENFORCEMENT run —
  # the gate invoked WITHOUT --self-test, which requires the SqlServer/Postgres/Oracle containers plus
  # the curated tenant-isolation test subset — is NOT yet wired into CI and runs in no job here. Until
  # that required job is stood up (tracked follow-up), real-infra tenant isolation is not enforced on
  # push-to-main by this workflow.
  real-infra-gate-mechanism:
    name: Real-Infra Gate Mechanism (non-vacuity)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: bash ./build.sh --restore --project eng/ci/shards/IntegrationTests.slnf --verbosity quiet

      - name: Build (Release)
        run: bash ./build.sh --build --no-restore --project eng/ci/shards/IntegrationTests.slnf --verbosity quiet

      # No `|| true`, no continue-on-error: a non-zero exit (FAIL or REFUSE) reddens this required check.
      - name: Real-infra gate mechanism self-test (real dotnet path)
        run: bash eng/ci/real-infra-tenant-gate.sh --self-test

  # Whole-tree structural + public-surface gates — pure shell/grep, no build required. Each runs on the
  # checked-out committed SHA. Blocking (no `|| true`) unless a step is marked advisory pending a tracked
  # cleanup, which flips to blocking once the cleanup lands (the shipped-with-teeth sequencing).

      - name: Workflow hygiene (pins, permissions, timeouts, continuations)
        run: bash eng/ci/workflow-hygiene-gate.sh

      - name: Shard coverage (every test project belongs to a shard)
        run: python3 eng/ci/shard-coverage-gate.py

      - name: Policy consistency (thresholds match eng/ci/quality-policy.json)
        run: python3 eng/ci/policy-consistency-gate.py

      # Pinned by VERSION AND SHA256. An unpinned download is a third party deciding what runs in
      # our gate, and this gate's whole job is to notice things nobody decided.
      - name: Install actionlint (pinned)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSL --retry 3 --max-time 120 -o /tmp/actionlint.tar.gz "$url"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      # Proves the gate can still FAIL before we believe it passing. A linter that silently stops
      # reporting is indistinguishable from clean workflows -- which is precisely how the eight
      # defects this gate was written for survived every green run.
      - name: actionlint-gate self-test (non-vacuity)
        run: bash eng/ci/actionlint-gate.sh --self-test

      # BLOCKING — workflow YAML must lint clean. These defects do not stop a run, so no amount of
      # green CI contradicts them: an undefined `needs` context that made a release summary report
      # failure on every success, a composite input advertised required:true that all six call sites
      # omitted, and a bool passed to a string-typed input.
      - name: actionlint-gate
        run: bash eng/ci/actionlint-gate.sh

      # Proves the coverage-completeness gate still REFUSES a partial measurement, and still passes a
      # complete one. Both arms matter: the gate exists because six shards succeeded and the
      # aggregation reported a failure that had nothing to do with coverage, and a completeness gate
      # that can only ever say PASS would have been just as blind. Its parser reads the shard names
      # out of quality-gates.yml, so this also catches the matrix being renamed out from under it.
      - name: coverage-shard-reports-complete self-test (non-vacuity)
        run: bash eng/ci/coverage-shard-reports-complete.sh --self-test

      # BLOCKING - .github/workflows/ is COPIED to the public mirror, so a beads/tracker reference
      # there both leaks internal tooling into a shipped file and breaks the downstream checkout,
      # because the private scripts are not copied. The lock was written with safety, liveness and
      # four non-vacuity arms (two hermetic, two against a historical commit that genuinely carried
      # the references) - and was invoked by nothing, so the operator directive it enforces was
      # unenforced. Its own arms run first; a lock nobody can see fail is not evidence.
      - name: no-beads-in-workflows lock
        run: bash eng/ci/no-beads-in-workflows.harness-lock.sh

      # A container image tagged "latest" is a promise the registry can re-point, so the image we
      # tested is not necessarily the image anyone else gets. Most of these live under samples/ and
      # templates/, which SHIP -- a consumer following a sample runs the image it names, and that is
      # the one class of staleness we cannot fix for them afterwards.
      #
      # A ratchet rather than a ban: there are dozens already and some vendors publish only :latest,
      # so banning them outright would mean a risky mass edit or a gate everyone routes around. The
      # count may fall freely and may not rise. Its own arms run first -- in particular the one
      # proving a LOCALLY BUILT :latest is not counted, since absorbing build outputs into the
      # baseline would make the number stop measuring supply-chain exposure at all.
      # A required status check that nothing can satisfy does not fail a pull request -- it leaves
      # it "Expected - waiting for status to be reported" forever, with every check green and the
      # merge button greyed out. Nothing is running, so there is nothing to re-run, and the pipeline
      # looks broken rather than misconfigured.
      #
      # Four instances of that shipped here and each hid behind the one in front: two required
      # contexts named "Workflow / Job" when a check run is named after the JOB, one omitted a
      # matrix dimension that is part of the name, and one workflow was path-filtered so its
      # required context never arrived on a documentation-only change. All four are the same
      # invariant and all four are checkable from the ruleset plus the workflow YAML.
      #
      # Needs no extra token: it reads branch protection with the default GITHUB_TOKEN and REFUSES
      # rather than passing if it cannot read the required set at all.
      - name: required-contexts-satisfiable self-test (non-vacuity)
        run: python3 eng/ci/required-contexts-satisfiable.py --self-test

      - name: required-contexts-satisfiable
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/ci/required-contexts-satisfiable.py --repo "${{ github.repository }}" --root .

      # THE PUBLIC-SURFACE LEAK GATE. It exists, it works, and until now nothing ran it.
      #
      # It scans the surfaces a consumer can see -- the shipped .xml docs, samples, the docs
      # site, README/CHANGELOG -- plus eng/ and .github/workflows/, which are mirrored to a
      # public repository and which this gate previously excluded by construction.
      #
      # Ratcheted: the pre-existing population is a recorded debt register, and this fails on
      # any NEW leak or any rise in a recorded count. Proven both ways by the self-test.
      - name: no-internal-refs self-test (non-vacuity)
        run: bash eng/ci/no-internal-refs-gate.sh --self-test

      - name: no-internal-refs (ratcheted -- fails on any NEW public-surface leak)
        run: bash eng/ci/no-internal-refs-gate.sh

      # Every capability we ADVERTISE to consumers must have an end-to-end arm that actually reaches
      # the real seam. The manifest is enumerated from what the guarantee docs and package READMEs
      # promise -- never from what is implemented -- so a subsystem that is advertised and never
      # exercised end to end is visible here rather than inferred from a unit suite that cannot
      # observe whether a component is ever reached.
      #
      # A row with no arm is a FAILURE, not a skip: there is no not-applicable escape hatch. The gate
      # also fails when a declared arm matches nothing (renamed or deleted), fails, or SKIPS -- a run
      # that verified nothing must not report what a run that verified everything reports.
      #
      # Three states, and the third is why exit codes matter here: 0 pass, 1 a real capability verdict
      # (unarmed or failing), 2 REFUSE -- nothing was checked, or an arm could not be measured because
      # the build broke. A REFUSE is not a claim that the capability is unarmed; it says this run does
      # not know. Both non-zero states redden this step, which is correct -- the distinction is for the
      # human reading the log, who would otherwise chase a product defect that is a broken toolchain.
      #
      # THIS IS RED AT HEAD AND THAT IS THE HONEST STATE: most rows are still unarmed, and the gate
      # says so. Its red is a non-vacuity proof that costs nothing today and expires the moment the
      # last arm lands -- at that point the gate needs a planted-violation self-test, because from
      # then on nothing else demonstrates it can still fail.
      #
      # It runs here rather than in a pure-shell job because a declared arm is executed for real:
      # this job has the SDK and the built integration shard, and the arms stand up their own
      # containers.
      # The gate's ability to fail is currently demonstrated by its own red. That proof expires when the
      # last arm lands, so this step plants violations against fixture manifests and asserts each of the
      # three verdicts is reachable -- FAIL on an unarmed capability, FAIL on an arm that matched no test,
      # PASS on a fully armed one, REFUSE on a manifest that parses to nothing. It runs FIRST: a verdict
      # from an instrument that has not shown it can still fail is not evidence.
      - name: e2e-capability self-test (non-vacuity)
        run: pwsh -NoProfile -File eng/ci/e2e-capability-gate.ps1 -SelfTest

      - name: e2e-capability (an advertised capability with no verified end-to-end arm fails)
        run: pwsh -NoProfile -File eng/ci/e2e-capability-gate.ps1

      # A shipped Oracle migration signals a refusal with RAISE_APPLICATION_ERROR, and SQL*Plus
      # exits 0 on that unless the script carries a WHENEVER SQLERROR EXIT FAILURE directive -- so
      # an unattended runner records a DECLINED migration as applied and runs the next step against
      # a database that was never changed. The gate derives its predicate from the script itself, so
      # a new script that raises and forgets the directive is caught without anyone updating a list.
      - name: oracle-refusal-exit-code self-test (non-vacuity)
        run: bash eng/ci/oracle-refusal-exit-code-gate.sh --self-test

      - name: oracle-refusal-exit-code (a refusal must exit non-zero)
        run: bash eng/ci/oracle-refusal-exit-code-gate.sh

      - name: aot-promise-coherence self-test (non-vacuity)
        run: python3 eng/ci/aot-promise-coherence-gate.py --self-test

      # A package cannot be AOT-compatible if an assembly it ships is not. Each project is
      # analyzed alone, so the contradiction is invisible to the build; this reads the claims
      # across the reference graph. Exit 2 means something was unreadable and is NOT a pass.
      - name: aot-promise-coherence (no package may claim AOT that a shipped dependency denies)
        run: python3 eng/ci/aot-promise-coherence-gate.py

      - name: aot-annotation-inventory self-test (non-vacuity)
        run: python3 eng/ci/aot-annotation-inventory-gate.py --self-test

      # Opting a package out of the AOT claim also turns OFF its AOT analyzer, so the build stops
      # reporting new dynamic-code violations there. This inventory is what keeps that detection:
      # a newly annotated public member must be recorded deliberately, in a reviewed diff.
      - name: aot-annotation-inventory (a new AOT-unsafe public member must be recorded)
        run: python3 eng/ci/aot-annotation-inventory-gate.py

      - name: Build compiler-backed artifact checks
        run: |
          dotnet restore eng/tools/RepositoryChecks/RepositoryChecks.csproj --locked-mode -p:BuildExamplesAndTests=true
          dotnet build eng/tools/RepositoryChecks/RepositoryChecks.csproj -c Release --no-restore -p:BuildExamplesAndTests=true

      - name: mutable-image-tag ratchet self-test (non-vacuity)
        run: bash eng/ci/mutable-image-tag-gate.sh --self-test

      - name: mutable-image-tag ratchet
        run: bash eng/ci/mutable-image-tag-gate.sh

      # The workflow inventory is GENERATED from the workflows, never hand-maintained, because a
      # hand-written inventory drifts and a drifted inventory is worse than none — it is trusted.
      # --check exits non-zero when the committed document no longer matches the workflows it
      # describes. The generator existed with this mode for some time and nothing ran it, so the
      # committed inventory was stale and the drift it exists to prevent had already happened.
      - name: Install PyYAML (the inventory generator parses workflow YAML)
        run: python3 -m pip install --quiet pyyaml

      - name: Coverage diff uses the base SDK and candidate helpers
        run: python3 eng/ci/coverage-diff-layout.test.py

      - name: Workflow inventory is current (generated, not hand-maintained)
        run: python3 eng/ci/generate-workflow-inventory.py --check

      # Asserts the shipping filter names all and only the packable projects under src/. This ran
      # nowhere. A newly added packable project that is missing from the filter is not built, not
      # packed, and silently never ships — and nothing reports anything, because every other
      # packaging gate checks what IS in the filter rather than what is absent from it. A missing
      # artifact must fail rather than report success.
      - name: Shipping filter names every packable project
        run: pwsh -NoProfile -File eng/ci/validate-shipping-filter.ps1

      # Blocks historical repository URL variants in tracked files. The canonical reference is part
      # of the published surface, so a stale URL is consumer-visible.
      - name: Repository links are canonical
        run: pwsh -NoProfile -File eng/ci/validate-repository-links.ps1
  shell-gates:
    name: Committed-Content Shell Gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # BLOCKING — every integration test project on disk must be registered in the shard solution filter,
      # or it compiles and runs NOWHERE (a silently-uncovered test project).
      - name: orphan-test-project-gate
        run: bash eng/ci/orphan-test-project-gate.sh

      # Its own arms first: a gate nobody can see fail is not evidence.
      - name: integration-shard-partition-gate self-test (non-vacuity)
        run: bash eng/ci/integration-shard-partition-gate.sh --self-test

      # BLOCKING — the gate above proves a project is a MEMBER of the integration filter; this proves it is
      # also EXECUTED. The integration suite runs as shards, and a project added to the parent filter but to
      # no shard passes the orphan gate, compiles in nightly, and still runs nowhere on a pull request while
      # the suite reports green. Also catches the reverse (in a shard, unknown to the parent) and a project
      # in two shards, which runs twice and counts its coverage twice in the combined number.
      - name: integration-shard-partition-gate
        run: bash eng/ci/integration-shard-partition-gate.sh

      # BLOCKING — a declared SQL predicate fragment that the SQL string never interpolates or concatenates
      # is a filter the query silently ignores (a dead WHERE clause). Pure git/grep over src/**/*.cs; passes
      # clean on committed content today.
      # BLOCKING - every gate must report WHAT IT EXAMINED, not only what it found. A gate printing
      # "0 violations" over a population that silently drifted out of its matcher's shape prints the
      # same green as a gate over a clean tree, and nothing in the output tells them apart. One
      # counter and one line per gate closes that, and it degrades on its own: when a matcher stops
      # matching, the count falls toward zero and says so, with nobody having anticipated the drift.
      # Enumerated baseline (shrink-only); passes clean on committed content today.
      - name: gate-denominator-gate
        run: bash eng/ci/gate-denominator-gate.sh

      # BLOCKING — a conformance suite that derives a kit living under tests/ instead of the one inside the
      # published conformance package is verifying a contract no consumer can obtain: our providers pass a
      # suite nobody outside this repository has, the published arms go unexercised, and the two drift with
      # nothing detecting it. Both halves stay green the whole time, which is why only a boundary-aware scan
      # can see it. Enumerated baseline (shrink-only: a stale entry also fails); passes clean today.

      # Persistence health coverage is enforced by the compiler census in ci.yml architecture-tests.

      # Backend conformance coverage is enforced by the compiler census in ci.yml architecture-tests.

      # Runtime capability enforcement and its semantic wiring/skip inventory are required
      # by ci.yml architecture-tests. Provider execution remains covered by conformance tests.

      # ArchitectureEvidenceShould checks subsystem citations against Roslyn declarations in the
      # required Architecture Tests job, including ambiguity and zero-citation ratchet controls.
      # BLOCKING — thirteen gates that already run in CI had their own self-test invoked by nothing.
      # A gate enforces; its self-test is the only thing establishing that the gate can still FAIL.
      # Wired separately, those two facts drift: a gate whose detection silently goes vacuous keeps
      # reporting the same green, and nothing anywhere notices. That is not hypothetical here -- a
      # gate in this very job was recently found refusing every arm universally, and the only reason
      # it was caught is that ITS self-test was wired and went red. The thirteen below had no such
      # tripwire.
      #
      # Run as one batch because they share a single rationale, and each is reported by name with its
      # own exit code so a failure stays diagnosable. Shell only, no compiler, no test run, so this
      # costs the job seconds and costs a commit nothing. Every one of these passed when wired; a new
      # failure here means that gate lost the ability to detect what it claims to detect, which is a
      # finding about the gate and must not be silenced by removing it from this list.
      #
      # spa-gate is deliberately NOT here, and that is not a silencing. Its self-test builds the SPA
      # bundle, so it needs Node and `npm ci`; this job installs neither and the gate correctly exits
      # 2 (CANNOT EVALUATE) before any arm runs. It IS wired, in the one job that can evaluate it --
      # ci.yml's `dashboard-spa`, immediately after `npm ci`. Adding it back here buys no coverage and
      # reds the job on a missing toolchain.
      - name: Non-vacuity of wired gates whose self-test was unwired
        run: |
          set -u
          failed=0
          for g in assert-tests-executed \
                   gate-denominator-gate orphan-test-project-gate \
                   package-metadata-gate \
                   workflow-hygiene-gate; do
            # `|| rc=$?`: this step's shell is `bash -e`, so an unguarded failing command
            # kills the step before `rc=$?` is read -- the per-gate name, exit code and log
            # tail below then never print. A condition context suppresses -e and keeps them.
            rc=0
            bash "eng/ci/$g.sh" --self-test > "/tmp/$g.selftest.log" 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "  ok      $g"
            else
              echo "::error::$g --self-test exited $rc; its gate can no longer be shown to fail"
              tail -20 "/tmp/$g.selftest.log" | sed 's/^/      /'
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

      # BLOCKING — a seam whose blast radius demands a higher CLASS of guarantee than it produces,
      # reported as covered. ArchitectureEvidenceShould asserts that a guarantee's named test
      # still resolves; this one asserts the guarantee is of the right CLASS at all. A green
      # sampling-class suite says nothing about a state space it never enumerated, so a catastrophic
      # seam with no model check is UNVERIFIED at that rung, never clean. Coverage is bidirectional:
      # a new ARCHITECTURE.md with no ladder entry FAILS, and the debt baseline is shrink-only.
      # Self-test (17 arms) proves the gate FAILS on each defect it claims to detect and REFUSES
      # rather than passing when it cannot read the manifest or the tree.
      # The ladder manifest is YAML. Without the parser the gate REFUSEs (exit 2) rather than
      # reporting a tree it could not read as clean, so the install is load-bearing, not cosmetic.
      - name: Install PyYAML (the rigor ladder manifest is YAML)
        run: python3 -m pip install --quiet pyyaml

      - name: rigor-ladder-gate self-test (non-vacuity)
        run: bash eng/ci/rigor-ladder-gate.sh --self-test

      - name: rigor-ladder-gate
        run: bash eng/ci/rigor-ladder-gate.sh

      # Deterministic test timing is enforced by the Roslyn census in ci.yml.

      # Message identity is enforced by compiler diagnostic REPO002 in every source project.
      # Boundary.Tests verifies semantic positive/negative controls and evaluated analyzer wiring.

      # Its arms first, for the same reason as every other gate here. Six of them, and one exists because
      # the gate's own first run was green on small fixtures while reporting every real release missing:
      # a reader that exits early makes an existing section look absent, and only a large input shows it.
      - name: changelog-tag-coverage self-test (non-vacuity)
        run: bash eng/ci/changelog-tag-coverage-gate.sh --self-test

      # BLOCKING -- a tag is the moment a version becomes installable, and the changelog is where the
      # consumer looks to find out what is in it. Nothing linked the two, so a release was published and
      # the file never grew a section for it: everything that shipped stayed under [Unreleased], and a
      # Known Issues entry kept saying a defect was "not yet fixed" after the fix shipped in the version
      # the reader had installed. Derived from the tags that exist, so a new release is covered the moment
      # it is tagged. Requires the tags -- this job checks out at fetch-depth 0; the gate REFUSES rather
      # than passing vacuously if they are ever absent.
      - name: changelog-tag-coverage
        run: bash eng/ci/changelog-tag-coverage-gate.sh

      # ADVISORY pending cleanup — a .ValidateOnStart() with no IValidateOptions<T>/ValidateDataAnnotations
      # validator validates nothing (false-safety). There are pre-existing chains in src/ tracked for fix;
      # this step flips to blocking (drop the `|| true`) once the gate exits 0 on committed src/.

  # A tracked packages.lock.json that `dotnet restore` would rewrite = a committed lock file out of sync
  # with its PackageReferences (a reproducibility / supply-chain drift). RestorePackagesWithLockFile is on,
  # so restore writes lock files; the gate then fails if that changed any tracked lock file. Needs a restore
  # step BEFORE the gate (the gate itself only detects the resulting drift via git diff).
  lockfile-drift:
    name: Committed-Content Lockfile Drift
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      # --force-evaluate is what makes this restore a MEASUREMENT rather than a formality. A plain
      # restore rewrites a lock file only when the committed graph is UNSATISFIABLE; a lock listing a
      # package the project no longer references is still satisfiable, so restore leaves it untouched
      # and the gate downstream sees nothing. Measured: a plain restore reported "All projects are
      # up-to-date" over twenty lock files that still named a removed dependency, and reported two --
      # the only two whose graph had become unsatisfiable. Forcing re-evaluation resolves from
      # scratch, so staleness that is merely satisfiable is visible too.
      - name: Restore (re-evaluates the graph, rewriting any lock file that no longer matches it)
        run: dotnet restore Excalibur.sln --force-evaluate --verbosity quiet

      # BLOCKING. The restore-verification this step waited for has been performed: a locked-mode
      # restore of the whole solution resolves the committed lock files exactly, so a rewritten lock
      # file here is drift and not a pre-existing staleness the gate would trip over on every run.
      #
      # No `|| true`. The gate reports three states and only one of them is a pass: 0 means tracked
      # lock files were found and none drifted, 1 means at least one was rewritten by the restore
      # above, and 2 means it found nothing to check and is therefore making no claim. Swallowing
      # the exit code collapsed all three into a pass, which is worse than not running the gate --
      # a check that cannot fail still reports that the checking is happening.
      - name: lockfile-drift-gate
        run: bash eng/ci/lockfile-drift-gate.sh

  # A shipping NuGet package must carry its consumer-visible metadata (projectUrl + icon + lockfile-on),
  # or it publishes a blank field to consumers. The gate evaluates REAL MSBuild properties, so it needs
  # the SDK; a fast single-project restore before it removes any evaluation-refuse on a clean runner.
  package-metadata:
    name: Committed-Content Package Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore (representative shipping project — makes MSBuild property evaluation deterministic)
        run: bash ./build.sh --restore --project src/Dispatch/Excalibur.Dispatch.Abstractions/Excalibur.Dispatch.Abstractions.csproj --verbosity quiet

      # BLOCKING (no `|| true`): a shipping project that evaluates a blank projectUrl / icon / lockfile-flag
      # reddens this required check. Passes clean on committed content today.
      - name: package-metadata-gate
        run: bash eng/ci/package-metadata-gate.sh

  # A commit whose own checkout is dirty is a commit that describes a tree nobody can reproduce.
  # release.yml already refuses on it -- and until now that was the ONLY place in the repo asserting
  # it, so the assertion could not fire before a release. It fired there: run 33917094420 refused
  # v10.0.0-alpha.10 on 23 blobs carrying a stray CR, written months earlier by a tool that re-emitted
  # CRLF over already-CRLF files. git's clean filter strips exactly ONE CR before each LF, so the
  # surplus CR survives into the blob, and every clone of that commit is dirty the moment it lands.
  # Nothing about it is release-specific. The same one-line assertion belongs on every commit, which
  # is what this job is: the release gate, moved to where it can still be cheap to fix.
  clean-checkout:
    name: Committed-Content Clean Checkout
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      # Nothing runs before this: no build, no restore, no generator. Anything reported is therefore
      # a property of the COMMIT, not of a step that mutated the tree.
      #
      # The liveness arm runs FIRST and is not optional. `git status --porcelain` returning empty is
      # the pass condition, and an empty string is also what a broken git, a bad working directory, or
      # a shallow-checkout quirk returns -- indistinguishable from a clean tree. So the job proves the
      # command can report dirt HERE before it is allowed to certify the absence of it.
      - name: Assert the checkout is clean (liveness arm, then the gate)
        shell: bash
        run: |
          set -euo pipefail

          probe=".clean-checkout-liveness-probe"
          echo probe > "$probe"
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::REFUSE: git status reported CLEAN with an untracked probe file present."
            echo "  The command cannot see dirt in this environment, so its silence proves nothing."
            exit 1
          fi
          rm -f "$probe"
          echo "liveness arm passed: git status reports dirt when dirt exists"

          dirty="$(git status --porcelain)"
          if [ -n "$dirty" ]; then
            echo "::error::The checked-out tree is dirty at ${GITHUB_SHA}. Every clone of this commit is."
            echo "$dirty"
            echo ""
            echo "Most likely a stray carriage return inside a committed blob. To find them:"
            echo "  git grep -I -l -P '\r$' HEAD"
            echo "To fix, per file:  perl -0pi -e 's/\r+\n/\r\n/g' <file>  then re-stage."
            exit 1
          fi
          echo "working tree clean"

  # PARTITIONED OUT of the gate battery above, deliberately, and this note is why.
  #
  # This gate is RED at HEAD and that is the honest state: 971 of 1139 baseline suppression rows carry
  # no reviewed verdict. Burning that down is ~712 individual judgements across 332 files (1.36 rows per
  # distinct file/warning/justification pattern), so it will not clear before a tag.
  #
  # It used to sit in the battery above. A job is red if ANY step is red, so one permanently-red step
  # made the other nine gates in that job unable to report a state CHANGE -- they were producing a red
  # that was already there. That is a vacuous green pointed backwards, and it cost us: two of those
  # nine were themselves failing for weeks unnoticed, and one was hiding a table that told consumers a
  # package was AOT-safe while its own code said otherwise.
  #
  # Nothing is weakened. The gate still fails, on the same rows, with the same exit codes -- it simply
  # fails where its red means "this debt is unpaid" instead of masking nine gates whose red would mean
  # "something just broke". Fold it back the moment the classification backlog is cleared.
  aot-suppression-debt:
    name: AOT Suppression Classification (recorded debt)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: aot-suppression-classification self-test (non-vacuity)
        run: python3 eng/ci/aot-suppression-classification-gate.py --self-test

      - name: aot-suppression-classification (a baseline row must carry a reviewed verdict)
        run: python3 eng/ci/aot-suppression-classification-gate.py --check
