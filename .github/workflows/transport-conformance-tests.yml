name: Transport Conformance Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/Dispatch/Excalibur.Dispatch.Transport.*/**'
      - 'tests/conformance/**'
      - '.github/workflows/transport-conformance-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/Dispatch/Excalibur.Dispatch.Transport.*/**'
      - 'tests/conformance/**'
      - '.github/workflows/transport-conformance-tests.yml'
  workflow_dispatch:

# Least privilege, declared explicitly. GITHUB_TOKEN otherwise inherits the repository
# default, which may be write-all; a workflow that only reads code and reports should never
# hold a token that can push. Declaring permissions REPLACES the default set rather than
# adding to it, so every scope this workflow needs is listed here.
permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  # Event-aware: a PUSH keys the group by run id, so it shares a group with nothing and cannot be
  # superseded -- neither while running nor while queued. Every commit on a protected branch must
  # reach a verdict, and a ref-keyed group with an unconditional cancel silently denied that to
  # any commit followed quickly by another. Superseding a stale PULL REQUEST run is still wanted,
  # so PRs group by number and keep cancel-in-progress.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  conformance-matrix:
    name: ${{ matrix.transport }} Conformance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        transport:
          - InMemory
          # - AzureServiceBus
          # - AwsSqs
          # - Kafka
          # - RabbitMq
          # - GooglePubSub

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x

      - name: Restore dependencies
        run: dotnet restore tests/conformance/Excalibur.Dispatch.Tests.Conformance/Excalibur.Dispatch.Tests.Conformance.csproj

      - name: Build conformance tests
        run: |
          dotnet build tests/conformance/Excalibur.Dispatch.Tests.Conformance/Excalibur.Dispatch.Tests.Conformance.csproj -p:BuildExamplesAndTests=true \
            --configuration Release \
            --no-restore \
            --verbosity normal

      - name: Run ${{ matrix.transport }} conformance tests
        run: |
          # --blame-hang-timeout: conformance tests drive real transport containers, which is
          # exactly where a test host wedges alive-but-not-working. Without a bound the job
          # burns its whole runner allowance and reports a timeout with no failing test named.
          # ci.yml and release.yml already pass this; this workflow did not.
          bash eng/ci/run-filtered-tests.sh \
            --filter "FullyQualifiedName~${{ matrix.transport }}TransportConformanceTests" -- \
            tests/conformance/Excalibur.Dispatch.Tests.Conformance/Excalibur.Dispatch.Tests.Conformance.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --blame-hang-timeout 10m \
            --verbosity minimal \
            --logger "trx;LogFileName=${{ matrix.transport }}-conformance-results.trx" \
            --logger "console;verbosity=minimal" \
            --collect:"XPlat Code Coverage" \
            -- RunConfiguration.TestSessionTimeout=900000 DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ${{ matrix.transport }}-conformance-test-results
          path: |
            **/*-conformance-results.trx
            **/TestResults/**/*.xml
            **/TestResults/**/*.coverage
          retention-days: 30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: always()
        with:
          files: '**/TestResults/**/coverage.opencover.xml'
          flags: conformance,${{ matrix.transport }}
          name: ${{ matrix.transport }}-conformance-coverage

      - name: Generate conformance report
        if: always()
        run: |
          echo "## ${{ matrix.transport }} Transport Conformance Report" > conformance-report.md
          echo "" >> conformance-report.md
          echo "**Status:** ${{ job.status }}" >> conformance-report.md
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> conformance-report.md
          echo "" >> conformance-report.md
          echo "### Test Execution Summary" >> conformance-report.md
          dotnet test tests/conformance/Excalibur.Dispatch.Tests.Conformance/Excalibur.Dispatch.Tests.Conformance.csproj \
            --filter "FullyQualifiedName~${{ matrix.transport }}TransportConformanceTests" \
            --list-tests --verbosity quiet || true

      - name: Upload conformance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ${{ matrix.transport }}-conformance-report
          path: conformance-report.md
          retention-days: 90

  conformance-summary:
    name: Conformance Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: conformance-matrix
    if: always()
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Download all conformance reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-conformance-report'
          path: reports/

      - name: Generate summary report
        run: |
          echo "# Transport Conformance Test Summary" > summary.md
          echo "" >> summary.md
          echo "**Run Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> summary.md
          echo "**Commit:** ${{ github.sha }}" >> summary.md
          echo "" >> summary.md
          echo "| Transport | Status | Report |" >> summary.md
          echo "|-----------|--------|--------|" >> summary.md

          for report in reports/*-conformance-report/*.md; do
            if [ -f "$report" ]; then
              transport=$(basename "$(dirname "$report")" | sed 's/-conformance-report//')
              status=$(grep "Status:" "$report" | cut -d ':' -f 2 | xargs || echo "Unknown")
              echo "| $transport | $status | [View](./$(basename "$(dirname "$report")")/conformance-report.md) |" >> summary.md
            fi
          done

          cat summary.md

      - name: Upload summary report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-summary
          path: summary.md
          retention-days: 90

      - name: Post summary to PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            try {
              const summary = fs.readFileSync('summary.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } catch (error) {
              core.warning(`Failed to post conformance summary to PR: ${error.message}`);
            }

  conformance-gate:
    name: Conformance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: conformance-matrix
    if: always()
    continue-on-error: ${{ github.event_name == 'pull_request' }}

    steps:
      - name: Check conformance test results
        run: |
          if [ "${{ needs.conformance-matrix.result }}" != "success" ]; then
            echo "❌ Conformance tests failed!"
            echo "At least one transport failed conformance testing."
            echo "Review the test results and fix failing transports before merging."
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "⚠️ Advisory on PRs -- this failure does not block merge."
            fi
            exit 1
          else
            echo "✅ All conformance tests passed!"
            echo "All transports are compliant with the Dispatch transport contract."
          fi
