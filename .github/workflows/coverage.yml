name: Coverage Analysis

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: 'Git ref to checkout'
        required: true
        type: string
      checkout-token:
        description: 'Token for checkout (defaults to github.token)'
        required: false
        type: string
        default: ''
      event-name:
        description: 'The triggering event name (push, pull_request, etc.)'
        required: true
        type: string
      coverage-threshold:
        description: 'Aspirational coverage target, reported as a gap. NOT enforced -- see coverage-floor.'
        required: false
        type: string
        default: '65'
      coverage-floor:
        description: >-
          Enforced ratchet floor: the level a green run already clears, so a breach is a REGRESSION
          rather than an unmet stretch goal. Below this the job fails. Raise it only when a green
          run has sustained the higher figure; it must never be lowered to make a red run pass.
          Mirrors COVERAGE_THRESHOLD in quality-gates.yml, which enforces the same floor on the push path.
        required: false
        type: string
        default: '44'
      pr-base-sha:
        description: 'Base SHA for PR coverage diff (empty if not a PR)'
        required: false
        type: string
        default: ''
      pr-number:
        description: 'PR number for coverage diff (empty if not a PR)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
  COVERAGE_FLOOR: ${{ inputs.coverage-floor }}

jobs:
  coverage-enforce:
    name: Coverage Gate Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
      # merge-multiple is deliberately ABSENT. It flattens every shard into one directory, which
      # destroys the only thing that attributes a report to the shard that produced it -- and the
      # completeness check below needs exactly that attribution. It is also the flag that once put six
      # concurrent writers on one path and produced a corrupt 31MB document, on a run where every
      # shard had SUCCEEDED.
      - name: Download unit coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: code-coverage-unit-*
          path: cov
      # This replaced a count > 0 check, which was the vacuous form of the question: ONE shard
      # reporting satisfied a six-shard expectation, so five shards could vanish and the gate would
      # compute a confident percentage from the sixth. A missing report and a low percentage are
      # OPPOSITE problems with opposite fixes, and a number derived from a partial measurement is
      # worse than no number, because it looks like a measurement.
      #
      # The expected set is read from ci.yml's own unit-tests matrix rather than restated here, so it
      # cannot drift away from the set that actually runs. ci.yml is this reusable workflow's only
      # caller. Exit 3 is INCOMPLETE and exit 4 is UNKNOWABLE; both are REFUSE, neither is a pass.
      - name: Verify every shard reported
        shell: bash
        run: |
          bash eng/ci/coverage-shard-reports-complete.sh \
            --coverage-root cov \
            --workflow .github/workflows/ci.yml \
            --job unit-tests \
            --artifact-prefix code-coverage-unit-
      # The set MEASURED must equal the set ENFORCED, and it did not. The download pattern above is
      # code-coverage-unit-*, which also matches code-coverage-unit-async-risk-*: the two async-risk
      # shards contribute roughly a quarter of the coverage data. The check above reads its expected
      # set from ci.yml's unit-tests matrix, so those two shards were INVISIBLE to it -- their reports
      # were counted in the percentage but never required to exist.
      #
      # That is a hole in the direction this gate exists to close. The async-risk tier is
      # continue-on-error before a merge lands, so one tolerated failure removed its slice and the
      # completeness check still reported PASS; the floor below then enforced a number computed from
      # partial data. Nothing in the run said so, and re-baselining against such a run would bake the
      # loss in permanently.
      #
      # Their upload is now unconditional, so this should not trigger. That is the point: it is the
      # arm that fails distinctly (exit 3, INCOMPLETE) if it ever does, rather than letting a missing
      # quarter of the measurement arrive as a coverage regression.
      - name: Verify every async-risk shard reported
        shell: bash
        run: |
          bash eng/ci/coverage-shard-reports-complete.sh \
            --coverage-root cov \
            --workflow .github/workflows/ci.yml \
            --job unit-tests-async-risk \
            --artifact-prefix code-coverage-unit-async-risk-
      - name: Measure coverage threshold (report-only)
        id: coverage_threshold
        shell: pwsh
        run: |
          ./eng/ci/coverage-threshold.ps1 `
            -CoverageRoot "cov" `
            -Threshold ([int]'${{ env.COVERAGE_THRESHOLD }}')
      # Its own arms first: a report nobody can see fail is not evidence.
      - name: changed-code-coverage self-test (non-vacuity)
        if: inputs.pr-base-sha != ''
        run: python3 eng/ci/changed-code-coverage.py --self-test
      # The baseline answers "how covered is the repository" -- a figure no single change can move
      # and no author can act on. This answers "did this change bring its own coverage", which is
      # the question a reviewer actually has. Both are shown together because either alone misleads:
      # a repository can hold a steady baseline for months while every new line arrives untested.
      #
      # It reuses the reports downloaded above and a diff git already has. No extra collector, no
      # second test run, no additional aggregation job -- the duplicate coverage run was removed
      # deliberately and this must not reintroduce one.
      #
      # DISPLAY ONLY. No threshold is applied. A changed-code floor is a policy decision and is not
      # taken here; the final `exit 0` below is that decision made explicit, not an oversight.
      - name: Changed-code coverage (display only)
        if: inputs.pr-base-sha != ''
        shell: bash
        run: |
          set -uo pipefail
          BASE='${{ inputs.pr-base-sha }}'
          if ! git fetch --no-tags --depth=1 origin "$BASE" >/dev/null 2>&1; then
            echo "::warning::Could not fetch base ${BASE}; changed-code coverage was NOT computed. That is 'not measured', which is not the same as '0% covered'."
            exit 0
          fi
          git diff --unified=0 "$BASE" HEAD -- src/ > changed.diff
          rc=0
          python3 eng/ci/changed-code-coverage.py \
            --coverage-root cov \
            --diff-file changed.diff \
            --baseline '${{ steps.coverage_threshold.outputs.coverage_combined_pct }}%' \
            > changed-code-coverage.md || rc=$?
          cat changed-code-coverage.md >> "$GITHUB_STEP_SUMMARY" || true
          cat changed-code-coverage.md
          if [ "$rc" -eq 2 ]; then
            echo "::warning::Changed-code coverage could not be produced: no parseable reports. This is 'no data', not 'nothing covered'."
          fi
          exit 0
      - name: Enforce coverage floor, report against target
        shell: bash
        run: |
          combined="${{ steps.coverage_threshold.outputs.coverage_combined_pct }}"
          dispatch="${{ steps.coverage_threshold.outputs.coverage_dispatch_pct }}"
          excalibur="${{ steps.coverage_threshold.outputs.coverage_excalibur_pct }}"
          target="${{ env.COVERAGE_THRESHOLD }}"
          floor="${{ env.COVERAGE_FLOOR }}"

          echo "Coverage (Dispatch): ${dispatch}%"
          echo "Coverage (Excalibur): ${excalibur}%"
          echo "Coverage (Combined): ${combined}%"
          echo "Enforced floor: ${floor}%   Target: ${target}%"

          # THREE states, three exits.
          #
          # This job is named "Coverage Gate Enforcement" and reachable ONLY from ci.yml, which is
          # the path every change actually takes. It previously enforced nothing: below-target
          # emitted a ::warning:: and the job went green, so the name promised a gate that did not
          # exist. A gate that cannot fail is a success signal with no mechanism behind it.
          #
          # It now enforces the RATCHET FLOOR (the level a green run already clears, so this can
          # only catch a REGRESSION) and reports the gap to the aspirational TARGET separately.
          # Floor and target are different questions and must not share one number: enforcing the
          # target would fail every run today, and reporting the floor would enforce nothing.
          #
          # No figure at all is neither -- it is a broken instrument, and reporting success for a
          # measurement that never happened is the one thing a gate must never do.
          # (quality-gates.yml carries the same contract on the push path. They are a pair.)
          if [ -z "$combined" ]; then
            echo "::error::Coverage REFUSE — the threshold script emitted no combined figure, so coverage was NOT measured. This is not a pass: fix the coverage instrument or the report inputs."
            exit 1
          fi

          if (( $(awk "BEGIN {print ($combined < $floor)}") )); then
            echo "::error::Coverage REGRESSED below the enforced floor: combined ${combined}% < ${floor}%. The floor is the level a green run already clears, so this is a drop, not a stretch goal."
            exit 1
          fi

          if (( $(awk "BEGIN {print ($combined < $target)}") )); then
            echo "::warning::Coverage ${combined}% clears the enforced floor (${floor}%) but is below the target (${target}%). Gap: $(awk "BEGIN {printf \"%.1f\", $target - $combined}") points."
          else
            echo "✅ Coverage target met: ${combined}% >= ${target}%."
          fi

  coverage-diff:
    name: Coverage Diff On Touched Files
    if: inputs.event-name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.pr-base-sha }}
          path: base
          fetch-depth: 1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.x
      - name: Resolve base unit test solution filter
        working-directory: base
        shell: bash
        run: |
          roots=(
            "eng/ci/shards"
            "eng/ci"
            "."
          )

          names=(
            "UnitTests.slnf"
            "TestsOnly.slnf"
            "UnitTests-Core.slnf"
            "Excalibur.sln"
          )

          selected=""
          for root in "${roots[@]}"; do
            for name in "${names[@]}"; do
              candidate="$root/$name"
              if [[ -f "$candidate" ]]; then
                selected="$candidate"
                break 2
              fi
            done
          done

          if [[ -z "$selected" ]]; then
            if [[ -f "Excalibur.sln" ]]; then
              selected="Excalibur.sln"
            else
              selected="$(find . -maxdepth 4 -type f \( -name "*.slnf" -o -name "*.sln" \) -print | sort | head -n 1 || true)"
              selected="${selected#./}"
            fi
          fi

          if [[ -z "$selected" ]]; then
            echo "No supported unit test solution filter found in known shard locations."
            echo "Searched roots: ${roots[*]}"
            echo "Available .slnf/.sln files (depth <= 6):"
            find . -maxdepth 6 -type f \( -name "*.slnf" -o -name "*.sln" \) -print | sort || true
            exit 1
          fi

          echo "Using base solution filter: $selected"
          echo "BASE_UNIT_TESTS_SLNF=$selected" >> "$GITHUB_ENV"
      - name: Restore & build base
        id: base_restore_build
        continue-on-error: true
        working-directory: base
        run: |
          bash ./build.sh --restore --project "$BASE_UNIT_TESTS_SLNF"
          bash ./build.sh --build --no-restore --project "$BASE_UNIT_TESTS_SLNF"
      - name: Mark base build status
        shell: bash
        run: |
          if [[ "${{ steps.base_restore_build.outcome }}" != "success" ]]; then
            echo "::warning::Base snapshot restore/build failed; skipping coverage diff for this PR."
            echo "SKIP_COVERAGE_DIFF=true" >> "$GITHUB_ENV"
          fi
      - name: Run tests with coverage (base)
        id: base_test_coverage
        if: env.SKIP_COVERAGE_DIFF != 'true'
        continue-on-error: true
        working-directory: base
        run: |
          bash ../eng/ci/run-filtered-tests.sh \
            --filter "(Category=Unit|Category=DependencyInjection)&Category!=Performance" -- \
            "$BASE_UNIT_TESTS_SLNF" \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=minimal" \
            --collect:"XPlat Code Coverage" \
            --results-directory ../base-cov \
            -- RunConfiguration.TestSessionTimeout=1200000 DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura
      - name: Mark base test status
        if: env.SKIP_COVERAGE_DIFF != 'true'
        shell: bash
        run: |
          if [[ "${{ steps.base_test_coverage.outcome }}" != "success" ]]; then
            echo "::warning::Base snapshot tests/coverage failed; skipping coverage diff for this PR."
            echo "SKIP_COVERAGE_DIFF=true" >> "$GITHUB_ENV"
          fi
      - name: Create empty changed file set when coverage diff is skipped
        if: env.SKIP_COVERAGE_DIFF == 'true'
        shell: bash
        run: |
          printf '[]' > changed-files.json
      - name: Download head coverage artifacts (all shards)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: code-coverage-unit-*
          path: head-cov
          merge-multiple: true
      - name: List changed files
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ inputs.pr-number }}"
          BASE_SHA="${{ inputs.pr-base-sha }}"
          PR_REF="refs/remotes/origin/pr-${PR_NUMBER}"

          # Use git-based PR head ref resolution to avoid transient GitHub API failures.
          if ! git -C base fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/head:${PR_REF}"; then
            echo "::warning::Unable to fetch PR head ref for #${PR_NUMBER}; defaulting to an empty changed file set."
            printf '[]' > changed-files.json
            exit 0
          fi

          # Ensure the target base commit exists in the shallow checkout.
          if ! git -C base cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            if ! git -C base fetch --no-tags --depth=1 origin "${BASE_SHA}"; then
              echo "::warning::Unable to fetch base SHA ${BASE_SHA}; defaulting to an empty changed file set."
              printf '[]' > changed-files.json
              exit 0
            fi
          fi

          # With shallow PR fetches, merge-base may be missing; deepen only when necessary.
          if ! git -C base merge-base "${BASE_SHA}" "${PR_REF}" >/dev/null 2>&1; then
            for depth in 64 256 1024 4096; do
              if git -C base fetch --no-tags --depth="${depth}" origin "refs/pull/${PR_NUMBER}/head:${PR_REF}" && \
                 git -C base merge-base "${BASE_SHA}" "${PR_REF}" >/dev/null 2>&1; then
                break
              fi
            done
          fi

          if git -C base merge-base "${BASE_SHA}" "${PR_REF}" >/dev/null 2>&1; then
            git -C base diff --name-only "${BASE_SHA}...${PR_REF}" > changed-files.txt
          else
            echo "::warning::No merge base between ${BASE_SHA} and ${PR_REF}; using two-dot diff fallback."
            git -C base diff --name-only "${BASE_SHA}..${PR_REF}" > changed-files.txt
          fi

          python3 - <<'PY'
          import json

          with open("changed-files.txt", "r", encoding="utf-8") as fh:
              files = [line.strip() for line in fh if line.strip()]

          with open("changed-files.json", "w", encoding="utf-8") as out:
              json.dump(files, out)

          print(f"Changed files discovered: {len(files)}")
          PY
      - name: Enforce ≤1% coverage drop on touched files (Dispatch+Excalibur)
        shell: pwsh
        run: |
          if ($env:SKIP_COVERAGE_DIFF -eq 'true') {
            Write-Warning 'Base snapshot did not build/test cleanly; skipping coverage diff.'
            exit 0
          }
          $changedFile = "changed-files.json"
          $changed = @()
          if (Test-Path $changedFile) {
            $changed = (Get-Content -Raw -- $changedFile | ConvertFrom-Json)
          }
          if (-not $changed) { Write-Host 'No changed files'; exit 0 }
          function NormalizeSourcePath([string]$path) {
            if ([string]::IsNullOrWhiteSpace($path)) { return $null }
            $p = $path.Replace('\','/')
            $uri = $null
            if ([Uri]::TryCreate($p, [UriKind]::Absolute, [ref]$uri)) {
              try { $p = $uri.AbsolutePath } catch { }
            }
            if ($p -match '(?i)(src/(Dispatch|Excalibur)/.+)$') { return $Matches[1] }
            return $null
          }
          function GetLineStats([System.Xml.XmlElement]$cls) {
            $lc = [string]$cls.GetAttribute('lines-covered')
            $lv = [string]$cls.GetAttribute('lines-valid')
            if (-not [string]::IsNullOrWhiteSpace($lc) -and -not [string]::IsNullOrWhiteSpace($lv)) {
              return [pscustomobject]@{ Covered = [int]$lc; Valid = [int]$lv }
            }
            [int]$covered = 0
            [int]$valid = 0
            foreach ($line in $cls.SelectNodes('lines/line')) {
              $valid++
              if ([int]$line.hits -gt 0) { $covered++ }
            }
            return [pscustomobject]@{ Covered = $covered; Valid = $valid }
          }
          function ReadCoverage([string]$dir) {
            $map = @{}
            $covFiles = @(Get-ChildItem -Recurse -Filter coverage.cobertura.xml -Path $dir)
            $lineHits = @{}
            foreach ($cov in $covFiles) {
              $xml = [xml](Get-Content -Raw -- $cov.FullName)
              foreach ($cls in $xml.SelectNodes('//class')) {
                $normalized = NormalizeSourcePath ([string]$cls.GetAttribute('filename'))
                if ($null -eq $normalized) { continue }
                foreach ($line in $cls.SelectNodes('lines/line')) {
                  $lineNumber = 0
                  if (-not [int]::TryParse([string]$line.GetAttribute('number'), [ref]$lineNumber)) { continue }
                  if ($lineNumber -lt 1) { continue }
                  $hits = 0
                  [int]::TryParse([string]$line.GetAttribute('hits'), [ref]$hits) | Out-Null
                  $lineKey = "$normalized`:$lineNumber"
                  if ($lineHits.ContainsKey($lineKey)) {
                    if ($hits -gt [int]$lineHits[$lineKey]) {
                      $lineHits[$lineKey] = $hits
                    }
                  } else {
                    $lineHits[$lineKey] = $hits
                  }
                }
              }
            }
            foreach ($entry in $lineHits.GetEnumerator()) {
              $separator = $entry.Key.LastIndexOf(':')
              if ($separator -lt 1) { continue }
              $filePath = $entry.Key.Substring(0, $separator)
              if (-not $map.ContainsKey($filePath)) {
                $map[$filePath] = [pscustomobject]@{ Covered = 0; Valid = 0 }
              }
              $map[$filePath].Valid++
              if ([int]$entry.Value -gt 0) {
                $map[$filePath].Covered++
              }
            }
            return $map
          }
          $baseMap = ReadCoverage "base-cov"
          $headMap = ReadCoverage "head-cov"
          $fail = $false
          foreach ($file in $changed) {
            $normalizedFile = NormalizeSourcePath $file
            if ($null -eq $normalizedFile) { continue }
            $b = $baseMap[$normalizedFile]
            $h = $headMap[$normalizedFile]
            if (-not $h) { continue }
            $bPct = if ($b -and $b.Valid -gt 0) { 100.0 * $b.Covered / $b.Valid } else { 0 }
            $hPct = if ($h.Valid -gt 0) { 100.0 * $h.Covered / $h.Valid } else { 0 }
            $delta = [math]::Round($hPct - $bPct, 2)
            Write-Host "${normalizedFile}: base=$([math]::Round($bPct,2)) head=$([math]::Round($hPct,2)) delta=$delta"
            if ($delta -lt -1.0) { $fail = $true }
          }
          if ($fail) { Write-Error 'Coverage drop >1% on touched src/Dispatch or src/Excalibur files'; exit 1 } else { exit 0 }

  coverage:
    name: Coverage Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Download coverage artifacts (all shards)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: code-coverage-*
          path: coverage
          merge-multiple: true

      - name: Install ReportGenerator
        # `dotnet tool restore` installs the versions pinned in .config/dotnet-tools.json rather
        # than whatever is newest today. A floating tool is an unpinned input to the build: it can
        # change output, or break, on a day nothing in this repository changed. The manifest is
        # tracked, so the version is reviewable and Dependabot can propose updates to it.
        run: dotnet tool restore

      - name: Generate coverage report
        run: |
          shopt -s globstar nullglob
          reports=(coverage/**/coverage.cobertura.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            # This used to write "Line coverage: 0" and exit 0 -- a FABRICATED measurement. Zero
            # percent is a finding about the code; no reports is a finding about the pipeline, and
            # they are not the same fact. The placeholder made them indistinguishable to every reader
            # downstream, and the one that reads a coverage summary is looking for a number, so it
            # would have found one.
            #
            # This job is report-only and runs under always(), so it does not fail the build here --
            # it emits an unmistakably non-numeric marker instead. Nothing can parse a percentage out
            # of it, which is the entire point.
            echo "::warning::No coverage reports found. Emitting a NO DATA marker, NOT a zero."
            mkdir -p management/reports/CoverageReport
            {
              echo "Coverage Summary"
              echo "Line coverage: NO DATA -- no cobertura reports reached this job."
              echo "This is not 0%. A missing measurement and a measured zero are different facts."
            } > management/reports/CoverageReport/Summary.txt
            exit 0
          fi

          dotnet reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:"management/reports/CoverageReport" \
            -reporttypes:"Html;Cobertura;TextSummary;Badges" \
            -assemblyfilters:"-*.Tests*;-Tests.Shared;-*.Testing*;-*Benchmarks*;-*Examples*" \
            -classfilters:"-*.Migrations.*;-*.Generated.*" \
            -verbosity:Warning

      - name: Coverage validation
        run: |
          if [ -f "management/reports/CoverageReport/Summary.txt" ]; then
            cat management/reports/CoverageReport/Summary.txt

            # Extract line coverage percentage
            line_coverage=$(grep -oP 'Line coverage: \K[0-9.]+' management/reports/CoverageReport/Summary.txt || echo "0")

            echo "Line coverage: ${line_coverage}%"
            echo "COVERAGE_PERCENTAGE=${line_coverage}" >> $GITHUB_ENV

            # Check against threshold
            if (( $(echo "${line_coverage} < ${COVERAGE_THRESHOLD}" | bc -l) )); then
              echo "Coverage ${line_coverage}% is below threshold ${COVERAGE_THRESHOLD}%"
              echo "COVERAGE_STATUS=warning" >> $GITHUB_ENV
            else
              echo "Coverage ${line_coverage}% meets threshold ${COVERAGE_THRESHOLD}%"
              echo "COVERAGE_STATUS=success" >> $GITHUB_ENV
            fi
          else
            echo "Coverage report not found"
            echo "COVERAGE_STATUS=failed" >> $GITHUB_ENV
            echo "COVERAGE_PERCENTAGE=0" >> $GITHUB_ENV
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: management/reports/CoverageReport
          retention-days: 30

      - name: Coverage summary
        run: |
          echo "## Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "**Overall Coverage:** ${{ env.COVERAGE_PERCENTAGE }}%" >> $GITHUB_STEP_SUMMARY
          echo "**Threshold:** ${{ env.COVERAGE_THRESHOLD }}%" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ env.COVERAGE_STATUS }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.COVERAGE_STATUS }}" = "success" ]; then
            echo "Coverage meets quality standards" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ env.COVERAGE_STATUS }}" = "warning" ]; then
            echo "Coverage below threshold but acceptable for current phase" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage analysis failed" >> $GITHUB_STEP_SUMMARY
          fi

  coverage-baseline:
    name: Coverage Baseline Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.checkout-ref }}
      - name: Create coverage baseline markdown
        shell: bash
        run: |
          mkdir -p management/reports
          f="management/reports/coverage-${GITHUB_RUN_ID}.md"
          echo "# Coverage Baseline" > "$f"
          echo "Run: ${GITHUB_RUN_ID}" >> "$f"
          echo "Workflow: ${GITHUB_WORKFLOW}" >> "$f"
          echo "Artifacts contain Cobertura XML from CI test jobs." >> "$f"
          echo "See uploaded artifacts: code-coverage-*" >> "$f"
      - name: Upload coverage baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-baseline
          path: management/reports/coverage-${{ github.run_id }}.md
